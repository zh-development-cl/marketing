<title>CRM ZH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600&family=Funnel+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* CRM ZH · ZH Development SpA
   Layout: barra lateral en tinta (escritorio) o barra inferior (teléfono); el trabajo del día en
   paneles sobre papel; la ficha del lead se abre como cajón a la derecha y los borradores en un
   editor con vista previa. Tokens tomados de la landing (tinta, papel y señal azul). */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --sunken: #ECEFF4;
  --line: #E1E6EE;
  --line-2: #CAD2DE;
  --fg: #0B0F17;
  --fg-2: #3A4557;
  --fg-3: #5D6777;
  --accent: #245CE4;
  --accent-soft: #E7EDFC;
  --btn: #245CE4;
  --btn-hover: #1F55D9;
  --on-btn: #FFFFFF;
  --focus: #245CE4;
  --side-bg: #07090F;
  --side-fg: #EDF0F5;
  --side-fg-2: #A3ADBE;
  --side-line: rgba(255, 255, 255, 0.08);
  --side-tint: rgba(255, 255, 255, 0.07);
  --side-accent: #8FB0FF;
  --ok: #17784A;
  --ok-soft: #E1F3E8;
  --warn: #8F5A00;
  --warn-soft: #FBF0D9;
  --bad: #B3261E;
  --bad-soft: #FCE8E6;
  --bubble: #E3F0FF;
  --shadow: 0 1px 2px rgba(11, 15, 23, 0.06), 0 12px 32px rgba(11, 15, 23, 0.12);
  --scrim: rgba(7, 9, 15, 0.42);
  --font-display: "Funnel Display", "Funnel Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-text: "Funnel Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  /* Embudo: fondo de las columnas, sombra de las tarjetas y un azul por etapa (más intenso cuanto
     más cerca del cierre). */
  --col-bg: #EBEEF4;
  --card-shadow: 0 1px 2px rgba(11, 15, 23, 0.05);
  --card-shadow-hover: 0 2px 6px rgba(11, 15, 23, 0.07), 0 10px 24px rgba(11, 15, 23, 0.08);
  --st-nuevo: #98A2B3;
  --st-contactado: #8AA9F2;
  --st-reunion_agendada: #6690EE;
  --st-reunion_concretada: #4576EA;
  --st-propuesta: #245CE4;
  --st-negociacion: #1A45B0;
  --st-ganado: #17784A;
  --st-perdido: #B3261E;
  --st-pausa: #5D6777;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090F; --surface: #0D1119; --surface-2: #10151F; --sunken: #151B27; --line: #1C2331; --line-2: #2C3547;
    --fg: #EDF0F5; --fg-2: #AEB7C6; --fg-3: #8591A6; --accent: #8FB0FF; --accent-soft: rgba(143, 176, 255, 0.13);
    --btn: #306BFF; --btn-hover: #4A7DFF; --on-btn: #FFFFFF; --focus: #8FB0FF;
    --side-bg: #04060A; --side-line: rgba(255, 255, 255, 0.07);
    --ok: #63D394; --ok-soft: rgba(99, 211, 148, 0.13); --warn: #F2B85B; --warn-soft: rgba(242, 184, 91, 0.13);
    --bad: #FF8F86; --bad-soft: rgba(255, 143, 134, 0.13); --bubble: #13284A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55); --scrim: rgba(0, 0, 0, 0.62);
    --col-bg: #0A0D14; --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --card-shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.5);
    --st-nuevo: #667085; --st-contactado: #4F6FB8; --st-reunion_agendada: #6489E8; --st-reunion_concretada: #7C9EF4; --st-propuesta: #98B4FF; --st-negociacion: #BFD0FF;
    --st-ganado: #63D394; --st-perdido: #FF8F86; --st-pausa: #8591A6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07090F; --surface: #0D1119; --surface-2: #10151F; --sunken: #151B27; --line: #1C2331; --line-2: #2C3547;
  --fg: #EDF0F5; --fg-2: #AEB7C6; --fg-3: #8591A6; --accent: #8FB0FF; --accent-soft: rgba(143, 176, 255, 0.13);
  --btn: #306BFF; --btn-hover: #4A7DFF; --on-btn: #FFFFFF; --focus: #8FB0FF;
  --side-bg: #04060A; --side-line: rgba(255, 255, 255, 0.07);
  --ok: #63D394; --ok-soft: rgba(99, 211, 148, 0.13); --warn: #F2B85B; --warn-soft: rgba(242, 184, 91, 0.13);
  --bad: #FF8F86; --bad-soft: rgba(255, 143, 134, 0.13); --bubble: #13284A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55); --scrim: rgba(0, 0, 0, 0.62);
  --col-bg: #0A0D14; --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --card-shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.5);
  --st-nuevo: #667085; --st-contactado: #4F6FB8; --st-reunion_agendada: #6489E8; --st-reunion_concretada: #7C9EF4; --st-propuesta: #98B4FF; --st-negociacion: #BFD0FF;
  --st-ganado: #63D394; --st-perdido: #FF8F86; --st-pausa: #8591A6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.5 var(--font-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.eyebrow { font: 500 12px/1.35 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- arranque ---------- */
.boot { min-height: 100%; display: grid; place-items: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.boot-card { max-width: 30rem; display: grid; gap: 14px; }
.boot-card svg { width: 44px; height: 44px; }
.boot-card h1 { font-size: 28px; line-height: 1.15; }
.boot-card p:last-child { color: var(--fg-2); }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  background: var(--side-bg); color: var(--side-fg); border-right: 1px solid var(--side-line);
  display: flex; flex-direction: column; gap: 28px; padding: 22px 14px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 600 16px/1 var(--font-display); letter-spacing: -0.01em; }
.brand span { font: 500 11px/1 var(--font-mono); letter-spacing: 0.16em; color: var(--side-fg-2); text-transform: uppercase; }
.brand-txt { display: grid; gap: 5px; min-width: 0; }
.nav { display: grid; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--side-fg-2); font-size: 15px; font-weight: 500; text-align: left;
}
.nav button:hover { background: var(--side-tint); color: var(--side-fg); }
.nav button[aria-current="page"] { background: var(--side-tint); color: var(--side-fg); }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font: 500 12px/1 var(--font-mono); color: var(--side-fg-2); font-variant-numeric: tabular-nums; }
.nav button[aria-current="page"] .count { color: var(--side-accent); }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 8px; }
.side-foot p { font-size: 12.5px; color: var(--side-fg-2); line-height: 1.45; }
.side .btn.primary { justify-content: center; }
.me { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--side-fg); }
.me img { width: 26px; height: 26px; border-radius: 50%; flex: none; }

.main { min-width: 0; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.topbar, .tabs { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--side-bg); color: var(--side-fg); padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar .brand { padding: 0; }
  .topbar .brand svg { width: 26px; height: 26px; }
  .topbar .grow { flex: 1; }
  .tabs {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tabs button { display: grid; justify-items: center; gap: 3px; padding: 9px 2px 8px; border: 0; background: transparent; color: var(--fg-3); font-size: 11.5px; font-weight: 500; position: relative; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button[aria-current="page"] { color: var(--accent); }
  .tabs .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--btn); color: var(--on-btn); font: 600 10px/16px var(--font-text); }
  .main { padding-block: 18px 104px; }
}

/* ---------- piezas comunes ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--fg);
  font-size: 14px; font-weight: 500; line-height: 1; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--fg-3); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.btn.primary:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn.claude { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.claude:hover { border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 30px; padding: 0 11px; font-size: 13px; }
.btn.icon { width: 36px; padding: 0; }
.btn.small.icon { width: 30px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.side .btn:not(.primary) { background: transparent; border-color: var(--side-line); color: var(--side-fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; padding: 16px 18px 6px; }
.panel-head h2 { font-size: 17px; }
.panel-body { padding: 4px 18px 16px; }
.empty { padding: 14px 0 6px; color: var(--fg-3); font-size: 14px; }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.page-head > div:first-child { display: grid; gap: 6px; min-width: 0; }
.page-head h1 { font-size: clamp(27px, 1.6vw + 18px, 34px); line-height: 1.1; }
.page-head .lede { color: var(--fg-2); max-width: 46rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.stage { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 9px; border-radius: 999px; background: var(--sunken); color: var(--fg-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.stage i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.stage.ok i { background: var(--ok); }
.stage.bad i { background: var(--bad); }
.stage.muted i { background: var(--fg-3); }
.meter { display: inline-grid; grid-auto-flow: column; gap: 3px; vertical-align: middle; }
.meter b { width: 11px; height: 4px; border-radius: 2px; background: var(--line-2); }
.meter b.on { background: var(--accent); }
.meter.ok b { background: var(--ok); }
.meter.bad b { background: transparent; box-shadow: inset 0 0 0 1px var(--bad); }
.meter.muted b.on { background: var(--fg-3); }

.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--fg-2); font: 500 12px/1.35 var(--font-text); letter-spacing: 0; white-space: nowrap; }
.tag.late { background: var(--bad-soft); color: var(--bad); }
.tag.today { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--fg-2); }
.chip:hover { border-color: var(--fg-3); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }

.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.hint { font-size: 12.5px; color: var(--fg-3); }
.input, .select, .textarea {
  width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--r-s);
  background: var(--surface); color: var(--fg); font-size: 14.5px;
}
.textarea { min-height: 92px; line-height: 1.5; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.input[disabled], .select[disabled], .textarea[disabled] { opacity: 0.6; }
.input.mono { font-family: var(--font-mono); font-size: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; align-items: start; }
.span-2 { grid-column: 1 / -1; }
@media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg-2); }
.check input { margin-top: 3px; accent-color: var(--btn); }

.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--sunken); gap: 2px; }
.seg button { min-height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--fg-2); font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(11, 15, 23, 0.12); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-m); background: var(--sunken); color: var(--fg-2); font-size: 13.5px; }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }

.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; font-weight: 500; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

/* ---------- hoy ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: inline-flex; align-items: baseline; gap: 8px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; color: var(--fg-2); }
.stat b { font: 600 18px/1 var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }
.stat.alert b { color: var(--bad); }
.stat button { all: unset; cursor: pointer; }

.lrows { display: grid; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow-main { all: unset; cursor: pointer; display: grid; gap: 2px; min-width: 0; border-radius: 6px; }
.lrow-main:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.lrow-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow-sub { font-size: 13.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow-note { font-size: 13.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.lrow-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.lrow-actions { display: flex; gap: 6px; }
@media (max-width: 520px) { .lrow { grid-template-columns: minmax(0, 1fr); } .lrow-side { justify-content: flex-start; } }

.feed { display: grid; }
.feed-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.feed-item:first-child { border-top: 0; }
.feed-ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--fg-2); }
.feed-ico svg { width: 15px; height: 15px; }
.feed-ico.claude { background: var(--accent-soft); color: var(--accent); }
.feed-title { font-size: 14px; }
.feed-title button { all: unset; cursor: pointer; font-weight: 600; }
.feed-title button:hover { text-decoration: underline; }
.feed-meta { font-size: 12.5px; color: var(--fg-3); }
.feed-text { font-size: 14px; color: var(--fg-2); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }

.onboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.onboard li { list-style: none; display: grid; gap: 6px; align-content: start; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2); }
.onboard ol { display: contents; }
.onboard h3 { font-size: 16px; }
.onboard p { font-size: 14px; color: var(--fg-2); }
@media (max-width: 760px) { .onboard { grid-template-columns: minmax(0, 1fr); } }

/* ---------- leads ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--fg-3); pointer-events: none; }
.search .input { padding-left: 34px; }
.toolbar .select { width: auto; min-width: 0; flex: 0 1 auto; }
.table-wrap { overflow-x: auto; }
table.leads { width: 100%; border-collapse: collapse; font-size: 14px; }
table.leads th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font: 500 11px/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; }
table.leads td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.leads tbody tr { cursor: pointer; }
table.leads tbody tr:hover td { background: var(--surface-2); }
table.leads tbody tr:last-child td { border-bottom: 0; }
.cell-name { display: grid; gap: 2px; min-width: 170px; }
.cell-name b { font-weight: 600; }
.cell-name span { color: var(--fg-3); font-size: 13px; }

/* ---------- embudo ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; }

.kcard { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); cursor: grab; text-align: left; width: 100%; }

/* Mientras se arrastra, los avisos suben y no tapan las zonas de Ganado, Perdido y En pausa. */

.col-sum { margin: -2px 4px 2px; font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }

/* Columnas con el alto de la pantalla: las tarjetas que no caben se deslizan dentro de la columna. */
.board > .col { display: flex; flex-direction: column; max-height: max(440px, calc(100vh - 230px)); max-height: max(440px, calc(100dvh - 230px)); }
.col-lista { position: relative; display: grid; gap: 8px; align-content: start; flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; margin: 0 -6px; padding: 0 6px 6px; }
.col-lista.mas { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
.col-mas { flex: none; align-self: center; margin-top: 2px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg-2); font: 500 12.5px/1.2 var(--font-text); cursor: pointer; }
.col-mas:hover { color: var(--fg); border-color: var(--fg-3); }
.kcard.lead { gap: 5px; }
.kcard.lead:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.kcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

.avatar { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 10.5px/1 var(--font-text); letter-spacing: 0.02em; }
.avatar.r2 { background: var(--ok-soft); color: var(--ok); }

.avatar.pick { position: relative; cursor: pointer; }

.kcard-tags { display: flex; flex-wrap: wrap; gap: 4px; }

.kacts { display: inline-flex; gap: 2px; }

/* Cinco acciones en una tarjeta angosta: un poco más juntas. */

.dropbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow); }

/* Seis columnas (las abiertas más «Ganado», o las del embudo de clientes) caben en una pantalla de 1360 px. */
.board.embudo { grid-auto-columns: minmax(170px, 1fr); }

}

.modal-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px 16px; }

  position: relative; z-index: 1; width: min(640px, 100%); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); overflow: hidden;
}

  .modal-wrap { padding: 0; }
  .modal, .modal.wide { width: 100%; height: 100%; max-height: none; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}

@media (max-width: 900px) { .editor { grid-template-columns: minmax(0, 1fr); overflow-y: auto; } .editor-fields, .editor-preview { overflow: visible; border-right: 0; } }
.email-frame { border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); background: #EEF1F5; color: #0F1A2C; }

.import-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

/* ---------- etapa con clientes ---------- */

.drawer.wide { width: min(780px, 100%); }

.ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }

.kcard .progress { width: 100%; }
.kcard .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.box { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2); }

const keyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

const keyOf = (ts) => { const d = new Date(ts); return isNaN(d) ? "" : keyFmt.format(d); };
const keyDate = (key) => new Date(key + "T12:00:00Z");
const addDays = (key, n) => { const d = keyDate(key); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const isWeekend = (key) => { const w = keyDate(key).getUTCDay(); return w === 0 || w === 6; };
const addBusinessDays = (key, n) => { let k = key; let left = n; while (left > 0) { k = addDays(k, 1); if (!isWeekend(k)) left -= 1; } return k; };

/* La reunión ya pasó (o es hoy sin hora): hay que contar si se hizo. */
const reunionPasada = (t) => tareaPendiente(t) && tipoTarea(t.tipo) === "reunion" && !!t.fecha && (t.fecha < todayKey() || (t.fecha === todayKey() && (!isHora(t.hora) || ahoraHM() >= sumarMin(t.hora, Number(t.duracion) || DURACION_REUNION))));
/* Cuándo toca, en palabras: «atrasada 2 d», «hoy 10:00», «mañana», «vie 23 oct 11:00». */
function cuandoTarea(t) {
  if (!t || !t.fecha) return { txt: "sin fecha", tono: "" };
  const d = diffDays(todayKey(), t.fecha);
  const h = isHora(t.hora) ? " " + t.hora : "";
  if (reunionPasada(t)) return { txt: (d === 0 ? "hoy" : d === -1 ? "ayer" : `hace ${-d} d`) + h + " · ¿se hizo?", tono: "ask" };
  if (d < 0) return { txt: `atrasada ${-d} d`, tono: "late" };
  if (d === 0) return { txt: "hoy" + h, tono: tareaVencida(t) && tipoTarea(t.tipo) !== "reunion" ? "late" : "today" };
  if (d === 1) return { txt: "mañana" + h, tono: "" };
  return { txt: noDots(fmtShort.format(keyDate(t.fecha))) + h, tono: "" };
}

function ago(ts) {
  const t = Date.parse(ts || "");
  if (isNaN(t)) return "";
  const days = diffDays(keyOf(ts), todayKey());
  if (days <= 0) {
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "recién";
    if (m < 60) return `hace ${m} min`;
    return `hoy, ${fmtTime.format(new Date(t))}`;
  }
  if (days === 1) return `ayer, ${fmtTime.format(new Date(t))}`;
  if (days < 7) return `hace ${days} días`;
  return noDots(fmtTs.format(new Date(t)));
}

function newId(prefix) {
  let r = "";
  try { r = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => (b % 36).toString(36)).join(""); } catch (e) { r = Math.random().toString(36).slice(2, 8); }
  return `${prefix}-${Date.now().toString(36)}-${r}`;
}
/* Saca los undefined (la base solo guarda JSON) y recorta strings. */
function clean(v) {
  if (Array.isArray(v)) return v.map(clean).filter((x) => x !== undefined);
  if (v && typeof v === "object") {
    const o = {};
    for (const [k, x] of Object.entries(v)) { const c = clean(x); if (c !== undefined) o[k] = c; }
    return o;
  }
  if (typeof v === "string") return v.trim();
  if (typeof v === "number" && !isFinite(v)) return null;
  return v;
}

/* Teléfonos chilenos a E.164: 9 1234 5678 → +56912345678; 2 2345 6789 → +56223456789. */
function normPhone(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  const d = s.replace(/\D/g, "");
  if (!d) return "";
  if (s.startsWith("+")) return "+" + d;
  if (d.startsWith("00")) return "+" + d.slice(2);
  if (d.length === 11 && d.startsWith("56")) return "+" + d;
  if (d.length === 9) return "+56" + d;
  if (d.length === 8) return "+569" + d;
  return s;
}
function fmtPhone(e164) {
  const p = String(e164 || "");
  const m = /^\+56(\d{9})$/.exec(p);
  if (!m) return p;
  const r = m[1];
  if (r[0] === "9" || r[0] === "2") return `+56 ${r[0]} ${r.slice(1, 5)} ${r.slice(5)}`;
  return `+56 ${r.slice(0, 2)} ${r.slice(2, 5)} ${r.slice(5)}`;
}
const isPhone = (e164) => /^\+\d{8,15}$/.test(String(e164 || ""));
const waDigits = (e164) => String(e164 || "").replace(/\D/g, "");
const isEmail = (s) => /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(String(s || ""));

function waLink(phone, text, cfg) {

  return `https://wa.me/${dg}${q ? "?text=" + q : ""}`;
}

/* Copiar: el portapapeles moderno dentro del clic y, si lo rechaza, selección + execCommand. */
function execCopy(make) {
  const el = make();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  const sel = window.getSelection && window.getSelection();
  if (sel) sel.removeAllRanges();
  el.remove();
  return ok;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* respaldo */ }
  return execCopy(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    return ta;
  });
}
async function copyRich(htmlStr, text) {
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([htmlStr], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" }),
      })]);
      return true;
    }
  } catch (e) { /* respaldo */ }
  return execCopy(() => {
    const div = document.createElement("div");
    div.contentEditable = "true";
    div.style.cssText = "position:fixed;left:-9999px;top:0;width:640px";
    div.innerHTML = htmlStr;
    document.body.appendChild(div);
    const range = document.createRange();
    range.selectNodeContents(div);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return div;
  });
}

const ZH_CONTEXTO = `ZH Development SpA es una empresa chilena de software a medida, automatización e integración de sistemas, e IA aplicada con revisión humana. Trabaja con empresas de todo Chile, de forma remota. Socios: Lorenzo Bozzo (producto y negocio) y Nicolás Valdivia (tecnología e IA). Sitio: zhdevelopment.cl. Correo: contacto@zhdevelopment.cl.
Servicios: desarrollo de software a medida; automatización e integración de sistemas (ERP, CRM, flujos); IA aplicada (lectura, extracción y clasificación de documentos, asistentes con límites claros); levantamiento y mejora de procesos; diseño y desarrollo web; consultoría tecnológica.
Cómo trabaja: parte con una llamada de descubrimiento de 30 minutos por Google Meet; luego entrega una propuesta escrita con alcance, plazo y precio antes de empezar; trabaja en cuatro etapas, cada una con su entregable (Entender, Diseñar, Construir, Mejorar); el código, el repositorio y las cuentas quedan a nombre del cliente; la IA propone y el equipo del cliente aprueba.
Frases de la marca: "Software a medida, automatización e IA que conectan tu operación." "Unimos tus sistemas, automatizamos lo repetitivo y aplicamos IA con revisión humana."`;

const ZH_TONO = `Tono: profesional, claro, directo, seguro y cercano. Español de Chile. Frases cortas y verbos concretos (ordenar, conectar, automatizar, revisar). Habla del problema del cliente, no de tecnología.
Prohibido: superlativos vacíos (revolucionario, disruptivo, de última generación, increíble); la palabra "chatbot" (di "asistente"); hablar de "horas de programación"; inventar datos, cifras, plazos, precios o casos que no estén en la información entregada; mencionar a otros clientes o proyectos de ZH; citar las notas internas o revelar hipótesis internas sobre el cliente. Si falta información, escribe algo general y verdadero en vez de inventar.`;

function leadContexto(lead, hist) {
  const L = ["DATOS DEL LEAD"];

  add("Nombre", lead.nombre); add("Empresa", lead.empresa); add("Cargo", lead.cargo); add("Rubro", lead.rubro); add("Ciudad", lead.ciudad);
  add("Cómo llegó", origenLabel(lead.origen)); add("Etapa", etapaLabel(lead.etapa)); add("Qué necesita", lead.necesidad);
  add("Dolor que suponemos (hipótesis sin confirmar: no la afirmes como un hecho)", lead.dolor); add("Cómo podría ayudar ZH (idea interna: propónla en condicional)", lead.comoAyudamos);
  add("Notas internas (solo contexto)", lead.notas);
  if (Number(lead.inasistencias) > 0) add("Reuniones a las que no se presentó", String(lead.inasistencias));
  add("Guion preparado para hablar con el lead (referencia interna, no lo cites)", clip(lead.guion, 3000));
  if (lead.proxima && lead.proxima.fecha) add("Próxima acción planificada", `${accionLabel(lead.proxima.tipo)} el ${lead.proxima.fecha}${lead.proxima.nota ? " (" + lead.proxima.nota + ")" : ""}`);
  L.push("", "HISTORIAL (más reciente primero)");
  const hs = (hist || []).filter((a) => a.tipo !== "etapa").slice(0, 10);
  if (!hs.length) L.push("Sin contactos registrados: este sería el primer contacto.");
  for (const a of hs) {
    const an = a.analisis && a.analisis.resumen ? ` | Análisis: ${clip(a.analisis.resumen, 300)}` : "";
    L.push(`- ${keyOf(a.fecha)} · ${actTitulo(a)}${a.resumen ? ": " + clip(a.resumen, 400) : ""}${an}`);
  }
  return L.join("\n");
}

function promptBorrador(o) {

nion ? "próxima " : ""}reunión con día (y hora, si se dijo); si no, null. Si quedaron en reunirse pero sin día, usa null y agrega una tarea de tipo "agendar". La reunión no se repite en "tareas".\n- "tareas": solo lo que quedó acordado, con quién lo hace: "zh" es ZH (quien ${quien}) y "lead" es el lead. Tipos: "llamar" (volver a llamarlo), "whatsapp" o "correo" (mandarle un mensaje: un resumen, información, la invitación), "agendar" (coordinar el día y la hora de una reunión), "propuesta" (preparar y enviar la propuesta) u "otro". Pon "fecha" y "hora" solo si se dijeron o se deducen con claridad ("el viernes" es la fecha de ese viernes); si no, déjalas vacías.\n- "etapaSugerida": ${ETAPAS_PROMPT}. ${enReunion ? 'Después de una reunión que se hizo, lo normal es "reunion_concretada".' : 'Si quedó una reunión con día, "reunion_agendada"; si contestó y no quedó una reunión, "contactado".'} Usa "perdido" solo si dijo claramente que no le interesa, y "pausa" si pidió retomarlo más adelante.\n- "datos": solo lo que se dijo explícitamente; deja vacío lo demás.\n- "evaluacion": evalúa a quien ${quien}, solo si hay transcripción; con solo notas, usa null. Nota de 1 a 5 por criterio, o null si no se puede juzgar: ${CRITERIOS.map((c) => `${c[0]} (${c[2]})`).join("; ")}. "bien": hasta 3 cosas concretas que hizo bien. "mejorar": hasta 3 consejos concretos para la próxima ${enReunion ? "reunión" : "llamada"}, con una frase de ejemplo cuando sirva. Sé justo: si la transcripción no separa voces, deduce por el contexto quién habla y no castigues lo que no se puede saber.`;

/* Contexto de un cliente para Claude: datos, el proyecto, el cobro o la solicitud del caso y el
   historial. Las notas internas van como contexto y las reglas de tono prohíben citarlas. */
function clienteContexto(c, o) {
  const L = ["DATOS DEL CLIENTE"];
  const add = (k, v) => { if (v) L.push(`${k}: ${v}`); };
  add("Cliente", clienteName(c)); add("Razón social", c.razonSocial); add("Rubro", c.rubro); add("Ciudad", c.ciudad);
  const ct = o.contacto;
  if (ct) add("Destinatario", [ct.nombre, ct.cargo].filter(Boolean).join(", "));
  add("Notas internas (solo contexto)", c.notas);
  add("Etapa con el cliente", etapaClienteLabel(c.etapa));
  if (c.etapa === "propuesta" && c.propuesta && c.propuesta.titulo) add("Nueva propuesta en preparación", c.propuesta.titulo);
  const ms = (o.mantenciones || []).filter((m) => m.estado === "activa");
  add("Mantención técnica", ms.length ? ms.map((m) => `${m.plan || "Mantención"}: ${money(m.monto)} + IVA al mes${m.incluye ? " (incluye: " + clip(m.incluye, 220) + ")" : ""}`).join("; ") : "no tiene mantención activa");
  const p = o.proyecto;
  if (p) {
    L.push("", "PROYECTO");
    add("Nombre", p.nombre); add("Etapa", faseLabel(p.estado)); add("Inicio", p.inicio); add("Entrega estimada", p.entregaEstimada); add("Puesta en producción", p.produccion);
    const g = garantiaHasta(p, o.cfg);
    if (g) add("Garantía hasta", `${g} (${garantiaDiasDe(p, o.cfg)} días desde la puesta en producción)`);
    add("Alcance", clip(p.alcance, 1500));
    const hs = hitosDe(p);
    if (hs.length) { L.push("Hitos:"); for (const h of hs) L.push(`- ${h.hecho ? "[listo]" : "[pendiente]"} ${h.nombre}${h.fecha ? " · " + h.fecha : ""}`); }
  }
  const x = o.cobro;
  if (x) {
    L.push("", "COBRO");
    add("Concepto", x.concepto || tipoCobroLabel(x.tipo)); add("Monto", `${money(x.monto)} + IVA (total ${money(conIva(x.monto))})`);
    add("Factura", x.factura); add("Fecha de la factura", x.fechaFactura); add("Vence", venceCobro(x, o.cfg)); add("Estado", pick(ESTADOS_COBRO, x.estado));
  }
  const s = o.solicitud;
  if (s) {
    L.push("", "SOLICITUD DEL CLIENTE");
    add("Título", s.titulo); add("Lo que pidió", clip(s.descripcion, 3000)); add("Cobertura", coberturaLabel(s.cobertura)); add("Estado", solEstadoLabel(s.estado)); add("Resolución", s.resolucion);
    if (s.cotizacion && s.cotizacion.monto) add("Cotización", `${money(s.cotizacion.monto)} + IVA`);
  }
  L.push("", "HISTORIAL CON EL CLIENTE (más reciente primero)");
  const hs = (o.hist || []).slice(0, 10);
  if (!hs.length) L.push("Sin registros.");
  for (const a of hs) L.push(`- ${keyOf(a.fecha)} · ${actTitulo(a)}${a.resumen ? ": " + clip(a.resumen, 400) : ""}`);
  return L.join("\n");
}

function promptCliente(o) {

function makeApi(db, meRef) {
  const queues = new Map();
  const run = (path, fn) => {
    const prev = queues.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    queues.set(path, next);
    next.finally(() => { if (queues.get(path) === next) queues.delete(path); });
    return next;
  };
  const retry = async (fn) => {
    try { return await fn(); } catch (e) {
      if (e && e.code === "unavailable") { await sleep(400 + Math.random() * 600); return fn(); }
      if (e && e.code === "resource_exhausted") { await sleep(1800 + Math.random() * 800); return fn(); }
      throw e;
    }
  };
  const who = () => meRef.current.id || "equipo";
  const create = (col, prefix) => async (data, fixedId) => {
    const id = fixedId || newId(prefix);
    const now = nowISO();
    await run(col + "/" + id, () => retry(() => db.doc(col + "/" + id).set(clean({ ...data, creado: now, actualizado: now, creadoPor: who() }))));
    return id;
  };
  const update = (col) => (id, patch) => run(col + "/" + id, () => retry(() => db.doc(col + "/" + id).update(clean({ ...patch, actualizado: nowISO() }))));
  const remove = (col) => (id) => run(col + "/" + id, () => retry(() => db.doc(col + "/" + id).delete()));
  const idsWhere = async (col, field, value) => (await db.collection(col).where(field, "==", value).get()).docs.map((d) => d.id);
  return {
    createCliente: create("clientes", "cli"),
    updateCliente: update("clientes"),
    async deleteCliente(id) {
      for (const col of ["mantenciones", "proyectos", "cobros", "solicitudes", "actividades", "borradores"]) {
        for (const x of await idsWhere(col, "clienteId", id)) await retry(() => db.doc(col + "/" + x).delete());
      }
      for (const x of await idsWhere("leads", "clienteId", id)) await run("leads/" + x, () => retry(() => db.doc("leads/" + x).update({ clienteId: null, actualizado: nowISO() })));
      await run("clientes/" + id, () => retry(() => db.doc("clientes/" + id).delete()));
    },
    createProyecto: create("proyectos", "pro"),
    updateProyecto: update("proyectos"),
    async deleteProyecto(id) {
      const cs = await db.collection("cobros").where("proyectoId", "==", id).get();
      for (const d of cs.docs) {
        const x = d.data();
        /* Lo pagado y las mensualidades (son de la mantención) quedan en el cliente, sin proyecto. */
        if (x.estado === "pagado" || x.mantencionId) await run("cobros/" + d.id, () => retry(() => db.doc("cobros/" + d.id).update({ proyectoId: null, actualizado: nowISO() })));
        else await retry(() => db.doc("cobros/" + d.id).delete());
      }
      for (const col of ["mantenciones", "solicitudes"]) {
        for (const x of await idsWhere(col, "proyectoId", id)) await run(col + "/" + x, () => retry(() => db.doc(col + "/" + x).update({ proyectoId: null, actualizado: nowISO() })));
      }
      await run("proyectos/" + id, () => retry(() => db.doc("proyectos/" + id).delete()));
    },
    createCobro: create("cobros", "cob"),
    updateCobro: update("cobros"),
    deleteCobro: remove("cobros"),
    /* Crea un cobro con id fijo solo si no existe (mensualidades: un documento por mes). */
    async ensureCobro(id, data) {
      const s = await retry(() => db.doc("cobros/" + id).get());
      if (s.exists) return false;
      await create("cobros", "cob")(data, id);
      return true;
    },
    createMantencion: create("mantenciones", "man"),
    updateMantencion: update("mantenciones"),
    deleteMantencion: remove("mantenciones"),
    createSolicitud: create("solicitudes", "sol"),
    updateSolicitud: update("solicitudes"),
    deleteSolicitud: remove("solicitudes"),
    updateAct: update("actividades"),
    createTarea: create("tareas", "tar"),
    updateTarea: update("tareas"),
    deleteTarea: remove("tareas"),
    async createLead(data) {
      const id = newId("lead");
      const now = nowISO();
      await run("leads/" + id, () => retry(() => db.doc("leads/" + id).set(clean({ etapa: "nuevo", prioridad: "media", trato: "tu", intentos: 0, proxima: null, ...data, creado: now, actualizado: now, creadoPor: who() }))));
      return id;
    },
    updateLead: (id, patch) => run("leads/" + id, () => retry(() => db.doc("leads/" + id).update(clean({ ...patch, actualizado: nowISO() })))),
    async deleteLead(id) {
      const acts = await db.collection("actividades").where("leadId", "==", id).get();
      for (const d of acts.docs) await retry(() => db.doc("actividades/" + d.id).delete());
      const drs = await db.collection("borradores").where("leadId", "==", id).get();
      for (const d of drs.docs) await retry(() => db.doc("borradores/" + d.id).delete());
      const trs = await db.collection("tareas").where("leadId", "==", id).get();
      for (const d of trs.docs) await retry(() => db.doc("tareas/" + d.id).delete());
      await run("leads/" + id, () => retry(() => db.doc("leads/" + id).delete()));
    },
    async addAct(data) {
      const id = newId("act");
      await run("actividades/" + id, () => retry(() => db.doc("actividades/" + id).set(clean({ fecha: nowISO(), autor: who(), ...data }))));
      return id;
    },
    deleteAct: (id) => run("actividades/" + id, () => retry(() => db.doc("actividades/" + id).delete())),
    async createDraft(data) {
      const id = newId("bor");
      const now = nowISO();
      await run("borradores/" + id, () => retry(() => db.doc("borradores/" + id).set(clean({ estado: "por_revisar", ...data, creado: now, actualizado: now, autor: who() }))));
      return id;
    },
    updateDraft: (id, patch) => run("borradores/" + id, () => retry(() => db.doc("borradores/" + id).update(clean({ ...patch, actualizado: nowISO() })))),
    deleteDraft: (id) => run("borradores/" + id, () => retry(() => db.doc("borradores/" + id).delete())),
    setConfig: (data) => run("config/general", () => retry(() => db.doc("config/general").set(clean(data)))),
    setEquipo: (uid, data) => run("equipo/" + uid, () => retry(() => db.doc("equipo/" + uid).set(clean(data)))),
    /* Un documento por persona con el último resultado de «Transcribir en vivo». */
    diagMicrofono: (data) => { const p = "diagnostico/microfono-" + who(); return run(p, () => retry(() => db.doc(p).set(clean({ ...data, fecha: nowISO() })))); },
  };
}

function StagePill({ etapa }) {

}
function Meter({ etapa: etapa0 }) {
  const etapa = etapaId(etapa0);
  const idx = RUTA.indexOf(etapa);
  const won = etapa === "ganado";
  const cls = won ? "meter ok" : etapa === "perdido" ? "meter bad" : etapa === "pausa" ? "meter muted" : "meter";
  const title = won ? "Ganado" : idx >= 0 ? `Etapa ${idx + 1} de ${RUTA.length}` : etapaLabel(etapa);
  return html`<span class=${cls} title=${title} role="img" aria-label=${title}>${RUTA.map((_, i) => html`<b class=${won || (idx >= 0 && i <= idx) ? "on" : ""}></b>`)}</span>`;
}
/* La próxima tarea en una etiqueta: «Llamar · mañana», «Reunión · hoy 12:00», «Correo · atrasada 2 d». */
function SigTag({ t }) {
  if (!t) return html`<span class="tag warn">Sin tarea</span>`;
  const c = cuandoTarea(t);
  if (c.tono === "ask") return html`<span class="tag warn">¿Se hizo la reunión?</span>`;
  return html`<span class=${cx("tag", c.tono)}>${accionLabel(tipoTarea(t.tipo))} · ${c.txt.replace(/ /g, " ")}</span>`;
}
function Thinking({ text }) {
  return html`<span class="thinking" role="status"><i></i>${text || "Claude está escribiendo…"}</span>`;
}

function TextField({ id, label, value, onSave, type, placeholder, multiline, mono, disabled, hint, rows }) {
  const [v, setV] = useState(value || "");
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setV(value || ""); }, [value]);
  const commit = () => {
    focused.current = false;
    const nv = String(v || "").trim();
    if (nv !== String(value || "").trim()) onSave(nv);
  };
  const props = {
    id, value: v, placeholder: placeholder || "", disabled: !!disabled,
    onFocus: () => { focused.current = true; }, onInput: (e) => setV(e.currentTarget.value), onBlur: commit,
  };
  return html`<label class="field" for=${id}><span>${label}</span>
    ${multiline ? html`<textarea class="textarea" rows=${rows || 3} ...${props}></textarea>` : html`<input class=${cx("input", mono && "mono")} type=${type || "text"} ...${props} />`}
    ${hint ? html`<small class="hint">${hint}</small>` : null}
  </label>`;
}
function SelectField({ id, label, value, options, onSave, disabled, hint }) {
  return html`<label class="field" for=${id}><span>${label}</span>
    <select id=${id} class="select" value=${value || ""} disabled=${!!disabled} onChange=${(e) => onSave(e.currentTarget.value)}>
      ${options.map(([v, t]) => html`<option value=${v}>${t}</option>`)}
    </select>
    ${hint ? html`<small class="hint">${hint}</small>` : null}
  </label>`;
}
function Chips({ options, value, onChange, label }) {
  return html`<div class="chips" role="group" aria-label=${label || ""}>
    ${options.map(([v, t]) => html`<button type="button" class="chip" aria-pressed=${value === v ? "true" : "false"} onClick=${() => onChange(v)}>${t}</button>`)}
  </div>`;
}
function Seg({ options, value, onChange, label }) {
  return html`<div class="seg" role="group" aria-label=${label || ""}>
    ${options.map(([v, t, ic]) => html`<button type="button" aria-pressed=${value === v ? "true" : "false"} onClick=${() => onChange(v)}>${ic ? html`<${Icon} name=${ic} />` : null}${t}</button>`)}
  </div>`;
}

function Modal({ title, onClose, wide, children, foot, labelId }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    let fine = false;
    try { fine = window.matchMedia("(pointer: fine)").matches; } catch (e) { fine = false; }
    /* En el teléfono no se enfoca un campo al abrir: el teclado taparía la ventana. */
    const f = el && el.querySelector(fine ? "input, textarea, select, button.primary" : ".modal-head button");
    if (f && f.focus) f.focus({ preventScroll: true });
  }, []);
  const id = labelId || "modal-title";
  return html`<div class="modal-wrap">
    <div class="scrim" onClick=${onClose}></div>
    <div class=${cx("modal", wide && "wide")} role="dialog" aria-modal="true" aria-labelledby=${id} ref=${ref}>
      <div class="modal-head"><h2 id=${id}>${title}</h2><button type="button" class="btn ghost icon" aria-label="Cerrar" onClick=${onClose}><${Icon} name="x" size=${18} /></button></div>
      ${children}
      ${foot ? html`<div class="modal-foot">${foot}</div>` : null}
    </div>
  </div>`;
}

function Boundary({ children, name }) {
  const [error, reset] = useErrorBoundary((e) => console.error("[crm]", name, e));
  if (error) {
    return html`<div class="panel"><div class="panel-body" style="padding-top:16px">
      <div class="note bad"><${Icon} name="info" /><div>Algo falló al mostrar ${name || "esta parte"}. Los datos están a salvo.</div></div>
      <div class="actions" style="margin-top:12px"><button class="btn" onClick=${reset}>Volver a intentar</button></div>
    </div></div>`;
  }
  return children;
}

/* ===================================================================== actividad */

const ACT_ICON = { llamada: "phone", whatsapp: "chat", correo: "mail", reunion: "meet", nota: "note", etapa: "stage", proyecto: "folder", cobro: "coin", solicitud: "lifebuoy", cliente: "building" };
function actTitulo(a) {
  if (a.tipo === "llamada") return `Llamada${a.resultado ? " · " + resultadoLabel(a.resultado) : ""}${a.duracion ? " · " + a.duracion + " min" : ""}`;
  if (a.tipo === "whatsapp") return "WhatsApp enviado";
  if (a.tipo === "correo") return "Correo enviado";
  if (a.tipo === "reunion") return a.acta ? "Reunión · acta" : "Reunión";
  if (a.tipo === "etapa" && a.clienteId && !a.leadId) return `Etapa del cliente: ${etapaClienteLabel(a.de) || "—"} → ${a.a ? etapaClienteLabel(a.a) : "automática"}`;
  if (a.tipo === "etapa") return `Etapa: ${etapaLabel(a.de)} → ${etapaLabel(a.a)}`;
  if (a.tipo === "proyecto") return a.a ? `Proyecto: ${a.de ? faseLabel(a.de) + " → " : ""}${faseLabel(a.a)}` : "Proyecto";
  if (a.tipo === "cobro") return a.accion === "pagado" ? "Pago recibido" : a.accion === "facturado" ? "Cobro facturado" : "Cobro";
  if (a.tipo === "solicitud") return a.accion === "resuelta" ? "Solicitud resuelta" : a.accion === "nueva" ? "Solicitud nueva" : "Solicitud";
  if (a.tipo === "cliente") return "Cliente";
  return "Nota";
}

function ActaView({ a }) {
  const block = (t, arr) => (arr && arr.length ? html`<div><h4>${t}</h4><ul>${arr.map((x) => html`<li>${x}</li>`)}</ul></div>` : null);

    <div class="grid-2">${block("Acuerdos", a.acuerdos)}${block("Pendiente de ZH", a.pendientesZH)}${block("Pendiente del cliente", a.pendientesCliente)}${a.solicitudes && a.solicitudes.length ? block("Solicitudes", a.solicitudes.map((s) => `${s.titulo} (${coberturaLabel(s.cobertura)})`)) : null}</div>
    ${a.proximaReunion ? html`<p class="small">Próxima reunión: ${dayLabel(a.proximaReunion)}</p>` : null}
  </div>`;
}

function Feed({ items, showLead, limit }) {
  const { leadsById, clientesById, openLead, openCliente, nameOf } = useCtx();
  const list = limit ? items.slice(0, limit) : items;
  if (!list.length) return html`<p class="empty">Todavía no hay actividad registrada.</p>`;
  return html`<div class="feed">${list.map((a) => {
    const lead = a.leadId ? leadsById[a.leadId] : null;
    const cli = !lead && a.clienteId ? clientesById[a.clienteId] : null;
    const an = a.analisis;
    return html`<div class="feed-item" key=${a.id}>
      <span class=${cx("feed-ico", a.autor === "claude" && "claude")}><${Icon} name=${ACT_ICON[a.tipo] || "note"} /></span>
      <div style="min-width:0">
        <p class="feed-title">${showLead && lead ? html`<button onClick=${() => openLead(lead.id)}>${leadTitulo(lead)}</button> · ` : showLead && cli ? html`<button onClick=${() => openCliente(cli.id)}>${clienteName(cli)}</button> · ` : null}${actTitulo(a)}</p>
        <p class="feed-meta">${ago(a.fecha)}${a.autor ? " · " + nameOf(a.autor) : ""}${a.linea ? " · línea " + a.linea : ""}</p>
        ${a.resumen ? html`<p class="feed-text">${showLead ? clip(a.resumen.replace(/\s+/g, " "), 160) : clip(a.resumen, 2000)}</p>` : null}
        ${a.acta && !showLead ? html`<details style="margin-top:6px"><summary class="small" style="cursor:pointer;color:var(--accent)">Acta de la reunión</summary><${ActaView} a=${a.acta} /></details>` : null}

        ${a.transcripcion && !showLead ? html`<details style="margin-top:6px"><summary class="small" style="cursor:pointer;color:var(--fg-3)">Transcripción (${Math.round(a.transcripcion.length / 1000)} mil caracteres)</summary><p class="feed-text">${a.transcripcion}</p></details>` : null}

function AnalysisView({ a }) {

function EvalView({ e }) {
  const tono = e.puntaje >= 75 ? "ok" : e.puntaje >= 50 ? "warn" : "bad";

    <div class="eval-head"><h4>Desempeño de quien llamó</h4><span class=${"eval-score " + tono}>${e.puntaje}<small>/100</small></span></div>

      const c = e.criterios[k] || {};

        <span class="crit-label">${label}</span>
        <span class="crit-dots" role="img" aria-label=${c.nota ? `${c.nota} de 5` : "sin datos"}>${[1, 2, 3, 4, 5].map((i) => html`<i class=${c.nota && i <= c.nota ? "on" : ""}></i>`)}</span>

    <p class="eval-nota">Puntaje estimado por Claude con la transcripción: el promedio de los criterios, de 20 a 100.</p>
  </div>`;
}

/* Una tarea: el círculo la completa (agendar y la reunión piden un dato antes) y el botón de la
   derecha hace lo que toca: llamar, revisar el borrador, agendar o contar cómo fue la reunión. */
function TareaFila({ t, conLead, onEditar }) {
  const { leadsById, openLead, openDraft, completarTarea, canWrite, cfg, nameOf, drafts } = useCtx();
  const lead = leadsById[t.leadId] || null;
  const tipo = tipoTarea(t.tipo);
  const pend = tareaPendiente(t);
  const c = pend ? cuandoTarea(t) : { txt: (t.estado === "hecha" ? "Hecha " : "Descartada ") + ago(t.hecha || t.actualizado), tono: "" };
  const pasada = c.tono === "ask";
  const borrador = t.borradorId ? drafts.find((d) => d.id === t.borradorId) : null;
  const wa = lead && lead.telefono && !lead.noContactar ? waLink(lead.telefono, "", cfg) : null;
  const gcal = tipo === "reunion" && pend && !pasada && lead ? gcalLink({ titulo: `${t.titulo || "Reunión"} · ${leadTitulo(lead)} y ZH Development`, fecha: t.fecha, hora: t.hora, duracion: t.duracion, detalle: "Reunión con ZH Development.\nzhdevelopment.cl", invitados: lead.correo || "" }, cfg) : null;
  let accion = null;
  if (pend && lead && canWrite) {
    if (pasada) accion = html`<button type="button" class="btn small primary" onClick=${() => completarTarea(t)}>¿Se hizo?</button>`;
    else if (borrador && borrador.estado !== "enviado" && borrador.estado !== "descartado") accion = html`<button type="button" class="btn small claude" onClick=${() => openDraft(borrador.id)}><${Icon} name="doc" />Revisar y enviar</button>`;
    else if (tipo === "llamar" && lead.telefono && !lead.noContactar) accion = html`<button type="button" class="btn small" onClick=${() => openLead(lead.id, "llamada")}><${Icon} name="phone" />Llamar</button>`;
    else if (tipo === "whatsapp" && wa) accion = html`<a class="btn small" href=${wa} target="_blank" rel="noopener"><${Icon} name="chat" />WhatsApp</a>`;
    else if (tipo === "correo" && !lead.noContactar) accion = html`<button type="button" class="btn small" onClick=${() => openLead(lead.id, "redactar")}><${Icon} name="spark" />Redactar</button>`;
    else if (tipo === "agendar") accion = html`<button type="button" class="btn small" onClick=${() => completarTarea(t)}><${Icon} name="cal" />Agendar</button>`;
    else if (gcal) accion = html`<a class="btn small" href=${gcal} target="_blank" rel="noopener" title="Abre Google Calendar con el evento lleno"><${Icon} name="cal" />Calendario</a>`;
  }
  const titulo = t.titulo || accionLabel(tipo);
  return html`<div class=${cx("task", t.estado === "hecha" && "done", t.estado === "descartada" && "gone")}>
    <button type="button" class=${cx("tick", t.estado === "hecha" && "on")} disabled=${!pend || !canWrite} title=${pend ? (tipo === "agendar" ? "Agendar la reunión" : tipo === "reunion" ? "¿Se hizo la reunión?" : "Marcar como hecha") : ""} aria-label=${(pend ? "Completar: " : "Hecha: ") + titulo} onClick=${() => completarTarea(t)}><${Icon} name="check" size=${12} /></button>
    <div class="task-main">
      <div class="task-title"><${Icon} name=${TIPO_TAREA[tipo][2]} size=${15} />${onEditar && pend ? html`<button type="button" title="Editar la tarea" onClick=${onEditar}>${titulo}</button>` : html`<span>${titulo}</span>`}</div>
      <div class="task-meta">${conLead && lead ? html`<button type="button" onClick=${() => openLead(lead.id)}>${leadTitulo(lead)}</button> · ` : null}<span class=${c.tono}>${c.txt}</span>${t.responsable ? " · " + nameOf(t.responsable) : ""}${pend && t.origen === "llamada" ? " · acordado en una llamada" : pend && t.origen === "reunion" ? " · acordado en una reunión" : ""}</div>
      ${t.nota ? html`<p class="task-nota">${t.nota}</p>` : null}
    </div>
    ${accion ? html`<div class="task-side">${accion}</div>` : null}
  </div>`;
}

const TIPOS_EDITABLES = TIPOS_TAREA.filter((x) => x[0] !== "reunion");
function TareaEditor({ lead, t, onDone }) {
  const { api, toast, yo, canWrite } = useCtx();
  const nueva = !t || !!t.virtual;
  const esReunion = !!t && tipoTarea(t.tipo) === "reunion";
  const [tipo, setTipo] = useState(t ? tipoTarea(t.tipo) : "llamar");
  const [titulo, setTitulo] = useState(t ? t.titulo || "" : "");
  const [fecha, setFecha] = useState(t && t.fecha ? t.fecha : fechaPorDefecto("llamar"));
  const [hora, setHora] = useState(t && isHora(t.hora) ? t.hora : "");
  const [resp, setResp] = useState((t && t.responsable) || lead.responsable || yo || "");
  const [nota, setNota] = useState((t && t.nota) || "");
  const [saving, setSaving] = useState(false);
  const hoy = todayKey();
  const quick = [["Hoy", hoy], ["Mañana", addDays(hoy, 1)], ["En 3 días hábiles", addBusinessDays(hoy, 3)], ["En una semana", addDays(hoy, 7)]];
  const guardar = async () => {
    if (!isKey(fecha)) { toast("Elige el día de la tarea.", "bad"); return; }
    setSaving(true);
    try {
      const data = { tipo, titulo: titulo.trim() || accionLabel(tipo), fecha, hora: isHora(hora) ? hora : "", responsable: resp || null, nota: nota.trim() };
      if (nueva) await api.createTarea({ leadId: lead.id, ...data, estado: "pendiente", origen: "manual" });
      else await api.updateTarea(t.id, data);
      onDone();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  const descartar = async () => {
    setSaving(true);
    try { await api.updateTarea(t.id, { estado: "descartada", hecha: nowISO() }); toast("Tarea descartada."); onDone(); } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  const idp = nueva ? "tn" : "te";
  return html`<div class="task-form">
    ${esReunion ? null : html`<div class="field"><span>Tipo</span><${Chips} label="Tipo de tarea" value=${tipo} onChange=${setTipo} options=${TIPOS_EDITABLES.map(([v, l]) => [v, l])} /></div>`}
    <label class="field" for=${idp + "-titulo"}><span>Qué hay que hacer</span><input id=${idp + "-titulo"} class="input" value=${titulo} placeholder=${accionLabel(tipo)} onInput=${(e) => setTitulo(e.currentTarget.value)} /></label>
    <div class="grid-3">
      <label class="field" for=${idp + "-fecha"}><span>Día</span><input id=${idp + "-fecha"} class="input" type="date" value=${fecha} onInput=${(e) => setFecha(e.currentTarget.value)} /></label>
      <label class="field" for=${idp + "-hora"}><span>Hora (opcional)</span><input id=${idp + "-hora"} class="input" type="time" value=${hora} onInput=${(e) => setHora(e.currentTarget.value)} /></label>
      <label class="field" for=${idp + "-resp"}><span>Responsable</span><select id=${idp + "-resp"} class="select" value=${resp} onChange=${(e) => setResp(e.currentTarget.value)}><option value="">Sin responsable</option>${RESPONSABLES.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label>
    </div>
    <div class="actions">${quick.map(([l, k]) => html`<button type="button" class=${cx("btn small", fecha === k && "on")} onClick=${() => setFecha(k)}>${l}</button>`)}</div>
    <label class="field" for=${idp + "-nota"}><span>Detalle (opcional)</span><textarea id=${idp + "-nota"} class="textarea" rows="2" value=${nota} onInput=${(e) => setNota(e.currentTarget.value)}></textarea></label>
    <div class="actions">
      <button type="button" class="btn primary small" onClick=${guardar} disabled=${saving || !canWrite}>${nueva ? "Agregar tarea" : "Guardar"}</button>
      <button type="button" class="btn ghost small" onClick=${onDone}>Cancelar</button>
      ${!nueva ? html`<span style="flex:1"></span><button type="button" class="btn ghost small danger" onClick=${descartar} disabled=${saving || !canWrite}><${Icon} name="trash" />Descartar</button>` : null}
    </div>
  </div>`;
}

/* Las tareas de un lead en su ficha: pendientes arriba (la primera es la «próxima acción») y las
   hechas o descartadas plegadas abajo. */
function TareasLead({ lead, abrirNueva }) {
  const { db, canWrite, openModal } = useCtx();
  const [todas, setTodas] = useState([]);
  const [nueva, setNueva] = useState(!!abrirNueva);
  const [editando, setEditando] = useState("");
  useEffect(() => {
    if (!db) return undefined;
    return db.collection("tareas").where("leadId", "==", lead.id).onSnapshot((s) => setTodas(s.docs.map((x) => ({ id: x.id, ...x.data() }))), () => {});
  }, [db, lead.id]);
  useEffect(() => { if (abrirNueva) setNueva(true); }, [abrirNueva]);
  const pend = todas.filter(tareaPendiente).sort(tareaOrden);
  const virtual = pend.length ? null : tareaDeProxima(lead);
  const lista = virtual ? [virtual] : pend;
  const cerradas = todas.filter((x) => !tareaPendiente(x)).sort((a, b) => String(b.hecha || b.actualizado || "").localeCompare(String(a.hecha || a.actualizado || "")));
  return html`<section class="tareas-box" aria-label="Tareas">
    <div class="sec-head">
      <h3>Tareas</h3>${lista.length ? html`<span class="count">${lista.length}</span>` : null}
      <span style="flex:1"></span>
      ${canWrite && !lead.noContactar ? html`<button type="button" class="btn small" onClick=${() => openModal({ type: "agendar", lead })}><${Icon} name="cal" />Agendar reunión</button>` : null}
      ${canWrite ? html`<button type="button" class="btn small" onClick=${() => { setEditando(""); setNueva(true); }}><${Icon} name="plus" />Tarea</button>` : null}
    </div>
    ${nueva ? html`<${TareaEditor} lead=${lead} onDone=${() => setNueva(false)} />` : null}
    ${lista.length ? html`<div class="tasks">${lista.map((x) => (editando && editando === (x.id || "virtual")
      ? html`<${TareaEditor} key=${"e" + (x.id || "v")} lead=${lead} t=${x} onDone=${() => setEditando("")} />`
      : html`<${TareaFila} key=${x.id || "v"} t=${x} onEditar=${canWrite ? () => { setNueva(false); setEditando(x.id || "virtual"); } : null} />`))}</div>`
      : nueva ? null : html`<p class="empty">${isOpen(lead) ? "Sin tareas pendientes. Agrega la próxima para que el lead no se enfríe." : "Sin tareas pendientes."}</p>`}
    ${cerradas.length ? html`<details class="hechas"><summary>Hechas y descartadas (${cerradas.length})</summary><div class="tasks">${cerradas.slice(0, 25).map((x) => html`<${TareaFila} key=${x.id} t=${x} />`)}</div></details>` : null}
  </section>`;
}

/* La próxima tarea dentro de una tarjeta del embudo, con su círculo para completarla ahí mismo. */
function SigLinea({ t }) {
  const { completarTarea, canWrite } = useCtx();
  const c = cuandoTarea(t);
  const tipo = tipoTarea(t.tipo);
  const titulo = t.titulo || accionLabel(tipo);
  return html`<div class=${cx("knext", c.tono)}>
    ${canWrite ? html`<button type="button" class="tick" title=${tipo === "agendar" ? "Agendar la reunión" : tipo === "reunion" ? "¿Se hizo la reunión?" : "Marcar como hecha"} aria-label=${"Completar: " + titulo} onClick=${(e) => { e.stopPropagation(); completarTarea(t); }}><${Icon} name="check" size=${11} /></button>` : html`<${Icon} name=${TIPO_TAREA[tipo][2]} size=${14} />`}
    <span class="knext-txt"><b>${c.tono === "ask" ? "¿Se hizo la reunión?" : titulo}</b><span>${c.tono === "ask" ? c.txt.replace(" · ¿se hizo?", "") : c.txt}</span></span>
  </div>`;
}

/* Al guardar una llamada o una reunión: qué quedó hecho, en qué etapa y qué tareas salieron. */
function ListoCard({ r, lead, onClose }) {
  const { changeStage, canWrite } = useCtx();
  return html`<div class="done-card" role="status">
    <h4><${Icon} name="check" />${r.tipo === "reunion" ? "Reunión guardada" : "Llamada guardada"}${r.conAnalisis ? " con el análisis de Claude" : ""}</h4>
    <ul>
      ${r.a ? html`<li>Etapa: ${etapaLabel(r.de)} → <b>${etapaLabel(r.a)}</b></li>` : null}
      ${r.nuevas.map((x, i) => html`<li key=${i}>Tarea nueva: <b>${x.titulo}</b> · ${cuandoTexto(x.fecha)}${x.hora ? " a las " + x.hora : ""}${TAREA_MENSAJE.has(x.tipo) && r.borradores ? " · Claude la está redactando" : ""}</li>`)}
      ${r.hechas ? html`<li>${r.hechas === 1 ? "Quedó hecha la tarea que tocaba" : `Quedaron hechas las ${r.hechas} tareas que tocaban`}.</li>` : null}
      ${!r.nuevas.length && !r.a ? html`<li>No quedaron tareas nuevas.</li>` : null}
    </ul>
    ${r.sugerencia && canWrite ? html`<p>Claude sugiere pasarlo a «${etapaLabel(r.sugerencia)}». <button type="button" class="btn small" onClick=${() => { onClose(); changeStage(lead, r.sugerencia); }}>Pasar a ${etapaLabel(r.sugerencia)}</button></p>` : null}
    <div class="actions"><button type="button" class="btn small ghost" onClick=${onClose}>Cerrar</button></div>
  </div>`;
}

/* ===================================================================== vista: hoy */

function HoyView() {
  const { leads: todos, acts, drafts, openModal, nav, equipo, me, clientes, proyectos, cobros, solicitudes, clientesById, cfg, tareas, tareasPorLead, siguienteDe, leadsById } = useCtx();
  const [quien, setQuien] = useState(() => { const v = ls.get("respHoy", ""); return respNombre(v) ? v : ""; });
  useEffect(() => ls.set("respHoy", quien), [quien]);
  /* Lo de cada socio, más lo que todavía no tiene responsable. */
  const deQuien = (r) => !quien || !r || r === quien;
  const leads = todos.filter((l) => deQuien(l.responsable));
  const t = todayKey();
  const agenda = agendaClientes({ proyectos, cobros, clientesById }, cfg, 7);
  const agendaHoy = agenda.filter((x) => x.fecha <= t);
  const solAbiertas = solicitudes.filter((s) => SOL_ABIERTA.has(s.estado)).sort(solOrden);
  const vencidos = cobros.filter((x) => pagoVencido(x, cfg));
  /* Las tareas pendientes, más las «proxima» antiguas que todavía no son tarea. */
  const virtuales = todos.filter((l) => !(tareasPorLead[l.id] || []).length).map(tareaDeProxima).filter(Boolean);
  const lista = [...tareas, ...virtuales].filter((x) => { const l = leadsById[x.leadId]; return l && !l.noContactar && deQuien(x.responsable || l.responsable); }).sort(tareaOrden);
  const atrasadas = lista.filter((x) => x.fecha && x.fecha < t);
  const deHoy = lista.filter((x) => x.fecha === t);
  const proximas = lista.filter((x) => x.fecha > t && diffDays(t, x.fecha) <= 7);
  const abiertos = leads.filter(contactable);
  const nuevos = abiertos.filter((l) => etapaDe(l) === "nuevo" && !siguienteDe(l)).sort((a, b) => String(b.creado).localeCompare(String(a.creado)));
  const sinPlan = abiertos.filter((l) => etapaDe(l) !== "nuevo" && !siguienteDe(l)).sort((a, b) => String(a.ultimoContacto || "").localeCompare(String(b.ultimoContacto || "")));
  const porRevisar = drafts.filter((d) => d.estado === "por_revisar");
  const semana = acts.filter((a) => CONTACTOS.has(a.tipo) && Date.now() - Date.parse(a.fecha) < 7 * 864e5).length;
  const evaluadas = acts.filter((a) => a.tipo === "llamada" && a.autor === me.id && a.analisis && a.analisis.evaluacion && Date.now() - Date.parse(a.fecha) < 30 * 864e5);
  const promedio = evaluadas.length ? Math.round(sum(evaluadas, (a) => a.analisis.evaluacion.puntaje) / evaluadas.length) : null;
  const paraHoy = atrasadas.length + deHoy.length;

  const frase = [];
  if (paraHoy) frase.push(`${paraHoy} ${paraHoy === 1 ? "tarea" : "tareas"} para hoy${atrasadas.length ? ` (${atrasadas.length} ${atrasadas.length === 1 ? "atrasada" : "atrasadas"})` : ""}`);
  if (nuevos.length) frase.push(`${nuevos.length} ${nuevos.length === 1 ? "lead" : "leads"} por contactar`);
  if (agendaHoy.length) frase.push(`${agendaHoy.length} ${agendaHoy.length === 1 ? "pendiente de clientes" : "pendientes de clientes"}`);
  if (solAbiertas.length) frase.push(`${solAbiertas.length} ${solAbiertas.length === 1 ? "solicitud abierta" : "solicitudes abiertas"}`);
  if (porRevisar.length) frase.push(`${porRevisar.length} ${porRevisar.length === 1 ? "borrador" : "borradores"} por revisar`);
  const lede = todos.length || clientes.length ? (frase.length ? `Tienes ${frase.join(", ").replace(/, ([^,]*)$/, " y $1")}.` : "Nada pendiente para hoy. Buen momento para prospectar o revisar los leads sin tarea.") : "";
  const sinFirma = me.id && !(equipo[me.id] && equipo[me.id].nombre);
  const grupo = (titulo, items, cls) => (items.length ? html`<p class=${cx("task-group", cls)}>${titulo} · ${items.length}</p><div class="tasks">${items.map((x) => html`<${TareaFila} key=${x.id || "v-" + x.leadId} t=${x} conLead />`)}</div>` : null);

  return html`<div class="main-inner">
    <header class="page-head">
      <div>
        <p class="eyebrow">${cap(fmtLong.format(keyDate(t)))} · Hora de Chile</p>
        <h1>Hoy</h1>
        ${lede ? html`<p class="lede">${lede}</p>` : null}
      </div>
      <div class="actions">
        <button class="btn" onClick=${() => openModal({ type: "import" })}><${Icon} name="upload" />Importar</button>
        <button class="btn primary" onClick=${() => openModal({ type: "newLead" })}><${Icon} name="plus" />Nuevo lead</button>
      </div>
    </header>

    ${todos.length ? html`<div class="toolbar"><${Seg} label="De quién" value=${quien} onChange=${setQuien} options=${[["", "Todo el equipo"], ...RESPONSABLES.map(([id, n]) => [id, n])]} />${quien ? html`<span class="small muted">Lo de ${respNombre(quien)} y lo que no tiene responsable.</span>` : null}</div>` : null}

    ${!todos.length && !clientes.length ? html`<section class="panel"><div class="panel-head"><h2>Para empezar</h2></div><div class="panel-body">
      <ol class="onboard">
        <li><p class="eyebrow">Paso 1</p><h3>Completa tu firma</h3><p>Nombre, cargo y teléfono de negocios. Van al pie de cada correo que redacte Claude.</p><button class="btn small" style="justify-self:start" onClick=${() => nav("ajustes")}>Ir a Ajustes</button></li>
        <li><p class="eyebrow">Paso 2</p><h3>Carga tus leads</h3><p>Uno por uno, desde una planilla CSV o pegando una lista o un correo del formulario: Claude los ordena.</p><button class="btn small" style="justify-self:start" onClick=${() => openModal({ type: "import" })}>Importar leads</button></li>
        <li><p class="eyebrow">Paso 3</p><h3>Llama y graba</h3><p>Transcribe la llamada en vivo: al detener, Claude la analiza, crea las tareas y mueve la etapa.</p><button class="btn small" style="justify-self:start" onClick=${() => openModal({ type: "newLead" })}>Agregar un lead</button></li>
      </ol>
    </div></section>` : html`<div class="summary" role="list">
      <span class=${cx("stat", atrasadas.length && "alert")} role="listitem"><b>${paraHoy}</b>${paraHoy === 1 ? "tarea" : "tareas"} para hoy${atrasadas.length ? ` · ${atrasadas.length} ${atrasadas.length === 1 ? "atrasada" : "atrasadas"}` : ""}</span>
      <span class=${cx("stat", !nuevos.length && "zero")} role="listitem"><b>${nuevos.length}</b>por contactar</span>
      <span class=${cx("stat", !sinPlan.length && "zero")} role="listitem"><b>${sinPlan.length}</b>sin tarea</span>
      <span class=${cx("stat", !porRevisar.length && "zero")} role="listitem"><b>${porRevisar.length}</b>borradores por revisar</span>
      <span class=${cx("stat", !semana && "zero")} role="listitem"><b>${semana}</b>contactos en 7 días</span>
      ${promedio != null ? html`<span class="stat" role="listitem" title="Promedio del puntaje que Claude le dio a tus llamadas de los últimos 30 días"><b>${promedio}</b>tu puntaje en llamadas (${evaluadas.length})</span>` : null}
      ${clientes.length ? html`<span class=${cx("stat", !solAbiertas.length && "zero")} role="listitem"><button onClick=${() => nav("soporte")}><b>${solAbiertas.length}</b> solicitudes abiertas</button></span>` : null}
      ${vencidos.length ? html`<span class="stat alert" role="listitem"><button onClick=${() => nav("cobros")}><b>${money(sum(vencidos, (x) => x.monto))}</b> vencido</button></span>` : null}
    </div>`}

    ${sinFirma && leads.length ? html`<div class="note warn"><${Icon} name="info" /><div>Completa tu firma en <button class="btn small ghost" style="min-height:0;padding:0;text-decoration:underline" onClick=${() => nav("ajustes")}>Ajustes</button> para que los correos salgan con tu nombre y teléfono.</div></div>` : null}

    ${todos.length || clientes.length ? html`<div class="cols">
      <div class="stack">
        <section class="panel" aria-label="Tareas"><div class="panel-head"><h2>Tareas</h2><span class="eyebrow">${paraHoy} para hoy</span></div>
          <div class="panel-body">
            ${grupo("Atrasadas", atrasadas, "late")}
            ${deHoy.length ? grupo("Hoy", deHoy, "") : html`<p class="task-group">Hoy</p><p class="empty">${atrasadas.length ? "Nada más para hoy." : "No hay tareas para hoy."}</p>`}
            ${grupo("Próximos 7 días", proximas.slice(0, 15), "")}
          </div></section>
        <section class="panel"><div class="panel-head"><h2>Por contactar</h2><span class="eyebrow">${nuevos.length}</span></div>
          <div class="panel-body">${nuevos.length ? html`<div class="lrows">${nuevos.slice(0, 12).map((l) => html`<${LeadRow} key=${l.id} lead=${l} mode="new" />`)}</div>` : html`<p class="empty">Todos los leads nuevos tienen una tarea.</p>`}
          ${nuevos.length > 12 ? html`<button class="btn small ghost" onClick=${() => nav("embudo")}>Ver los ${nuevos.length} en el embudo</button>` : null}</div></section>
      </div>
      <div class="stack">
        ${clientes.length ? html`<section class="panel"><div class="panel-head"><h2>Clientes: próximos 7 días</h2><span class="eyebrow">${agenda.length}</span></div>
          <div class="panel-body"><${AgendaList} items=${agenda} limit=${10} empty="Sin hitos, entregas, facturas ni pagos en los próximos 7 días." />

  const list = useMemo(() => {

      if (resp === "nadie" && l.responsable) return false;

        <option value="">Todos los orígenes</option>${ORIGENES.map(([v, t]) => html`<option value=${v}>${t}</option>`)}
      </select>
      <select id="f-resp" class="select" aria-label="Responsable" value=${resp} onChange=${(e) => setResp(e.currentTarget.value)}>
        <option value="">Todo el equipo</option>${team.map((u) => html`<option value=${u}>${nameOf(u)}</option>`)}<option value="nadie">Sin responsable</option>

    </div>
    <section class="panel">
      ${!list.length ? html`<div class="panel-body" style="padding-top:16px"><p class="empty">${leads.length ? "Ningún lead coincide con estos filtros." : "Todavía no hay leads. Agrega el primero o importa una lista."}</p></div>` : html`

          <td class="small muted">${l.ultimoContacto ? ago(l.ultimoContacto) : "—"}${l.intentos ? html`<br />${l.intentos} sin respuesta` : null}</td>

      </table></div>
