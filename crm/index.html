          await cerrarTareasDe(lead.id);
          const d = detalle.trim() || nota;
          await api.updateLead(lead.id, { etapa: "perdido", motivoPerdida: motivo, motivoDetalle: d, proxima: null, inasistencias: veces });
          await api.addAct({ leadId: lead.id, tipo: "etapa", de: etapaDe(lead), a: "perdido", resumen: `${motivo}: ${d}` });
          toast(`${leadTitulo(lead)}: perdido · ${motivo}.`);

          await api.addAct({ leadId: lead.id, tipo: "nota", resumen: nota });
          const tid = await api.createTarea({ leadId: lead.id, tipo: "whatsapp", titulo: "Escribirle para reagendar la reunión", fecha: todayKey(), hora: "", responsable: tarea.responsable || lead.responsable || yo || null, estado: "pendiente", origen: "reunion" });
          if (conWa) redactarTareas(lead, [{ tipo: "whatsapp", que: "Reagendar la reunión", tareaId: tid, objetivo: "agendar", instrucciones: `${nota} Escríbele con buena onda y sin reproche: que lo esperamos, que entendemos que se le pudo complicar, y propón dos horarios para esta semana o el enlace para agendar. Breve.` }]);
          toast(`${leadTitulo(lead)}: queda la tarea de escribirle para reagendar.${conWa ? " Claude está redactando el WhatsApp." : ""}`);
        }
        closeModal();
        return;
      }
      if (modo === "reagendar") {
        if (!isKey(fecha)) { toast("Elige el día nuevo.", "bad"); setSaving(false); return; }
        const datos = { fecha, hora: isHora(hora) ? hora : "" };
        if (tarea.virtual) { await api.createTarea({ leadId: lead.id, tipo: "reunion", titulo: tarea.titulo || "Reunión", ...datos, duracion: DURACION_REUNION, responsable: lead.responsable || yo || null, estado: "pendiente", origen: "manual" }); await api.updateLead(lead.id, { proxima: null }); }
        else await api.updateTarea(tarea.id, datos);
        await api.addAct({ leadId: lead.id, tipo: "nota", resumen: `La reunión del ${fechaTxt(tarea.fecha, tarea.hora)} se cambió para el ${fechaTxt(fecha, datos.hora)}.` });

  };
  const foot = html`<button class="btn ghost" onClick=${closeModal}>Cancelar</button><button class="btn primary" onClick=${guardar} disabled=${saving || !canWrite}>${saving ? "Guardando…" : modo === "si" ? "Guardar y registrar la reunión" : modo === "noshow" && tras === "perdido" ? "Pasar a Perdido" : "Guardar"}</button>`;

  </${Modal}>`;
}

/* No contestó: queda el intento y cuándo volver a intentarlo, sin abrir la ficha. Después de
   varios intentos se puede cerrar como perdido por «No responde». */
function NoContestoModal({ lead }) {
  const { api, closeModal, toast, tareasPorLead, me, yo, cerrarTareasDe } = useCtx();
  const n = (lead.intentos || 0) + 1;
  const cuando = (c) => {
    const t = todayKey();
    if (c === "luego") {
      const [h, m] = fmtHM.format(new Date()).split(":").map(Number);
      const q = Math.ceil((h * 60 + m + 120) / 15) * 15;
      if (q <= 20 * 60 && !isWeekend(t)) return { fecha: t, hora: `${String(Math.floor(q / 60)).padStart(2, "0")}:${String(q % 60).padStart(2, "0")}` };
      return { fecha: addBusinessDays(t, 1), hora: "10:00" };
    }
    return { fecha: addBusinessDays(t, c === "manana" ? 1 : c === "2d" ? 2 : 5), hora: "" };
  };
  const [resultado, setResultado] = useState("no_contesto");
  const [rel, setRel] = useState("manana");
  const [fecha, setFecha] = useState(() => cuando("manana").fecha);
  const [hora, setHora] = useState("");
  const [canal, setCanal] = useState("llamar");
  const [nota, setNota] = useState("");
  const [saving, setSaving] = useState(false);
  const elegir = (c) => { const x = cuando(c); setRel(c); setFecha(x.fecha); setHora(x.hora); };
  const registro = () => api.addAct({ leadId: lead.id, tipo: "llamada", resultado, linea: ls.get("linea", "negocios"), duracion: null, resumen: nota.trim() });
  const guardar = async () => {
    if (!isKey(fecha)) { toast("Elige el día para volver a intentarlo.", "bad"); return; }
    setSaving(true);
    try {
      const actId = await registro();
      const veces = `${n} ${n === 1 ? "intento" : "intentos"} sin respuesta`;
      /* El intento cumple la tarea de llamar que tocaba; queda una nueva para el día elegido. */
      const pend = tareasPorLead[lead.id] || [];
      for (const x of pend) if (tipoTarea(x.tipo) === "llamar" && x.fecha <= todayKey()) await api.updateTarea(x.id, { estado: "hecha", hecha: nowISO(), hechaPor: me.id || null, actividadId: actId });
      await api.updateLead(lead.id, { ultimoIntento: nowISO(), intentos: n, ...(!pend.length && tareaDeProxima(lead) ? { proxima: null } : {}) });
      await api.createTarea({ leadId: lead.id, tipo: canal, titulo: canal === "whatsapp" ? `No contesta (${veces}): escribirle por WhatsApp` : `Volver a llamar (${veces})`, fecha, hora: hora || "", responsable: lead.responsable || yo || null, estado: "pendiente", origen: "no_contesto", actividadId: actId });
      toast(`${leadTitulo(lead)}: ${canal === "whatsapp" ? "escribirle por WhatsApp" : "volver a llamar"} ${cuandoTexto(fecha)}${hora ? " a las " + hora : ""}.`);
      closeModal();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  const perder = async () => {
    setSaving(true);
    try {
      await registro();
      await cerrarTareasDe(lead.id);
      await api.updateLead(lead.id, { ultimoIntento: nowISO(), intentos: n, etapa: "perdido", motivoPerdida: "No responde", motivoDetalle: "", proxima: null });
      await api.addAct({ leadId: lead.id, tipo: "etapa", de: etapaDe(lead), a: "perdido", resumen: `No responde (${n} intentos)` });
      toast(`${leadTitulo(lead)}: perdido · No responde.`);
      closeModal();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  return html`<${Modal} title=${"No contestó: " + leadName(lead)} onClose=${closeModal} foot=${html`${n >= 3 ? html`<button class="btn ghost danger" onClick=${perder} disabled=${saving}>Perdido · No responde</button>` : null}<button class="btn ghost" onClick=${closeModal}>Cancelar</button><button class="btn primary" onClick=${guardar} disabled=${saving}>Guardar</button>`}>
    <div class="modal-body">
      <p class="small muted">${n === 1 ? "Primer intento sin respuesta." : `Es el intento ${n} sin respuesta.`} Queda en el historial y la tarjeta sigue en su etapa.</p>
      <div class="field"><span>Qué pasó</span><${Chips} label="Qué pasó" value=${resultado} onChange=${setResultado} options=${SIN_RESPUESTA_OPC} /></div>
      <div class="field"><span>¿Cuándo lo volvemos a intentar?</span><${Chips} label="Cuándo" value=${rel} onChange=${elegir} options=${RELLAMAR} /></div>
      <div class="grid-2">
        <label class="field" for="nc-fecha"><span>Día</span><input id="nc-fecha" class="input" type="date" value=${fecha} onInput=${(e) => { setRel(""); setFecha(e.currentTarget.value); }} /></label>
        <label class="field" for="nc-hora"><span>Hora (opcional)</span><input id="nc-hora" class="input" type="time" value=${hora} onInput=${(e) => { setRel(""); setHora(e.currentTarget.value); }} /></label>
      </div>
      <div class="field"><span>Entonces</span><${Seg} label="Próxima acción" value=${canal} onChange=${setCanal} options=${[["llamar", "Volver a llamar", "phone"], ["whatsapp", "Escribirle por WhatsApp", "chat"]]} /></div>
      <label class="field" for="nc-nota"><span>Nota (opcional)</span><input id="nc-nota" class="input" value=${nota} onInput=${(e) => setNota(e.currentTarget.value)} placeholder="Ej.: contestó la secretaria, que llame después de las 15" /></label>
      ${n >= 3 ? html`<div class="note warn"><${Icon} name="info" /><div>Lleva ${n} intentos sin respuesta. Si prefieres cerrarlo, pásalo a Perdido con el motivo «No responde».</div></div>` : null}
    </div>
  </${Modal}>`;
}

function toCsv(leads, nameOf) {
  const cols = [["nombre", "Nombre"], ["empresa", "Empresa"], ["cargo", "Cargo"], ["telefono", "Teléfono"], ["correo", "Correo"], ["etapa", "Etapa"], ["origen", "Origen"], ["prioridad", "Prioridad"], ["proxima_tipo", "Próxima acción"], ["proxima_fecha", "Fecha próxima acción"], ["proxima_nota", "Nota próxima acción"], ["ultimoContacto", "Último contacto"], ["intentos", "Llamadas sin respuesta"], ["responsable", "Responsable"], ["necesidad", "Necesidad"], ["dolor", "Dolor"], ["comoAyudamos", "Cómo ayudamos"], ["motivoPerdida", "Motivo de pérdida"], ["notas", "Notas"], ["creado", "Creado"]];
  const val = (l, k) => {
    if (k === "etapa") return etapaLabel(l.etapa);
    if (k === "origen") return origenLabel(l.origen);
    if (k === "proxima_tipo") return l.proxima && l.proxima.fecha ? accionLabel(l.proxima.tipo) : "";
    if (k === "proxima_fecha") return (l.proxima && l.proxima.fecha) || "";
    if (k === "proxima_nota") return (l.proxima && l.proxima.nota) || "";
    if (k === "responsable") return l.responsable ? nameOf(l.responsable) : "";
    if (k === "telefono") return l.telefono ? fmtPhone(l.telefono) : "";
    return l[k] == null ? "" : String(l[k]);
  };
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  return "\uFEFF" + [cols.map((c) => q(c[1])).join(";"), ...leads.map((l) => cols.map((c) => q(val(l, c[0]))).join(";"))].join("\r\n");
}

function cobrosCsv(cobros, clientesById, proyectosById, cfg) {
  const cols = ["Cliente", "Proyecto", "Tipo", "Concepto", "Monto sin IVA", "IVA", "Total", "Estado", "Fecha de facturación", "N° factura", "Fecha factura", "Vence", "Fecha de pago"];
  const q = (s) => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
  const rows = [...cobros].sort((a, b) => String(a.fecha || "").localeCompare(String(b.fecha || ""))).map((x) => [
    clienteName(clientesById[x.clienteId]), x.proyectoId && proyectosById[x.proyectoId] ? proyectosById[x.proyectoId].nombre : "", tipoCobroLabel(x.tipo), x.concepto || "",
    x.monto || 0, conIva(x.monto) - (Number(x.monto) || 0), conIva(x.monto), pick(ESTADOS_COBRO, x.estado), x.fecha || "", x.factura || "", x.fechaFactura || "", venceCobro(x, cfg), x.fechaPago || "",
  ]);
  return "\uFEFF" + [cols.map(q).join(";"), ...rows.map((r) => r.map(q).join(";"))].join("\r\n");
}

/* Lee una colección completa en páginas de 1000, ordenada por un campo de fecha. */
async function getAll(db, path, field) {
  const out = [];
  let last = "";
  for (;;) {
    let q = db.collection(path).orderBy(field, "asc").limit(1000);
    if (last) q = q.where(field, ">", last);
    const s = await q.get();
    for (const d of s.docs) out.push({ id: d.id, ...d.data() });
    if (s.docs.length < 1000) break;
    last = String(s.docs[s.docs.length - 1].data()[field] || "");
    if (!last) break;
  }
  return out;
}

          <p class="small muted">Los datos viven en la base privada de este CRM en claude.ai: solo los ven quienes tengan acceso a él. Descarga un respaldo de vez en cuando.</p>
          <div class="actions">
            <button class="btn" onClick=${() => exportar("csv")}><${Icon} name="download" />Exportar leads (CSV)</button>
            <button class="btn" onClick=${() => exportar("cobros")}><${Icon} name="download" />Exportar cobros (CSV)</button>
            <button class="btn" onClick=${() => exportar("json")}><${Icon} name="download" />Respaldo completo (JSON)</button>
          </div>
        </div></section>

      <section class="panel"><div class="panel-head"><h2>Trabajar con Claude</h2></div>
        <div class="panel-body prose">
          <p>Además de los botones de esta página, en una conversación con Claude (Claude Code en el repositorio <span class="mono">marketing</span>) puedes pedir cosas como:</p>
          <ul>
            <li>«Carga estos leads» y pegar la lista o la planilla.</li>
            <li>«Redacta el correo de seguimiento para Carolina, con la propuesta adjunta». El borrador aparece en <b>Borradores por revisar</b>.</li>
            <li>«Analiza esta llamada» con la transcripción: queda en el historial del lead con el resumen y la próxima acción.</li>
            <li>«¿A quién tengo que llamar hoy?» o «¿qué leads llevan más de una semana sin contacto?»</li>
            <li>«¿Qué le debemos a cada cliente y qué facturas están vencidas?» o «registra esta solicitud del cliente y clasifícala».</li>
          </ul>
          <p>Para transcribir una llamada, abre «Registrar llamada» en el computador, toca «Transcribir en vivo» y habla con el celular en altavoz al lado: el CRM escucha y lo pasa a texto (en Chrome o Edge). Al tocar «Detener», Claude la analiza y deja las tareas, la etapa y los borradores. También se puede pegar o subir una transcripción hecha en otra herramienta. La guía completa está en <span class="mono">docs/crm-telefonia-whatsapp.md</span> del repositorio marketing.</p>
        </div></section>
    </div>
  </div>`;
}

/* ===================================================================== app */

/* [id, nombre, ícono, nombre corto para el menú contraído] */
const VIEWS = [["hoy", "Hoy", "sun", "Hoy"], ["leads", "Leads", "list", "Leads"], ["embudo", "Embudo de leads", "funnel", "Embudo"], ["clientes", "Clientes", "building", "Clientes"], ["embudoClientes", "Embudo de clientes", "funnel", "Etapas"], ["proyectos", "Proyectos", "folder", "Proyectos"], ["soporte", "Soporte", "lifebuoy", "Soporte"], ["cobros", "Cobros", "coin", "Cobros"], ["borradores", "Borradores", "doc", "Borradores"], ["ajustes", "Ajustes", "sliders", "Ajustes"]];
const VIEW = Object.fromEntries(VIEWS.map((v) => [v[0], v]));
const NAV_GROUPS = [["", ["hoy"]], ["Ventas", ["leads", "embudo"]], ["Clientes", ["clientes", "embudoClientes", "proyectos", "soporte", "cobros"]], ["", ["borradores", "ajustes"]]];
const TABS_MOVIL = ["hoy", "leads", "clientes", "borradores"];
const MAS_MOVIL = ["embudo", "embudoClientes", "proyectos", "soporte", "cobros", "ajustes"];

function App() {
  const [db, setDb] = useState(undefined);
  const [userApi, setUserApi] = useState(null);
  const [downloads, setDownloads] = useState(null);
  const [sampleState, setSampleState] = useState({ fn: null, off: false });
  const [me, setMe] = useState({ id: null, canWrite: null, avatar: "", name: "" });
  const meRef = useRef(me);
  meRef.current = me;
  const [leads, setLeads] = useState(null);
  const [acts, setActs] = useState([]);
  const [drafts, setDrafts] = useState([]);
  const [clientes, setClientes] = useState(null);
  const [proyectos, setProyectos] = useState(null);
  const [cobros, setCobros] = useState(null);
  const [mantenciones, setMantenciones] = useState(null);
  const [solicitudes, setSolicitudes] = useState(null);
  const [mas, setMas] = useState(false);
  const [equipo, setEquipo] = useState({});
  const [cfg, setCfg] = useState({});
  const [dbError, setDbError] = useState(null);
  const [profiles, setProfiles] = useState({});
  const [view, setView] = useState(() => { const h = (location.hash || "").slice(1); return VIEWS.some((v) => v[0] === h) ? h : ls.get("view", "hoy"); });
  const [drawer, setDrawer] = useState(null);
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [readOnly, setReadOnly] = useState(false);
  const [tareas, setTareas] = useState(null);
  /* Menú lateral con solo íconos: por defecto en pantallas de menos de 1500 px, para que el embudo quepa entero. */
  const [mini, setMini] = useState(() => { const v = ls.get("menuMini", null); return v == null ? window.innerWidth < 1500 : !!v; });
  const alternarMenu = () => { const v = !mini; ls.set("menuMini", v); setMini(v); };

  /* Un aviso a la vez; «accion» agrega un botón (por ejemplo «Deshacer»). */
  const toast = useCallback((msg, tone, accion) => {
    if (!msg) return;
    const id = Math.random().toString(36).slice(2);
    setToasts([{ id, msg, tone: tone || "", accion: accion || null }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), tone === "bad" ? 7000 : accion ? 9000 : 4200);
  }, []);

  useEffect(() => {
    let alive = true;
    const c = window.claude;
    if (!c || typeof c.use !== "function") { setDb(null); return undefined; }
    c.use("db").then((d) => { if (alive) setDb(d || null); }, () => alive && setDb(null));
    c.use("downloads").then((d) => { if (alive) setDownloads(d || null); }, () => {});
    c.use("sample").then((s) => { if (alive) setSampleState(s ? { fn: s, off: false } : { fn: null, off: true }); }, () => alive && setSampleState({ fn: null, off: true }));
    c.use("user").then(async (u) => {
      if (!alive || !u) return;
      setUserApi(u);
      const [m, cw] = await Promise.all([u.me(), u.can("data.write")]);
      if (alive) setMe({ id: m.id, canWrite: cw, avatar: m.avatarUrl, name: m.name || "" });
    }, () => {});
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!db) return undefined;
    const fail = (e) => { console.error("[crm] suscripción", e); setDbError(e); };
    const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
    const un = [
      db.collection("leads").onSnapshot((s) => setLeads(rows(s)), fail),
      db.collection("actividades").orderBy("fecha", "desc").limit(400).onSnapshot((s) => setActs(rows(s)), fail),
      db.collection("borradores").orderBy("creado", "desc").limit(300).onSnapshot((s) => setDrafts(rows(s)), fail),
      db.collection("clientes").onSnapshot((s) => setClientes(rows(s)), fail),
      db.collection("proyectos").onSnapshot((s) => setProyectos(rows(s)), fail),
      db.collection("cobros").onSnapshot((s) => setCobros(rows(s)), fail),
      db.collection("mantenciones").onSnapshot((s) => setMantenciones(rows(s)), fail),
      db.collection("solicitudes").orderBy("creado", "desc").limit(600).onSnapshot((s) => setSolicitudes(rows(s)), fail),
      db.collection("tareas").where("estado", "==", "pendiente").onSnapshot((s) => setTareas(rows(s)), fail),
      db.collection("equipo").onSnapshot((s) => setEquipo(Object.fromEntries(s.docs.map((d) => [d.id, d.data()]))), fail),
      db.doc("config/general").onSnapshot((s) => setCfg(s.exists ? s.data() : {}), fail),
    ];
    return () => un.forEach((u) => u());
  }, [db]);

  const ids = useMemo(() => {
    const s = new Set();
    (leads || []).forEach((l) => { if (l.responsable) s.add(l.responsable); if (l.creadoPor) s.add(l.creadoPor); });
    acts.forEach((a) => a.autor && s.add(a.autor));
    drafts.forEach((d) => d.autor && s.add(d.autor));
    [clientes, proyectos, solicitudes].forEach((arr) => (arr || []).forEach((x) => { if (x.responsable) s.add(x.responsable); if (x.creadoPor) s.add(x.creadoPor); }));
    Object.keys(equipo).forEach((k) => s.add(k));
    if (me.id) s.add(me.id);
    return [...s].filter((x) => /^u_/.test(x)).sort();
  }, [leads, acts, drafts, clientes, proyectos, solicitudes, equipo, me.id]);
  const idsKey = ids.join(",");
  useEffect(() => {
    if (!userApi || !ids.length) return;
    let alive = true;
    userApi.profiles(ids).then((p) => { if (alive) setProfiles(p || {}); }, () => {});
    return () => { alive = false; };
  }, [userApi, idsKey]);

  const nameOf = useCallback((uid) => {
    if (!uid) return "—";
    if (uid === "claude") return "Claude";
    if (uid === "equipo") return "Equipo";
    if (respNombre(uid)) return respNombre(uid);
    if (equipo[uid] && equipo[uid].nombre) return equipo[uid].nombre;
    if (profiles[uid] && profiles[uid].name) return profiles[uid].name;
    if (uid === me.id) return "Tú";
    return "Otra persona";
  }, [equipo, profiles, me.id]);

  const api = useMemo(() => (db ? makeApi(db, meRef) : null), [db]);
  const wrapApi = useMemo(() => {
    if (!api) return null;
    const out = {};
    for (const [k, fn] of Object.entries(api)) {
      out[k] = async (...a) => {
        try { return await fn(...a); } catch (e) { if (e && e.code === "invalid_argument" && me.canWrite == null) setReadOnly(true); throw e; }
      };
    }
    return out;
  }, [api, me.canWrite]);

  const nav = useCallback((v) => { setMas(false); setView(v); ls.set("view", v); try { history.replaceState(null, "", "#" + v); } catch (e) { /* sin historial */ } window.scrollTo({ top: 0 }); }, []);
  const openLead = useCallback((id, tab) => { setModal(null); setDrawer({ kind: "lead", id, tab: tab || "" }); }, []);
  const openCliente = useCallback((id, tab) => { setModal(null); setDrawer({ kind: "cliente", id, tab: tab || "" }); }, []);
  const openProyecto = useCallback((id) => { setModal(null); setDrawer({ kind: "proyecto", id }); }, []);
  const closeDrawer = useCallback(() => setDrawer(null), []);
  const openDraft = useCallback((id) => setModal({ type: "draft", id }), []);
  const openModal = useCallback((m) => setModal(m), []);
  const closeModal = useCallback(() => setModal(null), []);

  /* Embudo de clientes: la etapa queda fija; con "" vuelve a la automática. «Nueva propuesta» pide qué y cuánto. */
  const moverCliente = useCallback(async (c, a, de, extra) => {
    if (!wrapApi) return false;
    if (a === "propuesta" && !extra) { setModal({ type: "propuestaCliente", cliente: c, de }); return false; }
    try {
      await wrapApi.updateCliente(c.id, { ...(extra || {}), etapa: a || null });
      if (a !== de || !a) await wrapApi.addAct({ clienteId: c.id, tipo: "etapa", de: de || "", a: a || "", resumen: a === "propuesta" && extra && extra.propuesta && extra.propuesta.titulo ? extra.propuesta.titulo : "" });
      toast(a ? `${clienteName(c)}: ${etapaClienteLabel(a)}.` : `${clienteName(c)}: etapa automática.`);
      return true;
    } catch (e) { toast(dbErrorText(e), "bad"); return false; }
  }, [wrapApi, toast]);

  const moveProyecto = useCallback(async (p, estado) => {
    if (!wrapApi || p.estado === estado) return;
    try {
      const patch = { estado };
      if (estado === "mejorar" && !isKey(p.produccion)) patch.produccion = todayKey();
      if (estado === "cerrado" && !isKey(p.cierre)) patch.cierre = todayKey();
      await wrapApi.updateProyecto(p.id, patch);
      await wrapApi.addAct({ clienteId: p.clienteId, proyectoId: p.id, tipo: "proyecto", de: p.estado || "por_iniciar", a: estado, resumen: p.nombre || "" });
      const g = estado === "mejorar" ? garantiaHasta({ ...p, ...patch }, cfg) : "";
      toast(g ? `${p.nombre || "Proyecto"}: en producción. Garantía hasta el ${dayLabel(g).toLowerCase()}.` : `${p.nombre || "Proyecto"}: ${faseLabel(estado)}.`);
    } catch (e) { toast(dbErrorText(e), "bad"); }
  }, [wrapApi, toast, cfg]);

  /* Mensualidades del mes en curso: se crean una vez por sesión y por mes (id fijo, sin duplicados). */
  const genRef = useRef("");
  useEffect(() => {
    if (!wrapApi || me.canWrite === false || readOnly || mantenciones === null || cobros === null) return;
    const mk = monthKey(todayKey());
    const key = mk + "|" + mantenciones.map((m) => [m.id, m.estado, m.monto, m.inicio, m.fin, m.diaCobro].join(":")).join(",");
    if (genRef.current === key) return;
    genRef.current = key;
    generarMensualidades(wrapApi, mantenciones, new Set(cobros.map((x) => x.id)), mk).then((n) => { if (n) toast(`${n} ${n === 1 ? "mensualidad agregada" : "mensualidades agregadas"} a Cobros.`); }, () => {});
  }, [wrapApi, me.canWrite, readOnly, mantenciones, cobros]);

  /* Escape cierra lo que esté encima. Lee el estado del último render (no el del último efecto),
     para que funcione aunque se apriete justo cuando se abre una ventana. */
  const abierto = useRef({});
  abierto.current = { modal, drawer, mas };
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      const o = abierto.current;
      if (o.modal) { setModal(null); e.preventDefault(); } else if (o.drawer) { setDrawer(null); e.preventDefault(); } else if (o.mas) { setMas(false); e.preventDefault(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  useEffect(() => { document.body.style.overflow = drawer || modal ? "hidden" : ""; }, [drawer, modal]);

  const canWrite = me.canWrite !== false && !readOnly;
  const leadsById = useMemo(() => Object.fromEntries((leads || []).map((l) => [l.id, l])), [leads]);
  /* Responsables: Lorenzo y Nicolás, más algún valor antiguo que siga en los datos (para no perderlo). */
  const team = useMemo(() => { const s = new Set(RESPONSABLES.map((r) => r[0])); [leads, clientes, proyectos, solicitudes].forEach((arr) => (arr || []).forEach((x) => x.responsable && s.add(x.responsable))); return [...s]; }, [leads, clientes, proyectos, solicitudes]);
  /* Quién abre el CRM: por el nombre de su firma o de su perfil; si no se reconoce, el último que eligió. */
  const yo = respDeNombre((equipo[me.id] && equipo[me.id].nombre) || me.name || "") || (respNombre(ls.get("respUltimo", "")) ? ls.get("respUltimo", "") : "");
  const clientesById = useMemo(() => Object.fromEntries((clientes || []).map((c) => [c.id, c])), [clientes]);
  const proyectosById = useMemo(() => Object.fromEntries((proyectos || []).map((p) => [p.id, p])), [proyectos]);

  /* ---------- tareas */
  const tareasPorLead = useMemo(() => {
    const m = {};
    for (const t of tareas || []) if (t.leadId) (m[t.leadId] = m[t.leadId] || []).push(t);
    for (const k of Object.keys(m)) m[k].sort(tareaOrden);
    return m;
  }, [tareas]);
  /* La próxima tarea de un lead: la primera pendiente o, si no tiene, su «proxima» antigua. */
  const siguienteDe = useCallback((l) => (l ? (tareasPorLead[l.id] || [])[0] || tareaDeProxima(l) : null), [tareasPorLead]);
  const marcarTarea = useCallback(async (t, estado, extra) => {
    if (t.virtual) { await wrapApi.updateLead(t.leadId, { proxima: null }); return; }
    const fin = estado !== "pendiente";
    await wrapApi.updateTarea(t.id, { estado, hecha: fin ? nowISO() : null, hechaPor: fin ? meRef.current.id || null : null, ...(extra || {}) });
  }, [wrapApi]);
  const moverEtapa = useCallback(async (lead, a, extra) => {
    const o = extra || {};
    await wrapApi.updateLead(lead.id, { etapa: a, ...(o.patch || {}) });
    await wrapApi.addAct({ leadId: lead.id, tipo: "etapa", de: etapaDe(lead), a, ...(o.resumen ? { resumen: o.resumen } : {}) });
  }, [wrapApi]);
  /* Al perder, ganar o pausar un lead, sus tareas pendientes quedan descartadas. */
  const cerrarTareasDe = useCallback(async (leadId) => {
    for (const t of tareasPorLead[leadId] || []) await wrapApi.updateTarea(t.id, { estado: "descartada", hecha: nowISO(), hechaPor: meRef.current.id || null });
  }, [wrapApi, tareasPorLead]);

  /* Redacta, uno tras otro, los correos y WhatsApp de las tareas (lo acordado en una llamada o la
     confirmación de una reunión). Cada borrador queda unido a su tarea: al marcarlo como enviado,
     la tarea queda hecha. Claude sigue aunque se cierre la ficha. */
  const redactarTareas = useCallback(async (lead, jobs, delLead, hist) => {
    const fn = sampleState.fn;
    if (!wrapApi || !fn || !jobs.length) return;
    const historial = hist || acts.filter((a) => a.leadId === lead.id);
    const lp = delLead || [];
    let n = 0;
    for (const t of jobs) {
      const canal = t.tipo === "whatsapp" ? "whatsapp" : "correo";
      const que = t.que || t.titulo || "";
      const objetivo = t.objetivo || (/propuesta|cotizaci/i.test(que) ? "propuesta" : /reuni|agend|demo/i.test(que) ? "agendar" : "seguimiento");
      const instrucciones = t.instrucciones || `Quedó acordado en la conversación de hoy: ${que}${t.fecha ? ` (para ${cuandoTexto(t.fecha)})` : ""}.${lp.length ? ` Lo que quedó en hacer ${firstName(lead.nombre) || "el lead"}: ${lp.map((x) => x.que).join("; ")}.` : ""}`;
      try {
        const r = await fn.json(promptBorrador({ canal, objetivo, instrucciones, trato: lead.trato || "tu", firma: equipo[me.id] || {}, cfg, lead, hist: historial }), { modelTier: "default", cache: false });
        let data = { leadId: lead.id, canal, objetivo, instrucciones, firma: me.id || null, generadoPor: "claude", tareaId: t.tareaId || null };
        if (canal === "whatsapp") data.texto = String((r && r.texto) || "").trim();
        else data = { ...data, ...sanitizeEmail(r), plantilla: "carta" };
        const bid = await wrapApi.createDraft(data);
        if (t.tareaId) await wrapApi.updateTarea(t.tareaId, { borradorId: bid });
        n += 1;
      } catch (e) {
        if (e && CLAUDE_OFF.has(e.code)) { setSampleState({ fn: null, off: true }); break; }
      }
    }
    if (n) toast(`${n === 1 ? "Quedó redactado 1 borrador" : `Quedaron redactados ${n} borradores`} para ${leadTitulo(lead)}: revísalo desde su tarea o en «Borradores».`);
    else toast("Claude no pudo redactar el borrador. Puedes hacerlo desde «Redactar con Claude».", "bad");
  }, [wrapApi, sampleState.fn, equipo, me.id, cfg, toast, acts]);

  /* Completar una tarea. «Agendar» pide el día de la reunión y «Reunión» pregunta si se hizo;
     «Enviar propuesta» pasa el lead a «Propuesta enviada» con una llamada de seguimiento. */
  const completarTarea = useCallback(async (t) => {
    const lead = t && leadsById[t.leadId];
    if (!wrapApi || !lead || !tareaPendiente(t)) return;
    const tipo = tipoTarea(t.tipo);
    if (tipo === "agendar") { setModal({ type: "agendar", lead, tarea: t }); return; }
    if (tipo === "reunion") { setModal({ type: "reunionHecha", lead, tarea: t }); return; }
    try {
      const vuelta = [];
      await marcarTarea(t, "hecha");
      vuelta.push(t.virtual ? () => wrapApi.updateLead(lead.id, { proxima: lead.proxima }) : () => wrapApi.updateTarea(t.id, { estado: "pendiente", hecha: null, hechaPor: null }));
      let msg = `Hecho: ${t.titulo || accionLabel(tipo)}.`;
      if (tipo === "propuesta" && avanza(lead, "propuesta")) {
        await moverEtapa(lead, "propuesta", { resumen: t.titulo || "" });
        vuelta.push(() => moverEtapa({ ...lead, etapa: "propuesta" }, etapaDe(lead)));
        msg = `${leadTitulo(lead)}: Propuesta enviada.`;
        if (!(tareasPorLead[lead.id] || []).some((x) => x.id !== t.id)) {
          const f = addBusinessDays(todayKey(), 3);
          const nid = await wrapApi.createTarea({ leadId: lead.id, tipo: "llamar", titulo: "Seguimiento de la propuesta", fecha: f, hora: "", responsable: t.responsable || lead.responsable || yo || null, estado: "pendiente", origen: "etapa" });
          vuelta.push(() => wrapApi.deleteTarea(nid));
          msg += ` Queda una llamada de seguimiento ${cuandoTexto(f)}.`;
        }
      }
      toast(msg, "", { label: "Deshacer", fn: async () => { try { for (const f of vuelta.reverse()) await f(); toast("Listo: quedó como estaba."); } catch (e) { toast(dbErrorText(e), "bad"); } } });
    } catch (e) { toast(dbErrorText(e), "bad"); }
  }, [wrapApi, leadsById, tareasPorLead, marcarTarea, moverEtapa, toast, yo]);

  /* Agenda (o cambia) la reunión de un lead: tarea con día y hora, etapa «Reunión agendada» y, si
     se pide, la confirmación redactada por Claude con su tarea para enviarla hoy. */
  const agendarReunion = useCallback(async (lead, d, origen) => {
    if (!wrapApi) return false;
    try {
      if (origen && tipoTarea(origen.tipo) === "agendar" && tareaPendiente(origen)) await marcarTarea(origen, "hecha");
      const datos = { titulo: d.titulo, fecha: d.fecha, hora: d.hora, duracion: d.duracion, nota: d.nota };
      if (d.reunionId) await wrapApi.updateTarea(d.reunionId, datos);
      else await wrapApi.createTarea({ leadId: lead.id, tipo: "reunion", ...datos, responsable: lead.responsable || yo || null, estado: "pendiente", origen: origen ? "agendar" : "manual" });
      const cuando = `${cuandoTexto(d.fecha)}${d.hora ? " a las " + d.hora : ""}`;
      if (avanza(lead, "reunion_agendada")) await moverEtapa(lead, "reunion_agendada", { resumen: `Reunión ${cuando}` });
      else await wrapApi.addAct({ leadId: lead.id, tipo: "nota", resumen: `${d.reunionId ? "Reunión cambiada" : "Reunión agendada"}: ${cuando}.` });
      let extra = "";
      if (d.confirmar && sampleState.fn && !lead.noContactar) {
        const canal = d.confirmar === "whatsapp" ? "WhatsApp" : "correo";
        const tid = await wrapApi.createTarea({ leadId: lead.id, tipo: d.confirmar, titulo: `Confirmar la reunión por ${canal}`, fecha: todayKey(), hora: "", responsable: lead.responsable || yo || null, estado: "pendiente", origen: "agendar" });
        redactarTareas(lead, [{ tipo: d.confirmar, que: "Confirmar la reunión", tareaId: tid, objetivo: "confirmar", instrucciones: `Confirma la reunión que acabamos de agendar: ${cuando} (${d.duracion} minutos), por Google Meet. Tema: ${d.titulo}.${lead.correo ? " Si sirve, menciona que le mandamos la invitación de calendario a su correo." : ""} Breve y cordial.` }]);
        extra = " Claude está redactando la confirmación.";
      }
      toast(`${leadTitulo(lead)}: reunión ${cuando}.${extra}`);
      return true;
    } catch (e) { toast(dbErrorText(e), "bad"); return false; }
  }, [wrapApi, marcarTarea, moverEtapa, redactarTareas, sampleState.fn, toast, yo]);

  /* Cambiar de etapa desde el embudo o la ficha, con lo que corresponde a cada etapa. */
  const changeStage = useCallback(async (lead, etapa) => {
    const de = etapaDe(lead);
    if (!wrapApi || de === etapa) return;
    if (etapa === "perdido") { setModal({ type: "lost", lead }); return; }
    if (etapa === "ganado" && !lead.clienteId) { setModal({ type: "won", lead }); return; }
    const pend = tareasPorLead[lead.id] || [];
    if (etapa === "reunion_agendada" && !pend.some((x) => tipoTarea(x.tipo) === "reunion")) { setModal({ type: "agendar", lead, desdeEtapa: true }); return; }
    try {
      await moverEtapa(lead, etapa, ETAPA[etapa].open ? {} : { patch: { proxima: null } });
      let msg = `${leadTitulo(lead)}: ${etapaLabel(etapa)}.`;
      let accion = null;
      if (etapa === "ganado" || etapa === "pausa") await cerrarTareasDe(lead.id);
      if (etapa === "pausa") msg = `${leadTitulo(lead)}: En pausa. Si hay que retomarlo, agrégale una tarea con el día.`;
      if (etapa === "reunion_concretada") {
        for (const x of pend) if (tipoTarea(x.tipo) === "reunion") await marcarTarea(x, "hecha");
        accion = { label: "Registrar la reunión", fn: () => openLead(lead.id, "reunion") };
      }
      if (etapa === "propuesta") {
        const props = pend.filter((x) => tipoTarea(x.tipo) === "propuesta");
        for (const x of props) await marcarTarea(x, "hecha");
        if (pend.length === props.length) {
          const f = addBusinessDays(todayKey(), 3);
          await wrapApi.createTarea({ leadId: lead.id, tipo: "llamar", titulo: "Seguimiento de la propuesta", fecha: f, hora: "", responsable: lead.responsable || yo || null, estado: "pendiente", origen: "etapa" });
          msg += ` Queda una llamada de seguimiento ${cuandoTexto(f)}.`;
        }
      }
      toast(msg, "", accion);
    } catch (e) { toast(dbErrorText(e), "bad"); }
  }, [wrapApi, tareasPorLead, moverEtapa, marcarTarea, cerrarTareasDe, toast, openLead, yo]);
  const hoyKey = todayKey();
  let pendientes = 0;
  for (const l of leads || []) {
    if (l.noContactar) continue;
    const ts = tareasPorLead[l.id] || [];
    const v = ts.length ? null : tareaDeProxima(l);
    pendientes += ts.filter((t) => t.fecha && t.fecha <= hoyKey).length + (v && v.fecha <= hoyKey ? 1 : 0);
  }
  const clientesHoy = agendaClientes({ proyectos: proyectos || [], cobros: cobros || [], clientesById }, cfg, 0).length;
  const porRevisar = drafts.filter((d) => d.estado === "por_revisar").length;
  const counts = {
    hoy: pendientes + clientesHoy, borradores: porRevisar, leads: (leads || []).filter(isOpen).length,
    soporte: (solicitudes || []).filter((s) => SOL_ABIERTA.has(s.estado)).length,
    cobros: (cobros || []).filter((x) => pagoVencido(x, cfg) || facturaAtrasada(x)).length,
  };

  /* La «proxima» de cada lead es su primera tarea pendiente: la tabla, el CSV, los respaldos y
     Claude la leen de ahí. Si alguien cambia las tareas, se pone al día sola (sin escribir de más). */
  useEffect(() => {
    if (!wrapApi || !canWrite || leads === null || tareas === null) return undefined;
    const timer = setTimeout(() => {
      for (const l of leads) {
        const ts = tareasPorLead[l.id] || [];
        const esperada = ts.length ? proximaDe(ts[0]) : l.proxima && l.proxima.tareaId ? null : l.proxima || null;
        if (claveProxima(esperada) !== claveProxima(l.proxima)) wrapApi.updateLead(l.id, { proxima: esperada }).catch(() => {});
      }
    }, 900);
    return () => clearTimeout(timer);
  }, [wrapApi, canWrite, leads, tareas, tareasPorLead]);

  const ctx = {
    db, api: wrapApi, me, yo, leads: leads || [], leadsById, acts, drafts, equipo, cfg, sampleState, setSampleState, downloads, toast, nameOf, team, redactarTareas,
    tareas: tareas || [], tareasPorLead, siguienteDe, completarTarea, marcarTarea, agendarReunion, moverEtapa, cerrarTareasDe,
    clientes: clientes || [], clientesById, proyectos: proyectos || [], proyectosById, cobros: cobros || [], mantenciones: mantenciones || [], solicitudes: solicitudes || [],
    openLead, openCliente, openProyecto, openDraft, openModal, closeModal, nav, changeStage, moveProyecto, moverCliente, canWrite, profileName: me.name,
  };

  if (db === null) {
    return html`<div class="boot"><div class="boot-card"><${Logo} /><p class="eyebrow">CRM · ZH Development</p><h1>Abre el CRM desde claude.ai</h1>
      <p>Esta vista no tiene acceso a la base de datos del CRM. Ábrelo desde claude.ai con tu sesión iniciada: los leads solo los ven las personas con acceso.</p></div></div>`;
  }

  let body;
  if (dbError && dbError.code !== "unavailable") {
    body = html`<div class="main-inner"><div class="note bad"><${Icon} name="info" /><div>${dbErrorText(dbError)}</div></div></div>`;
  } else if (db === undefined || leads === null) {
    body = html`<div class="main-inner"><header class="page-head"><div><p class="eyebrow">CRM · ZH Development</p><h1>Cargando los leads…</h1></div></header></div>`;
  } else if (view === "leads") body = html`<${LeadsView} />`;
  else if (view === "embudo") body = html`<${EmbudoView} />`;
  else if (view === "clientes") body = html`<${ClientesView} />`;
  else if (view === "embudoClientes") body = html`<${EmbudoClientesView} />`;
  else if (view === "proyectos") body = html`<${ProyectosView} />`;
  else if (view === "soporte") body = html`<${SoporteView} />`;
  else if (view === "cobros") body = html`<${CobrosView} />`;
  else if (view === "borradores") body = html`<${BorradoresView} />`;
  else if (view === "ajustes") body = html`<${AjustesView} />`;
  else body = html`<${HoyView} />`;

  return html`<${Ctx.Provider} value=${ctx}>
    <div class=${cx("app", mini && "mini")}>
      <aside class="side">
        <div class="brand"><${Logo} /><div class="brand-txt"><b>ZH Development</b><span>CRM y clientes</span></div></div>
        <nav class="nav" aria-label="Secciones">
          ${NAV_GROUPS.map(([g, vs], gi) => html`${g ? html`<p class="nav-group">${g}</p>` : gi && mini ? html`<p class="nav-group" aria-hidden="true"></p>` : null}${vs.map((v) => { const [, l, ic, corto] = VIEW[v]; return html`<button key=${v} aria-current=${view === v ? "page" : "false"} title=${mini ? l : null} onClick=${() => nav(v)}><${Icon} name=${ic} size=${18} /><span class="lbl">${l}</span><span class="lbl-c" aria-hidden="true">${corto || l}</span>${counts[v] ? html`<span class="count">${counts[v]}</span>` : null}</button>`; })}`)}
        </nav>
        <div class="side-foot">
          <button class="btn primary" title="Nuevo lead" onClick=${() => openModal({ type: "newLead" })} disabled=${!wrapApi || !canWrite}><${Icon} name="plus" /><span>Nuevo lead</span></button>
          ${me.id ? html`<div class="me" title=${nameOf(me.id)}><img src=${me.avatar} alt="" /><span>${nameOf(me.id)}</span></div>` : null}
          ${!canWrite ? html`<p>Tienes acceso de solo lectura.</p>` : null}
          <button type="button" class="side-toggle" onClick=${alternarMenu} title=${mini ? "Mostrar el menú completo" : "Dejar solo los íconos"}><${Icon} name=${mini ? "chevR" : "chevL"} size=${18} /><span>Contraer menú</span><span class="sr">${mini ? "Mostrar el menú completo" : ""}</span></button>
        </div>
      </aside>
      <header class="topbar">
        <div class="brand"><${Logo} /><b>CRM</b></div>
        <span class="grow"></span>
        <button class="btn small primary" onClick=${() => openModal({ type: "newLead" })} disabled=${!wrapApi || !canWrite}><${Icon} name="plus" />Nuevo</button>
      </header>
      <main class="main" id="main">
        ${!canWrite && leads ? html`<div class="main-inner" style="margin-bottom:16px"><div class="note"><${Icon} name="info" /><div>Tienes acceso de solo lectura: puedes ver los leads, pero no cambiarlos.</div></div></div>` : null}
        <${Boundary} name="esta sección">${body}</${Boundary}>
      </main>
      <nav class="tabs" aria-label="Secciones">
        ${TABS_MOVIL.map((v) => { const [, l, ic] = VIEW[v]; return html`<button key=${v} aria-current=${view === v ? "page" : "false"} onClick=${() => nav(v)}><${Icon} name=${ic} size=${20} />${l}${(v === "hoy" || v === "borradores") && counts[v] ? html`<span class="dot">${counts[v]}</span>` : null}</button>`; })}
        <button aria-current=${MAS_MOVIL.includes(view) ? "page" : "false"} aria-expanded=${mas ? "true" : "false"} onClick=${() => setMas(!mas)}><${Icon} name="more" size=${20} />Más${counts.soporte + counts.cobros ? html`<span class="dot">${counts.soporte + counts.cobros}</span>` : null}</button>
      </nav>
      ${mas ? html`<div class="more-wrap"><div class="scrim" onClick=${() => setMas(false)}></div><div class="more" role="menu" aria-label="Más secciones">
        ${MAS_MOVIL.map((v) => { const [, l, ic] = VIEW[v]; return html`<button key=${v} role="menuitem" aria-current=${view === v ? "page" : "false"} onClick=${() => nav(v)}><${Icon} name=${ic} size=${18} />${l}${counts[v] ? html`<span class="count">${counts[v]}</span>` : null}</button>`; })}
      </div></div>` : null}
    </div>
    ${drawer && wrapApi ? html`<${Boundary} name="la ficha">
      ${drawer.kind === "cliente" ? html`<${ClienteDrawer} id=${drawer.id} tab=${drawer.tab} onClose=${closeDrawer} />` : drawer.kind === "proyecto" ? html`<${ProyectoDrawer} id=${drawer.id} onClose=${closeDrawer} />` : html`<${LeadDrawer} id=${drawer.id} tab=${drawer.tab} onClose=${closeDrawer} />`}
    </${Boundary}>` : null}
    ${modal && wrapApi ? html`<${Boundary} name="esta ventana">
      ${modal.type === "newLead" ? html`<${NewLeadModal} />` : null}
      ${modal.type === "import" ? html`<${ImportModal} />` : null}
      ${modal.type === "draft" ? html`<${DraftEditor} id=${modal.id} />` : null}
      ${modal.type === "lost" ? html`<${LostModal} lead=${modal.lead} />` : null}
      ${modal.type === "noContesto" ? html`<${NoContestoModal} lead=${modal.lead} />` : null}
      ${modal.type === "agendar" ? html`<${AgendarModal} lead=${modal.lead} tarea=${modal.tarea} desdeEtapa=${!!modal.desdeEtapa} />` : null}
      ${modal.type === "reunionHecha" ? html`<${ReunionHechaModal} lead=${modal.lead} tarea=${modal.tarea} />` : null}
      ${modal.type === "propuestaCliente" ? html`<${PropuestaClienteModal} cliente=${modal.cliente} de=${modal.de} />` : null}
      ${modal.type === "won" ? html`<${WonModal} lead=${modal.lead} />` : null}
      ${modal.type === "newCliente" ? html`<${NewClienteModal} />` : null}
      ${modal.type === "newProyecto" ? html`<${NewProyectoModal} clienteId=${modal.clienteId} />` : null}
      ${modal.type === "solicitud" ? html`<${SolicitudModal} id=${modal.id} clienteId=${modal.clienteId} proyectoId=${modal.proyectoId} />` : null}
      ${modal.type === "cobro" ? html`<${CobroModal} id=${modal.id} clienteId=${modal.clienteId} proyectoId=${modal.proyectoId} />` : null}
      ${modal.type === "mantencion" ? html`<${MantencionModal} id=${modal.id} clienteId=${modal.clienteId} />` : null}
      ${modal.type === "composeCliente" ? html`<${ComposeClienteModal} clienteId=${modal.clienteId} preset=${modal.preset} />` : null}
    </${Boundary}>` : null}
    <div class=${cx("toasts", modal && "raised")} aria-live="polite">${toasts.map((t) => html`<div key=${t.id} class=${cx("toast", t.tone === "bad" && "bad")}><span>${t.msg}</span><span class="toast-acts">${t.accion ? html`<button onClick=${() => { setToasts((x) => x.filter((y) => y.id !== t.id)); t.accion.fn(); }}>${t.accion.label}</button>` : null}<button aria-label="Cerrar aviso" onClick=${() => setToasts((x) => x.filter((y) => y.id !== t.id))}>OK</button></span></div>`)}</div>
  </${Ctx.Provider}>`;
}

const root = document.getElementById("app");
root.className = "";
root.textContent = "";
render(html`<${App} />`, root);
})();
</script>
