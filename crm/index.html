function EmbudoClientesView() {
  const { clientes, proyectos, cobros, mantenciones, solicitudes, clientesById, openModal, canWrite, cfg, team, nameOf, moverCliente } = useCtx();
  const [q, setQ] = useState(() => ls.get("qEmbCli", ""));
  const [resp, setResp] = useState(() => ls.get("respEmbCli", ""));
  const [verArch, setVerArch] = useState(() => ls.get("verCliArch", false));
  useEffect(() => { ls.set("qEmbCli", q); ls.set("respEmbCli", resp); ls.set("verCliArch", verArch); }, [q, resp, verArch]);
  const rows = useMemo(() => {
    const d = { proyectos, cobros, mantenciones, solicitudes, clientesById };
    const qq = fold(q).trim();
    return clientes
      .filter((c) => verArch || c.estado !== "archivado")
      .filter((c) => (resp === "sin" ? !c.responsable : !resp || c.responsable === resp))
      .filter((c) => !qq || fold([c.nombre, c.razonSocial, c.rubro, ...(c.contactos || []).map((x) => x.nombre)].join(" ")).includes(qq))
      .map((c) => { const r = resumenCliente(c.id, d, cfg); return { c, r, etapa: etapaDeCliente(c, r) }; });
  }, [clientes, proyectos, cobros, mantenciones, solicitudes, clientesById, cfg, q, resp, verArch]);
  const { drag, start, boardRef } = useBoardDrag({
    enabled: canWrite,
    onDrop: (id, etapa) => { const x = rows.find((y) => y.c.id === id); if (x) moverCliente(x.c, etapa, x.etapa); },
  });
  const mrr = sum(rows, (x) => x.r.mrr);
  const valorProp = sum(rows.filter((x) => x.etapa === "propuesta"), (x) => (x.c.propuesta || {}).valor);
  const resumen = (id, items) => {
    if (id === "mantencion") { const m = sum(items, (x) => x.r.mrr); return m ? html`<b>${money(m)}</b> al mes` : null; }
    if (id === "propuesta") { const v = sum(items, (x) => (x.c.propuesta || {}).valor); return v ? html`<b>${money(v)}</b> propuesto` : null; }
    if (id === "inicio" || id === "desarrollo") { const v = sum(items, (x) => sum(x.r.activos, (p) => p.valor)); return v ? html`<b>${money(v)}</b> en proyectos` : null; }
    return null;
  };
  return html`<div class="main-inner">
    <header class="page-head">
      <div><p class="eyebrow">${rows.length} ${rows.length === 1 ? "cliente" : "clientes"}${mrr ? ` · ${money(mrr)} al mes en mantenciones` : ""}${valorProp ? ` · ${money(valorProp)} en propuestas` : ""}</p><h1>Embudo de clientes</h1>
        <p class="lede">${canWrite ? "En qué va cada cliente después de ganarlo. Arrastra la tarjeta para cambiar la etapa; mientras no la muevas, sigue a sus proyectos y su mantención." : "Solo lectura."}</p></div>
      <div class="actions">
        <${VistaClientes} actual="embudoClientes" />
        <button class="btn primary" onClick=${() => openModal({ type: "newCliente" })} disabled=${!canWrite}><${Icon} name="plus" />Nuevo cliente</button>
      </div>
    </header>
    <div class="toolbar">
      <label class="search"><span class="sr">Buscar clientes</span><${Icon} name="search" /><input id="buscar-emb-cli" class="input" type="search" placeholder="Buscar por nombre, razón social o contacto" value=${q} onInput=${(e) => setQ(e.currentTarget.value)} /></label>
      <select id="emb-cli-resp" class="select" aria-label="Responsable" value=${resp} onChange=${(e) => setResp(e.currentTarget.value)}>
        <option value="">Todos los responsables</option>${team.map((u) => html`<option value=${u}>${nameOf(u)}</option>`)}<option value="sin">Sin responsable</option>
      </select>
      <label class="check"><input type="checkbox" id="ver-cli-arch" checked=${verArch} onChange=${(e) => setVerArch(e.currentTarget.checked)} />Incluir archivados</label>
    </div>
    ${!clientes.length ? html`<section class="panel"><div class="panel-body" style="padding-top:16px"><p class="empty">Todavía no hay clientes. Cuando un lead pasa a «Ganado» en el embudo de leads, aparece aquí en «Por iniciar».</p></div></section>` : html`
    <div class="board embudo" ref=${boardRef}>
      ${ETAPAS_CLIENTE.map((e) => {
        const items = rows.filter((x) => x.etapa === e.id).sort((a, b) => fold(clienteName(a.c)).localeCompare(fold(clienteName(b.c))));
        const s = resumen(e.id, items);
        return html`<div key=${e.id} data-col=${e.id} class=${cx("col", drag && drag.over === e.id && drag.from !== e.id && "drop")}>
          <div class="col-head"><${EtapaClientePill} etapa=${e.id} /><span class="count">${items.length}</span></div>
          ${s ? html`<p class="col-sum">${s}</p>` : null}
          <${ColLista} n=${items.length}>
            ${items.map((x) => html`<${ClienteCard} key=${x.c.id} c=${x.c} r=${x.r} etapa=${x.etapa} onPointerDown=${(ev) => start(ev, x.c.id, x.etapa)} />`)}
            ${!items.length ? html`<p class="col-empty">${drag ? "Suelta aquí" : "Sin clientes"}</p>` : null}
          </${ColLista}>
        </div>`;
      })}
    </div>`}
  </div>`;
}

/* Al pasar un cliente a «Nueva propuesta»: qué le vamos a proponer y cuánto, más o menos. */
function PropuestaClienteModal({ cliente, de }) {
  const { closeModal, moverCliente } = useCtx();
  const p = cliente.propuesta || {};
  const [titulo, setTitulo] = useState(p.titulo || "");
  const [valor, setValor] = useState(p.valor ? String(p.valor) : "");
  const [saving, setSaving] = useState(false);
  const v = parseMonto(valor);
  const guardar = async () => {
    setSaving(true);
    const ok = await moverCliente(cliente, "propuesta", de, { propuesta: { titulo: titulo.trim(), valor: v || null } });
    if (ok) closeModal(); else setSaving(false);
  };
  return html`<${Modal} title=${"Nueva propuesta: " + clienteName(cliente)} onClose=${closeModal} foot=${html`<button class="btn ghost" onClick=${closeModal}>Cancelar</button><button class="btn primary" onClick=${guardar} disabled=${saving}>Guardar</button>`}>
    <form class="modal-body" onSubmit=${(e) => { e.preventDefault(); guardar(); }}>
      <label class="field" for="prop-titulo"><span>Qué le vamos a proponer</span><input id="prop-titulo" class="input" value=${titulo} onInput=${(e) => setTitulo(e.currentTarget.value)} placeholder="Ej.: evolutivo de reportes, app para los choferes" /></label>
      <label class="field" for="prop-valor"><span>Valor estimado (CLP sin IVA, opcional)</span><input id="prop-valor" class="input mono" inputmode="numeric" value=${valor} onInput=${(e) => setValor(e.currentTarget.value)} />${v ? html`<small class="hint">${money(v)} + IVA</small>` : null}</label>
      <p class="small muted">El caso comercial se arma en propuestaszh, como con un lead. Cuando la ganen, crea el proyecto desde la ficha del cliente: el cliente vuelve solo a su etapa según el proyecto.</p>
      <button type="submit" class="sr">Guardar</button>
    </form>
  </${Modal}>`;
}

function ClientComposer({ cliente, hist, onDone, preset }) {
  const { api, toast, sampleState, setSampleState, cfg, me, equipo, openDraft, canWrite, proyectos, cobros, solicitudes, mantenciones } = useCtx();
  const pre = preset || {};
  const contactos = cliente.contactos || [];
  const ps = proyectos.filter((p) => p.clienteId === cliente.id);
  const cs = cobros.filter((x) => x.clienteId === cliente.id && pendienteCobro(x));
  const ss = solicitudes.filter((s) => s.clienteId === cliente.id && SOL_ABIERTA.has(s.estado));
  const [canal, setCanal] = useState(pre.canal || "correo");
  /* Un recordatorio de pago va a quien ve la facturación, si el cliente lo tiene. */
  const [contactoId, setContactoId] = useState(pre.contactoId || ((pre.objetivo === "cobro" && contactos.find((x) => x.rol === "facturacion")) || contactoPrincipal(cliente) || {}).id || "");
  const [objetivo, setObjetivo] = useState(pre.objetivo || "avance");
  const [proyectoId, setProyectoId] = useState(pre.proyectoId != null ? pre.proyectoId : (ps.find((p) => PROYECTO_VIVO.has(p.estado)) || {}).id || "");
  const [cobroId, setCobroId] = useState(pre.cobroId || (cs.find((x) => pagoVencido(x, cfg)) || cs.find((x) => x.estado === "facturado") || cs[0] || {}).id || "");
  const [solicitudId, setSolicitudId] = useState(pre.solicitudId || (ss[0] || {}).id || "");
  const [trato, setTrato] = useState(cliente.trato || "tu");
  const [plantilla, setPlantilla] = useState("carta");
  const [instr, setInstr] = useState(pre.instrucciones || "");
  const [busy, setBusy] = useState(false);
  const ctl = useRef(null);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const contacto = contactos.find((x) => x.id === contactoId) || null;
  const firmaUid = me.id || "";
  const firma = equipo[firmaUid] || {};

  const crear = async (conClaude) => {
    setBusy(conClaude);
    try {
      const proyecto = ps.find((p) => p.id === proyectoId) || null;
      const cobro = objetivo === "cobro" ? cs.find((x) => x.id === cobroId) || null : null;
      const solicitud = objetivo === "solicitud" ? ss.find((x) => x.id === solicitudId) || null : null;
      let data = { clienteId: cliente.id, contactoId: contacto ? contacto.id : null, proyectoId: proyecto ? proyecto.id : null, cobroId: cobro ? cobro.id : null, solicitudId: solicitud ? solicitud.id : null, canal, objetivo, instrucciones: instr.trim(), firma: firmaUid || null };
      if (conClaude) {
        ctl.current = new AbortController();
        const r = await sampleState.fn.json(promptCliente({ canal, objetivo, instrucciones: instr.trim(), trato, firma, cfg, cliente, contacto, proyecto, cobro, solicitud, mantenciones: mantenciones.filter((m) => m.clienteId === cliente.id), hist }), { modelTier: "default", cache: false, signal: ctl.current.signal });
        if (canal === "whatsapp") data.texto = String((r && r.texto) || "").trim();
        else data = { ...data, ...sanitizeEmail(r), plantilla };
        data.generadoPor = "claude";
      } else if (canal === "whatsapp") data.texto = `Hola ${firstName(contacto && contacto.nombre)}, `;
      else data = { ...data, plantilla, asunto: "", preheader: "", etiqueta: "", titular: "", saludo: `Hola ${firstName(contacto && contacto.nombre)},`, parrafos: [], puntos: [], cta: null, cierre: "Saludos,", posdata: "" };
      if (trato !== (cliente.trato || "tu")) api.updateCliente(cliente.id, { trato }).catch(() => {});
      const id = await api.createDraft(data);
      if (onDone) onDone();
      openDraft(id);
    } catch (e) {
      if (e && e.code !== "cancelled") {
        if (CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true });
        toast(e && e.code && !["invalid_argument", "quota_exceeded", "resource_exhausted", "unavailable", "revoked"].includes(e.code) ? sampleErrorText(e) : dbErrorText(e), "bad");
      }
    } finally { setBusy(false); }
  };

  return html`<div class="work-body">
    <div class="grid-2">
      <div class="field"><span>Canal</span><${Seg} label="Canal" value=${canal} onChange=${setCanal} options=${[["correo", "Correo", "mail"], ["whatsapp", "WhatsApp", "chat"]]} /></div>
      <label class="field" for="cc-para"><span>Para</span><select id="cc-para" class="select" value=${contactoId} onChange=${(e) => setContactoId(e.currentTarget.value)}>
        ${!contactos.length ? html`<option value="">Sin contactos (agrégalos en Datos)</option>` : null}
        ${contactos.map((x) => html`<option value=${x.id}>${x.nombre || "Sin nombre"}${x.cargo ? " · " + x.cargo : ""}</option>`)}
      </select></label>
    </div>
    ${canal === "correo" && contacto && !contacto.correo ? html`<div class="note warn"><${Icon} name="info" /><div>Este contacto no tiene correo. Puedes redactar igual y agregarlo después en Datos.</div></div>` : null}
    ${canal === "whatsapp" && contacto && !contacto.telefono ? html`<div class="note warn"><${Icon} name="info" /><div>Este contacto no tiene teléfono. Puedes redactar igual y agregarlo después en Datos.</div></div>` : null}
    <div class="field"><span>Objetivo</span><${Chips} label="Objetivo" value=${objetivo} onChange=${setObjetivo} options=${OBJETIVOS_CLIENTE.map((o) => [o[0], o[1]])} /></div>
    ${ps.length ? html`<label class="field" for="cc-pro"><span>Proyecto</span><select id="cc-pro" class="select" value=${proyectoId} onChange=${(e) => setProyectoId(e.currentTarget.value)}><option value="">Sin proyecto</option>${ps.map((p) => html`<option value=${p.id}>${p.nombre || "Proyecto"} · ${faseLabel(p.estado)}</option>`)}</select></label>` : null}
    ${objetivo === "cobro" ? (cs.length ? html`<label class="field" for="cc-cob"><span>Cobro</span><select id="cc-cob" class="select" value=${cobroId} onChange=${(e) => setCobroId(e.currentTarget.value)}>${cs.map((x) => html`<option value=${x.id}>${x.concepto || tipoCobroLabel(x.tipo)} · ${money(x.monto)} + IVA${x.factura ? " · factura " + x.factura : ""}</option>`)}</select></label>` : html`<p class="small muted">Este cliente no tiene cobros pendientes.</p>`) : null}
    ${objetivo === "solicitud" ? (ss.length ? html`<label class="field" for="cc-sol"><span>Solicitud</span><select id="cc-sol" class="select" value=${solicitudId} onChange=${(e) => setSolicitudId(e.currentTarget.value)}>${ss.map((s) => html`<option value=${s.id}>${s.titulo || "Solicitud"} · ${coberturaLabel(s.cobertura)}</option>`)}</select></label>` : html`<p class="small muted">Este cliente no tiene solicitudes abiertas.</p>`) : null}
    <div class="grid-2">
      <div class="field"><span>Trato</span><${Seg} label="Trato" value=${trato} onChange=${setTrato} options=${[["tu", "Tú"], ["usted", "Usted"]]} /></div>
      ${canal === "correo" ? html`<div class="field"><span>Diseño</span><${Seg} label="Plantilla" value=${plantilla} onChange=${setPlantilla} options=${[["carta", "Carta"], ["destacado", "Con cabecera"]]} /></div>` : html`<span></span>`}
    </div>
    <label class="field" for="cc-instr"><span>Instrucciones para Claude (opcional)</span><textarea id="cc-instr" class="textarea" rows="3" placeholder="Ej.: cuéntale que el diseño quedó aprobado y que necesitamos el acceso al ERP antes del viernes" value=${instr} onInput=${(e) => setInstr(e.currentTarget.value)}></textarea></label>
    <p class="small muted">${firma.nombre ? `Firma: ${firma.nombre}${firma.cargo ? " · " + firma.cargo : ""}` : "Completa tu firma en Ajustes para que el correo salga con tu nombre."}</p>
    <div class="actions">
      ${sampleState.fn ? (busy ? html`<${Thinking} /><button class="btn small ghost" onClick=${() => ctl.current && ctl.current.abort()}>Detener</button>` : html`<button class="btn claude" onClick=${() => crear(true)} disabled=${!canWrite}><${Icon} name="spark" />Redactar con Claude</button>`) : html`<span class="small muted">${sampleState.off ? "Claude no está disponible en esta vista." : "Conectando con Claude…"}</span>`}
      <button class="btn ghost" onClick=${() => crear(false)} disabled=${busy || !canWrite}>Escribir a mano</button>
    </div>
  </div>`;
}

const REGISTROS_CLIENTE = [["reunion", "Reunión"], ["llamada", "Llamada"], ["nota", "Nota"], ["correo", "Correo"], ["whatsapp", "WhatsApp"]];
function ClientLogger({ cliente, hist, onDone }) {
  const { api, toast, sampleState, setSampleState, canWrite, proyectos, mantenciones, cfg, me, yo } = useCtx();
  const ps = proyectos.filter((p) => p.clienteId === cliente.id);
  const llave = "registro:" + cliente.id;
  const [previo] = useState(() => borradorLocal(llave));
  const [tipo, setTipo] = useState(() => (previo && previo.tipo) || "reunion");
  const [texto, setTexto] = useState(() => (previo && previo.texto) || "");
  const [proyectoId, setProyectoId] = useState((ps.find((p) => PROYECTO_VIVO.has(p.estado)) || {}).id || "");
  const [acta, setActa] = useState(null);
  const [enVivo, setEnVivo] = useState(() => !!(previo && previo.enVivo));
  const [crearSol, setCrearSol] = useState({});
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const ctl = useRef(null);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  useEffect(() => { if (texto.trim()) ls.set(llave, { tipo, texto, enVivo, t: Date.now() }); else ls.del(llave); }, [tipo, texto, enVivo]);
  const ordenar = async () => {
    if (!sampleState.fn || !texto.trim()) return;
    ctl.current = new AbortController();
    setBusy(true);
    try {
      const r = await sampleState.fn.json(promptActa({ cliente, notas: texto, enVivo, proyecto: ps.find((p) => p.id === proyectoId) || null, mantenciones: mantenciones.filter((m) => m.clienteId === cliente.id), hist, cfg }), { modelTier: "default", cache: false, signal: ctl.current.signal });
      const a = sanitizeActa(r);
      setActa(a);
      setCrearSol(Object.fromEntries(a.solicitudes.map((_, i) => [i, true])));
    } catch (e) { if (e && e.code !== "cancelled") { if (CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true }); toast(sampleErrorText(e), "bad"); } } finally { setBusy(false); }
  };
  const guardar = async () => {
    if (!texto.trim()) { toast("Escribe qué pasó.", "bad"); return; }
    setSaving(true);
    try {
      const pid = proyectoId || null;
      await api.addAct({ clienteId: cliente.id, proyectoId: pid, tipo, resumen: texto.trim(), acta: acta || null });
      let n = 0;
      if (acta) {
        for (let i = 0; i < acta.solicitudes.length; i++) {
          if (!crearSol[i]) continue;
          const s = acta.solicitudes[i];
          const sid = await api.createSolicitud({ clienteId: cliente.id, proyectoId: pid, titulo: s.titulo, descripcion: s.descripcion, cobertura: s.cobertura, canal: "reunion", tipo: "otro", prioridad: "media", estado: "nueva", responsable: yo || null });
          await api.addAct({ clienteId: cliente.id, proyectoId: pid, solicitudId: sid, tipo: "solicitud", accion: "nueva", resumen: s.titulo });
          n += 1;
        }
      }
      ls.del(llave);
      toast(n ? `Registrado. ${n} ${n === 1 ? "solicitud creada" : "solicitudes creadas"} en Soporte.` : "Registrado en el historial.");
      onDone();
    } catch (e) { toast(dbErrorText(e), "bad"); } finally { setSaving(false); }
  };
  return html`<div class="work-body">
    ${previo ? html`<div class="note"><${Icon} name="info" /><div>Recuperé lo que quedó sin guardar de este registro.</div></div>` : null}
    <div class="field"><span>Tipo</span><${Chips} label="Tipo" value=${tipo} onChange=${(v) => { setTipo(v); if (v !== "reunion") setActa(null); }} options=${REGISTROS_CLIENTE} /></div>
    ${ps.length ? html`<label class="field" for="cl-pro"><span>Proyecto</span><select id="cl-pro" class="select" value=${proyectoId} onChange=${(e) => setProyectoId(e.currentTarget.value)}><option value="">Sin proyecto</option>${ps.map((p) => html`<option value=${p.id}>${p.nombre || "Proyecto"}</option>`)}</select></label>` : null}
    ${tipo === "reunion" || tipo === "llamada" ? html`<${LiveTranscriber} onText=${(x) => { setEnVivo(true); setTexto((t) => (t.trim() ? t.replace(/\s+$/, "") + "\n" : "") + x); }} />` : null}
    <label class="field" for="cl-texto"><span>${tipo === "reunion" ? "Notas de la reunión" : tipo === "nota" ? "Nota" : "Qué pasó"}</span><textarea id="cl-texto" class="textarea" rows="5" value=${texto} onInput=${(e) => setTexto(e.currentTarget.value)} placeholder=${tipo === "reunion" ? "Lo que se habló, en desorden: acuerdos, pedidos, fechas, quién hace qué" : ""}></textarea>
      ${tipo === "reunion" ? html`<small class="hint">«Ordenar en acta» saca los acuerdos, lo pendiente de cada lado y las solicitudes que hay que registrar.</small>` : null}</label>
    ${tipo === "reunion" && sampleState.fn ? html`<div class="actions">${busy ? html`<${Thinking} text="Claude está ordenando el acta…" /><button class="btn small ghost" onClick=${() => ctl.current && ctl.current.abort()}>Detener</button>` : html`<button class="btn small claude" onClick=${ordenar} disabled=${!texto.trim()}><${Icon} name="spark" />Ordenar en acta con Claude</button>`}</div>` : null}
    ${acta ? html`<${ActaView} a=${acta} />
      ${acta.solicitudes.length ? html`<div class="suggest"><p class="eyebrow">Crear en Soporte al guardar</p>${acta.solicitudes.map((s, i) => html`<label class="check" key=${i}><input type="checkbox" checked=${!!crearSol[i]} onChange=${(e) => { const v = e.currentTarget.checked; setCrearSol((x) => ({ ...x, [i]: v })); }} />${s.titulo} · ${coberturaLabel(s.cobertura)}</label>`)}</div>` : null}` : null}
    <div class="actions"><button class="btn primary" onClick=${guardar} disabled=${saving || !canWrite}>${saving ? "Guardando…" : "Guardar"}</button><button class="btn ghost" onClick=${() => { ls.del(llave); onDone(); }}>Cancelar</button></div>
  </div>`;
}

            <option value="">${"Automática · " + etapaClienteLabel(auto)}</option>${ETAPAS_CLIENTE.map((x) => html`<option value=${x.id}>${x.label}</option>`)}
          </select>
          ${etapa === "propuesta" ? html`<button type="button" class="tag today tagbtn" title="Cambiar la propuesta" onClick=${() => canWrite && openModal({ type: "propuestaCliente", cliente: c, de: etapa })}>${(c.propuesta && c.propuesta.titulo) || "¿Qué le proponemos?"}${c.propuesta && c.propuesta.valor ? " · " + money(c.propuesta.valor) : ""}</button>` : null}

          ${r.vencido ? html`<span class="tag late">${money(r.vencido)} vencido</span>` : null}

            ${!work ? html`<div class="work-body"><p class="small muted">Redacta un correo o un WhatsApp para el cliente (avance, pago, entrega, opinión), registra una reunión o una llamada, o anota una solicitud.</p></div>` : null}

            </button>`;
          })}</div>` : html`<p class="empty">Sin proyectos todavía.</p>`}` : null}

        ${tab === "soporte" ? html`
          <div class="actions"><button class="btn primary small" onClick=${() => openModal({ type: "solicitud", clienteId: c.id })} disabled=${!canWrite}><${Icon} name="plus" />Nueva solicitud</button></div>
          ${sols.length ? html`<div class="irows">${sols.map((s) => html`<${SolRow} key=${s.id} s=${s} />`)}</div>` : html`<p class="empty">Sin solicitudes. Cuando el cliente pida algo (un error, un cambio, un acceso), anótalo aquí para que no se pierda.</p>`}` : null}

        ${tab === "cobros" ? html`

            <div class="kpi good"><b>${money(r.cobrado)}</b><span>Cobrado en total</span></div>

          <section><h3>Mantención</h3>${ms.length ? html`<div class="irows">${ms.map((m) => html`<div class="irow" key=${m.id}>

            <div class="irow-side"><span class="amount">${money(m.monto)}<small>al mes + IVA</small></span></div>
          </div>`)}</div>` : html`<p class="empty">Sin mantención. Al cerrar la garantía conviene ofrecer la mantención técnica (respaldos, monitoreo, seguridad y soporte básico).</p>`}</section>` : null}

        ${tab === "historial" ? html`<section><h3 class="sr">Historial</h3><${Feed} items=${hist} /></section>` : null}

  const sugeridos = ["Levantamiento validado", "Diseño aprobado por el cliente", "Entrega parcial", "Pruebas con usuarios reales", "Puesta en producción"];

    ${hs.map((h, i) => html`<div class=${cx("hito", h.hecho && "done")} key=${h.id || i}>
      <input type="checkbox" aria-label=${"Hito listo: " + (h.nombre || "")} checked=${!!h.hecho} disabled=${!canWrite} onChange=${(e) => upd(i, { hecho: e.currentTarget.checked, fechaHecho: e.currentTarget.checked ? todayKey() : null })} />
      <${InlineInput} aria-label="Nombre del hito" value=${h.nombre} disabled=${!canWrite} onCommit=${(v) => v && upd(i, { nombre: v })} />
      <input class="input" type="date" aria-label=${"Fecha del hito " + (h.nombre || "")} value=${h.fecha || ""} disabled=${!canWrite} onChange=${(e) => upd(i, { fecha: e.currentTarget.value })} />
      <button class="btn small ghost icon" aria-label=${"Quitar el hito " + (h.nombre || "")} onClick=${() => save({ hitos: hs.filter((_, j) => j !== i) })} disabled=${!canWrite}><${Icon} name="x" /></button>
    </div>`)}
    ${canWrite ? html`<div class="hito">
      <span class="irow-ico" style="width:18px;height:18px;background:none"><${Icon} name="plus" /></span>
      <input id="hito-nuevo" class="input" placeholder="Nuevo hito (ej.: Diseño aprobado)" value=${nuevo} onInput=${(e) => setNuevo(e.currentTarget.value)} onKeyDown=${(e) => { if (e.key === "Enter") { add(nuevo, fecha); setNuevo(""); setFecha(""); } }} />
      <input class="input" type="date" aria-label="Fecha del nuevo hito" value=${fecha} onInput=${(e) => setFecha(e.currentTarget.value)} />
      <button class="btn small" onClick=${() => { add(nuevo, fecha); setNuevo(""); setFecha(""); }} disabled=${!nuevo.trim()}>Agregar</button>
    </div>` : null}
    ${!hs.length && canWrite ? html`<div class="actions"><span class="small muted">Sugeridos:</span>${sugeridos.map((n) => html`<button class="btn small" key=${n} onClick=${() => add(n, "")}>${n}</button>`)}</div>` : null}

}

function ProyectoDrawer({ id, onClose }) {
  const { proyectosById, clientesById, cobros, db, api, cfg, toast, canWrite, nameOf, team, openCliente, openModal, moveProyecto } = useCtx();
  const p = proyectosById[id];
  const [hist, setHist] = useState([]);
  const [confirmDel, setConfirmDel] = useState(false);
  const [redactar, setRedactar] = useState(false);
  const [plan, setPlan] = useState("30-40-30");
  useEffect(() => { setRedactar(false); setConfirmDel(false); }, [id]);
  useEffect(() => {
    if (!db || !id) return undefined;
    return db.collection("actividades").where("proyectoId", "==", id).onSnapshot((s) => setHist(s.docs.map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))), () => {});
  }, [db, id]);
  if (!p) return html`<div><div class="scrim" onClick=${onClose}></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Proyecto"><div class="drawer-head"><div class="drawer-title"><h2>Proyecto no encontrado</h2><button class="btn ghost icon" aria-label="Cerrar" onClick=${onClose}><${Icon} name="x" size=${18} /></button></div></div></aside></div>`;
  const c = clientesById[p.clienteId];
  const save = (patch) => api.updateProyecto(p.id, patch).catch((e) => toast(dbErrorText(e), "bad"));
  const cs = cobros.filter((x) => x.proyectoId === p.id && x.estado !== "anulado").sort(cobroOrden);
  const g = garantiaHasta(p, cfg);
  const impl = cs.filter((x) => x.tipo !== "mensualidad");
  const pagado = sum(impl.filter((x) => x.estado === "pagado"), (x) => x.monto);
  const total = p.valor || sum(impl, (x) => x.monto);
  const del = async () => { try { onClose(); await api.deleteProyecto(p.id); toast("Proyecto eliminado."); } catch (e) { toast(dbErrorText(e), "bad"); } };
  const crearPlan = async () => {
    try {
      const n = await crearPlanPago(api, { clienteId: p.clienteId, proyectoId: p.id }, plan, Number(p.valor) || 0, { anticipo: p.inicio || todayKey(), cierre: p.entregaEstimada || "" });
      toast(n ? `${n} ${n === 1 ? "cobro agregado" : "cobros agregados"}.` : "Sin cobros que agregar.");
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const dateField = (k, label, hint) => html`<label class="field" for=${"p-" + k}><span>${label}</span><input id=${"p-" + k} class="input" type="date" value=${p[k] || ""} disabled=${!canWrite} onChange=${(e) => save({ [k]: e.currentTarget.value || null })} />${hint ? html`<small class="hint">${hint}</small>` : null}</label>`;
  return html`<div>

      <div class="drawer-head">

          <${Progress} p=${p} />
          ${p.estado === "mejorar" && g ? html`<span class=${g >= todayKey() ? "tag ok" : "tag late"}>${g >= todayKey() ? "Garantía hasta " + dayLabel(g).toLowerCase() : "Garantía terminada"}</span>` : null}
          ${p.caso ? html`<span class="tag" title="Caso en el repositorio propuestaszh">Caso ${p.caso}</span>` : null}
        </div>
      </div>
      <div class="drawer-body">
        <section class="box">
          <div class="grid-3">
            ${dateField("inicio", "Inicio")}
            ${dateField("entregaEstimada", "Entrega estimada")}
            ${dateField("produccion", "Puesta en producción", "Desde aquí corre la garantía.")}
          </div>
          <div class="grid-3">
            <${TextField} id="p-gdias" label="Días de garantía" mono value=${String(garantiaDiasDe(p, cfg))} disabled=${!canWrite} onSave=${(v) => { const n = Number(String(v).replace(/\D/g, "")); save({ garantiaDias: n > 0 ? n : null }); }} />
            <div class="field span-2"><span>Garantía</span><p class="small" style="padding-top:8px">${g ? (g >= todayKey() ? `Cubre errores atribuibles al desarrollo hasta el ${dayLabel(g).toLowerCase()} (${diffDays(todayKey(), g)} días más).` : `Terminó el ${dayLabel(g).toLowerCase()}. Lo que llegue ahora es mantención o evolutivo.`) : "Empieza a contar desde la puesta en producción, que se completa sola al pasar a «Mejorar»."}</p></div>
          </div>
        </section>

        <section><h3>Hitos</h3><${HitosEditor} p=${p} save=${save} canWrite=${canWrite} /></section>

        <section>
          <div class="split"><h3>Cobros</h3><span class="small muted">${money(pagado)} pagado de ${money(total)} + IVA</span></div>
          ${cs.length ? html`<div class="irows">${cs.map((x) => html`<${CobroRow} key=${x.id} x=${x} />`)}</div>` : html`<p class="empty">Sin cobros todavía.</p>`}
          <div class="actions">
            <button class="btn small" onClick=${() => openModal({ type: "cobro", clienteId: p.clienteId, proyectoId: p.id })} disabled=${!canWrite}><${Icon} name="plus" />Agregar cobro</button>
            ${!cs.length && p.valor && canWrite ? html`<select id="p-plan" class="select" style="width:auto" aria-label="Calendario de pagos" value=${plan} onChange=${(e) => setPlan(e.currentTarget.value)}>${PLANES_PAGO.filter((x) => x[2].length).map(([v, l]) => html`<option value=${v}>Pagos ${l}</option>`)}</select><button class="btn small" onClick=${crearPlan}>Crear calendario de pagos</button>` : null}
          </div>
        </section>

        ${c ? html`<section class="work">
          <div class="work-tabs" role="tablist" aria-label="Redactar"><button type="button" aria-pressed=${redactar ? "true" : "false"} onClick=${() => setRedactar(!redactar)}><${Icon} name="spark" />Redactar para el cliente</button></div>
          ${redactar ? html`<${ClientComposer} cliente=${c} hist=${hist} preset=${{ proyectoId: p.id, objetivo: p.estado === "mejorar" ? "entrega" : "avance" }} onDone=${() => setRedactar(false)} />` : html`<div class="work-body"><p class="small muted">Claude arma el correo de avance, de entrega con garantía o de coordinación con los hitos y el historial del proyecto.</p></div>`}
        </section>` : null}

        <section><h3>Enlaces</h3><${LinksEditor} p=${p} save=${save} canWrite=${canWrite} /></section>

        <details class="data">
          <summary>Datos del proyecto</summary>
          <div class="grid-2">
            <${TextField} id="p-nombre" label="Nombre" value=${p.nombre} disabled=${!canWrite} onSave=${(v) => save({ nombre: v })} />
            <${SelectField} id="p-tipo" label="Tipo" value=${p.tipo || "software"} disabled=${!canWrite} options=${TIPOS_PROYECTO} onSave=${(v) => save({ tipo: v })} />
            <${TextField} id="p-valor" label="Valor (CLP sin IVA)" mono value=${p.valor ? String(p.valor) : ""} disabled=${!canWrite} onSave=${(v) => save({ valor: parseMonto(v) })} hint=${p.valor ? money(p.valor) + " + IVA" : ""} />
            <${SelectField} id="p-resp" label="Responsable" value=${p.responsable || ""} disabled=${!canWrite} options=${[["", "Sin responsable"], ...team.map((u) => [u, nameOf(u)])]} onSave=${(v) => save({ responsable: v || null })} />
            <${TextField} id="p-caso" label="Caso en propuestaszh" value=${p.caso} disabled=${!canWrite} onSave=${(v) => save({ caso: v })} hint="Ej.: 2026-cliente-proyecto" />
            <span></span>
            <div class="span-2"><${TextField} id="p-alcance" label="Alcance" multiline rows=${4} value=${p.alcance} disabled=${!canWrite} onSave=${(v) => save({ alcance: v })} hint="Lo contratado, en pocas líneas. Ayuda a decidir si una solicitud es garantía o evolutivo." /></div>
            <div class="span-2"><${TextField} id="p-notas" label="Notas internas" multiline value=${p.notas} disabled=${!canWrite} onSave=${(v) => save({ notas: v })} /></div>
          </div>
          ${canWrite ? html`<div class="actions" style="margin-top:12px">${confirmDel ? html`<span class="small">¿Eliminar el proyecto y sus cobros pendientes? Lo pagado, la mantención y las solicitudes quedan en el cliente.</span><button class="btn small danger" onClick=${del}>Sí, eliminar</button><button class="btn small ghost" onClick=${() => setConfirmDel(false)}>Cancelar</button>` : html`<button class="btn small ghost danger" onClick=${() => setConfirmDel(true)}><${Icon} name="trash" />Eliminar proyecto</button>`}</div>` : null}
        </details>

        <section><h3>Historial</h3><${Feed} items=${hist} /></section>
      </div>
    </aside>
  </div>`;
}

/* ===================================================================== soporte */

function SoporteView() {
  const { solicitudes, clientes, openModal, canWrite } = useCtx();
  const [f, setF] = useState(() => ls.get("fSol", "abiertas"));
  const [cli, setCli] = useState(() => ls.get("fSolCli", ""));
  const [cob, setCob] = useState(() => ls.get("fSolCob", ""));
  useEffect(() => { ls.set("fSol", f); ls.set("fSolCli", cli); ls.set("fSolCob", cob); }, [f, cli, cob]);
  const list = solicitudes.filter((s) => (f === "abiertas" ? SOL_ABIERTA.has(s.estado) : f === "cerradas" ? !SOL_ABIERTA.has(s.estado) : true) && (!cli || s.clienteId === cli) && (!cob || s.cobertura === cob)).sort(solOrden);
  const abiertas = solicitudes.filter((s) => SOL_ABIERTA.has(s.estado));
  const grupos = f === "abiertas" ? [["nueva", "Nuevas"], ["en_curso", "En curso"], ["esperando_cliente", "Esperando al cliente"]].filter(([k], i) => i === 0 || list.some((s) => s.estado === k)) : null;
  const porCotizar = abiertas.filter((s) => s.cobertura === "evolutivo" && !(s.cotizacion && s.cotizacion.estado === "aprobada")).length;
  return html`<div class="main-inner">
    <header class="page-head">
      <div><p class="eyebrow">${abiertas.length} ${abiertas.length === 1 ? "abierta" : "abiertas"}${porCotizar ? ` · ${porCotizar} ${porCotizar === 1 ? "evolutivo" : "evolutivos"} por cotizar` : ""}</p><h1>Soporte</h1>
        <p class="lede">Lo que piden los clientes. Cada solicitud es garantía (se corrige sin costo), mantención (la cubre la mensualidad) o evolutivo (se cotiza aparte).</p></div>
      <div class="actions"><button class="btn primary" onClick=${() => openModal({ type: "solicitud" })} disabled=${!canWrite || !clientes.length}><${Icon} name="plus" />Nueva solicitud</button></div>
    </header>
    <div class="toolbar">
      <${Seg} label="Estado" value=${f} onChange=${setF} options=${[["abiertas", "Abiertas"], ["cerradas", "Cerradas"], ["todas", "Todas"]]} />
      <select id="f-sol-cli" class="select" aria-label="Cliente" value=${cli} onChange=${(e) => setCli(e.currentTarget.value)}><option value="">Todos los clientes</option>${clientes.map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select>
      <select id="f-sol-cob" class="select" aria-label="Cobertura" value=${cob} onChange=${(e) => setCob(e.currentTarget.value)}><option value="">Toda cobertura</option>${COBERTURAS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select>
    </div>
    ${grupos ? grupos.map(([k, l]) => {
      const items = list.filter((s) => s.estado === k);
      return html`<section class="panel" key=${k}><div class="panel-head"><h2>${l}</h2><span class="eyebrow">${items.length}</span></div>
        <div class="panel-body">${items.length ? html`<div class="irows">${items.map((s) => html`<${SolRow} key=${s.id} s=${s} showCliente />`)}</div>` : html`<p class="empty">${k === "nueva" ? (clientes.length ? "No hay solicitudes nuevas." : "Primero agrega un cliente.") : "Nada aquí."}</p>`}</div></section>`;
    }) : html`<section class="panel"><div class="panel-body" style="padding-top:8px">${list.length ? html`<div class="irows">${list.map((s) => html`<${SolRow} key=${s.id} s=${s} showCliente />`)}</div>` : html`<p class="empty">No hay solicitudes en esta lista.</p>`}</div></section>`}
  </div>`;
}

function SolicitudModal({ id, clienteId: cid0, proyectoId: pid0 }) {
  const { solicitudes, clientes, clientesById, proyectos, mantenciones, api, closeModal, toast, canWrite, me, yo, team, nameOf, sampleState, setSampleState, cfg, db, openDraft, openModal } = useCtx();
  const stored = id ? solicitudes.find((s) => s.id === id) : null;
  const [f, setF] = useState(() => (stored ? { ...stored, horasEstimadas: stored.horasEstimadas || "", horasReales: stored.horasReales || "" } : { clienteId: cid0 || "", proyectoId: pid0 || "", titulo: "", descripcion: "", canal: "correo", tipo: "error", cobertura: "por_definir", prioridad: "media", estado: "nueva", responsable: yo || "", horasEstimadas: "", horasReales: "", resolucion: "", cotizacion: null }));
  const [sug, setSug] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const ctl = useRef(null);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  useEffect(() => {
    if (id || f.proyectoId || !f.clienteId) return;
    const vivo = proyectos.find((p) => p.clienteId === f.clienteId && PROYECTO_VIVO.has(p.estado));
    if (vivo) setF((x) => ({ ...x, proyectoId: vivo.id }));
  }, [f.clienteId]);
  if (id && !stored) return html`<${Modal} title="Solicitud" onClose=${closeModal}><div class="modal-body"><p class="empty">Esta solicitud ya no existe.</p></div></${Modal}>`;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const cli = clientesById[f.clienteId];
  const ps = proyectos.filter((p) => p.clienteId === f.clienteId);
  const proyecto = ps.find((p) => p.id === f.proyectoId) || null;
  const g = proyecto ? garantiaHasta(proyecto, cfg) : "";
  const mantActiva = mantenciones.some((m) => m.clienteId === f.clienteId && m.estado === "activa");
  const cot = f.cotizacion || { monto: null, estado: "por_enviar" };

  const clasificar = async () => {
    if (!sampleState.fn || !cli) return;
    ctl.current = new AbortController();
    setBusy(true);
    try {
      const hs = (await db.collection("actividades").where("clienteId", "==", cli.id).get()).docs.map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, 10);
      const r = await sampleState.fn.json(promptSolicitud({ cliente: cli, proyecto, mantenciones: mantenciones.filter((m) => m.clienteId === cli.id), hist: hs, cfg, titulo: f.titulo, descripcion: f.descripcion, canal: f.canal, trato: cli.trato || "tu" }), { modelTier: "default", cache: false, signal: ctl.current.signal });
      setSug(sanitizeSolicitud(r));
    } catch (e) { if (e && e.code !== "cancelled") { if (CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true }); toast(sampleErrorText(e), "bad"); } } finally { setBusy(false); }
  };
  const aplicar = () => setF((x) => ({ ...x, cobertura: sug.cobertura, tipo: sug.tipo, prioridad: sug.prioridad, titulo: x.titulo.trim() ? x.titulo : sug.titulo, analisis: { motivo: sug.motivo, resumen: sug.resumen, pasos: sug.pasos, preguntas: sug.preguntas } }));

  const guardar = async (extra) => {
    if (!f.clienteId) { toast("Elige el cliente.", "bad"); return null; }
    if (!String(f.titulo).trim() && !String(f.descripcion).trim()) { toast("Escribe qué pidió el cliente.", "bad"); return null; }
    setSaving(true);
    try {
      const data = {
        clienteId: f.clienteId, proyectoId: f.proyectoId || null, titulo: String(f.titulo).trim() || clip(String(f.descripcion).trim().split("\n")[0], 80), descripcion: f.descripcion || "",
        canal: f.canal, tipo: f.tipo, cobertura: f.cobertura, prioridad: f.prioridad, estado: f.estado, responsable: f.responsable || null,
        horasEstimadas: Number(f.horasEstimadas) || null, horasReales: Number(f.horasReales) || null, resolucion: f.resolucion || "",
        cotizacion: f.cobertura === "evolutivo" && f.cotizacion ? f.cotizacion : null, analisis: f.analisis || null, ...(extra || {}),
      };
      let sid = id;
      if (!id) {
        sid = await api.createSolicitud(data);
        await api.addAct({ clienteId: data.clienteId, proyectoId: data.proyectoId, solicitudId: sid, tipo: "solicitud", accion: "nueva", resumen: data.titulo });
      } else {
        if (data.estado === "resuelta" && !stored.resuelta) data.resuelta = nowISO();
        await api.updateSolicitud(id, data);
        if (SOL_ABIERTA.has(stored.estado) && data.estado === "resuelta") await api.addAct({ clienteId: data.clienteId, proyectoId: data.proyectoId, solicitudId: id, tipo: "solicitud", accion: "resuelta", resumen: data.titulo + (data.resolucion ? "\n" + data.resolucion : "") });
      }
      return sid;
    } catch (e) { toast(dbErrorText(e), "bad"); return null; } finally { setSaving(false); }
  };
  const guardarYCerrar = async () => { const sid = await guardar(); if (sid) { toast(id ? "Solicitud guardada." : "Solicitud creada."); closeModal(); } };
  const borradorRespuesta = async () => {
    const sid = await guardar();
    if (!sid || !cli) return;
    const ct = contactoPrincipal(cli);
    const canal = f.canal === "whatsapp" ? "whatsapp" : "correo";
    const texto = (sug && sug.respuesta) || "";
    const body = canal === "whatsapp" ? { texto } : { plantilla: "carta", asunto: clip(`Re: ${String(f.titulo).trim() || "tu solicitud"}`, 60), preheader: "", etiqueta: "Soporte", titular: "", saludo: `Hola ${firstName(ct && ct.nombre)},`, parrafos: texto ? texto.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean) : [], puntos: [], cta: null, cierre: "Saludos,", posdata: "" };
    try {
      const did = await api.createDraft({ clienteId: cli.id, contactoId: ct ? ct.id : null, proyectoId: f.proyectoId || null, solicitudId: sid, canal, objetivo: "solicitud", firma: me.id || null, generadoPor: sug ? "claude" : null, ...body });
      openDraft(did);
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const crearCobro = async () => {
    if (!(Number(cot.monto) > 0)) { toast("Escribe el monto de la cotización.", "bad"); return; }
    try {
      const cid = await api.createCobro({ clienteId: f.clienteId, proyectoId: f.proyectoId || null, solicitudId: id || null, tipo: "evolutivo", concepto: clip(`Evolutivo: ${String(f.titulo).trim() || "cambio solicitado"}`, 90), monto: Number(cot.monto), fecha: todayKey(), estado: "por_facturar" });
      const next = { ...cot, estado: "aprobada", cobroId: cid };
      set("cotizacion", next);
      await guardar({ cotizacion: next });
      toast("Cobro del evolutivo creado en Cobros.");
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const del = async () => { try { closeModal(); await api.deleteSolicitud(id); toast("Solicitud eliminada."); } catch (e) { toast(dbErrorText(e), "bad"); } };

  const foot = html`
    ${id && canWrite ? (confirmDel ? html`<button class="btn danger" onClick=${del}>Sí, eliminar</button><button class="btn ghost" onClick=${() => setConfirmDel(false)}>No</button>` : html`<button class="btn ghost danger" onClick=${() => setConfirmDel(true)}><${Icon} name="trash" />Eliminar</button>`) : null}
    <span style="flex:1"></span>
    ${id && cli ? html`<button class="btn" disabled=${saving || !canWrite} onClick=${async () => { const sid = await guardar(); if (sid) openModal({ type: "composeCliente", clienteId: cli.id, preset: { objetivo: "solicitud", solicitudId: sid, proyectoId: f.proyectoId || "", canal: f.canal === "whatsapp" ? "whatsapp" : "correo" } }); }}><${Icon} name="spark" />Redactar respuesta</button>` : null}
    <button class="btn ghost" onClick=${closeModal}>Cancelar</button>
    <button class="btn primary" onClick=${guardarYCerrar} disabled=${saving || !canWrite}>${saving ? "Guardando…" : id ? "Guardar" : "Crear solicitud"}</button>`;

  return html`<${Modal} title=${id ? "Solicitud" : "Nueva solicitud"} onClose=${closeModal} wide foot=${foot} labelId="sol-title">
    <div class="modal-body">
      <div class="grid-2">
        <label class="field" for="s-cli"><span>Cliente</span><select id="s-cli" class="select" value=${f.clienteId} onChange=${(e) => setF((x) => ({ ...x, clienteId: e.currentTarget.value, proyectoId: "" }))}><option value="">Elige un cliente</option>${clientes.filter((c) => c.estado !== "archivado" || c.id === f.clienteId).map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select></label>
        <label class="field" for="s-pro"><span>Proyecto</span><select id="s-pro" class="select" value=${f.proyectoId || ""} onChange=${(e) => set("proyectoId", e.currentTarget.value)}><option value="">Sin proyecto</option>${ps.map((p) => html`<option value=${p.id}>${p.nombre || "Proyecto"}</option>`)}</select></label>
        <label class="field span-2" for="s-tit"><span>Título</span><input id="s-tit" class="input" value=${f.titulo} onInput=${(e) => set("titulo", e.currentTarget.value)} placeholder="Ej.: no carga el informe mensual" /></label>
        <label class="field span-2" for="s-desc"><span>Lo que pidió el cliente</span><textarea id="s-desc" class="textarea" rows="5" value=${f.descripcion} onInput=${(e) => set("descripcion", e.currentTarget.value)} placeholder="Pega el correo o el mensaje tal cual, o resume lo que pidió"></textarea></label>
        <label class="field" for="s-canal"><span>Llegó por</span><select id="s-canal" class="select" value=${f.canal} onChange=${(e) => set("canal", e.currentTarget.value)}>${CANALES.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label>
        <label class="field" for="s-tipo"><span>Tipo</span><select id="s-tipo" class="select" value=${f.tipo} onChange=${(e) => set("tipo", e.currentTarget.value)}>${TIPOS_SOL.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label>
      </div>
      ${cli ? html`<p class="small muted">${proyecto ? (g ? (g >= todayKey() ? `${proyecto.nombre}: en garantía hasta el ${dayLabel(g).toLowerCase()}.` : `${proyecto.nombre}: la garantía terminó el ${dayLabel(g).toLowerCase()}.`) : `${proyecto.nombre}: todavía no está en producción, así que la garantía no ha empezado.`) : "Sin proyecto asociado."} ${mantActiva ? "Tiene mantención activa." : "No tiene mantención activa."}</p>` : null}
      <div class="field"><span>Cobertura</span><${Seg} label="Cobertura" value=${f.cobertura} onChange=${(v) => set("cobertura", v)} options=${COBERTURAS} /><small class="hint">${COBERTURA_AYUDA[f.cobertura]}</small></div>
      ${sampleState.fn ? html`<div class="actions">${busy ? html`<${Thinking} text="Claude está revisando la solicitud…" /><button class="btn small ghost" onClick=${() => ctl.current && ctl.current.abort()}>Detener</button>` : html`<button class="btn small claude" onClick=${clasificar} disabled=${!cli || !(String(f.titulo).trim() || String(f.descripcion).trim())}><${Icon} name="spark" />Clasificar y responder con Claude</button>`}</div>` : null}
      ${sug ? html`<div class="analysis">
        <h4>Sugerencia de Claude</h4>
        <p><b>${coberturaLabel(sug.cobertura)}</b>${sug.motivo ? " · " + sug.motivo : ""}</p>
        <p class="small">${pick(TIPOS_SOL, sug.tipo)} · prioridad ${sug.prioridad}${sug.resumen ? " · " + sug.resumen : ""}</p>
        <div class="grid-2">${sug.pasos.length ? html`<div><h4>Pasos</h4><ul>${sug.pasos.map((x) => html`<li>${x}</li>`)}</ul></div>` : null}${sug.preguntas.length ? html`<div><h4>Preguntar al cliente</h4><ul>${sug.preguntas.map((x) => html`<li>${x}</li>`)}</ul></div>` : null}</div>
        <label class="field" for="s-resp"><span>Respuesta propuesta</span><textarea id="s-resp" class="textarea" rows="4" value=${sug.respuesta} onInput=${(e) => { const v = e.currentTarget.value; setSug((x) => ({ ...x, respuesta: v })); }}></textarea></label>

        <label class="field" for="s-resp-u"><span>Responsable</span><select id="s-resp-u" class="select" value=${f.responsable || ""} onChange=${(e) => set("responsable", e.currentTarget.value)}><option value="">Sin responsable</option>${team.map((u) => html`<option value=${u}>${nameOf(u)}</option>`)}</select></label>

        <label class="field" for="s-hr"><span>Horas reales</span><input id="s-hr" class="input mono" inputmode="decimal" value=${f.horasReales} onInput=${(e) => set("horasReales", e.currentTarget.value.replace(/[^\d.,]/g, "").replace(",", "."))} /></label>
      </div>
      ${f.cobertura === "evolutivo" ? html`<div class="box">
        <h4>Cotización del evolutivo</h4>
        <div class="grid-2">
          <label class="field" for="s-cot"><span>Monto (CLP sin IVA)</span><input id="s-cot" class="input mono" inputmode="numeric" value=${cot.monto ? String(cot.monto) : ""} onInput=${(e) => set("cotizacion", { ...cot, monto: parseMonto(e.currentTarget.value) })} />${cot.monto ? html`<small class="hint">${money(cot.monto)} + IVA</small>` : null}</label>
          <label class="field" for="s-cotest"><span>Estado</span><select id="s-cotest" class="select" value=${cot.estado} onChange=${(e) => set("cotizacion", { ...cot, estado: e.currentTarget.value })}><option value="por_enviar">Por enviar</option><option value="enviada">Enviada</option><option value="aprobada">Aprobada</option><option value="rechazada">Rechazada</option></select></label>
        </div>
        ${cot.cobroId ? html`<p class="small muted">El cobro de este evolutivo ya está en Cobros.</p>` : html`<div class="actions"><button class="btn small" onClick=${crearCobro} disabled=${!canWrite || !(Number(cot.monto) > 0)}><${Icon} name="coin" />Aprobada: crear el cobro</button></div>`}
      </div>` : null}
      ${f.estado === "resuelta" || f.estado === "descartada" || f.resolucion ? html`<label class="field" for="s-res"><span>Cómo se resolvió</span><textarea id="s-res" class="textarea" rows="3" value=${f.resolucion} onInput=${(e) => set("resolucion", e.currentTarget.value)}></textarea></label>` : null}
      ${stored ? html`<p class="small muted">Creada ${ago(stored.creado)}${stored.creadoPor ? " por " + nameOf(stored.creadoPor) : ""}${stored.resuelta ? " · resuelta " + ago(stored.resuelta) : ""}</p>` : null}
    </div>
  </${Modal}>`;
}

/* ===================================================================== cobros */

function CobrosView() {
  const { cobros, mantenciones, clientes, clientesById, openModal, canWrite, cfg } = useCtx();
  const [f, setF] = useState(() => ls.get("fCob", "pendientes"));
  const [cli, setCli] = useState(() => ls.get("fCobCli", ""));
  useEffect(() => { ls.set("fCob", f); ls.set("fCobCli", cli); }, [f, cli]);
  const t = todayKey();
  const mk = monthKey(t);
  const base = cobros.filter((x) => x.estado !== "anulado" && (!cli || x.clienteId === cli));
  const facturados = base.filter((x) => x.estado === "facturado");
  const vencidos = facturados.filter((x) => pagoVencido(x, cfg));
  const porFacturar = base.filter((x) => x.estado === "por_facturar" && isKey(x.fecha) && monthKey(x.fecha) <= mk);
  const cobradoMes = base.filter((x) => x.estado === "pagado" && monthKey(x.fechaPago) === mk);
  const ms = mantenciones.filter((m) => !cli || m.clienteId === cli);
  const mrr = sum(ms.filter((m) => m.estado === "activa"), (m) => m.monto);
  const list = base.filter((x) => (f === "pendientes" ? pendienteCobro(x) : f === "pagados" ? x.estado === "pagado" : true));
  const groupKey = (x) => (x.estado === "pagado" ? monthKey(x.fechaPago) : x.estado === "facturado" ? monthKey(venceCobro(x, cfg) || x.fecha) : monthKey(x.fecha)) || "";
  const groups = {};
  for (const x of list) (groups[groupKey(x)] = groups[groupKey(x)] || []).push(x);
  const keys = Object.keys(groups).sort((a, b) => (f === "pagados" ? b.localeCompare(a) : (a || "9999").localeCompare(b || "9999")));
  return html`<div class="main-inner">
    <header class="page-head">
      <div><p class="eyebrow">Montos sin IVA · plazo de pago ${plazoPago(cfg)} días</p><h1>Cobros</h1>
        <p class="lede">Anticipos, pagos por hito, evolutivos y mensualidades. Las mensualidades de mantención se agregan solas cada mes.</p></div>
      <div class="actions">
        <button class="btn" onClick=${() => openModal({ type: "mantencion" })} disabled=${!canWrite || !clientes.length}><${Icon} name="repeat" />Nueva mantención</button>
        <button class="btn primary" onClick=${() => openModal({ type: "cobro" })} disabled=${!canWrite || !clientes.length}><${Icon} name="plus" />Nuevo cobro</button>
      </div>
    </header>
    <div class="kpis">
      <div class="kpi"><b>${money(sum(facturados, (x) => x.monto))}</b><span>Facturado por cobrar (${facturados.length})</span></div>
      <div class=${cx("kpi", vencidos.length && "alert")}><b>${money(sum(vencidos, (x) => x.monto))}</b><span>Vencido (${vencidos.length})</span></div>
      <div class="kpi"><b>${money(sum(porFacturar, (x) => x.monto))}</b><span>Por facturar este mes (${porFacturar.length})</span></div>
      <div class="kpi good"><b>${money(sum(cobradoMes, (x) => x.monto))}</b><span>Cobrado en ${monthLabel(mk).toLowerCase()}</span></div>
      <div class="kpi"><b>${money(mrr)}</b><span>Mantenciones al mes</span></div>
    </div>
    <div class="toolbar">
      <${Seg} label="Filtro" value=${f} onChange=${setF} options=${[["pendientes", "Pendientes"], ["pagados", "Pagados"], ["todos", "Todos"]]} />
      <select id="f-cob-cli" class="select" aria-label="Cliente" value=${cli} onChange=${(e) => setCli(e.currentTarget.value)}><option value="">Todos los clientes</option>${clientes.map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select>
    </div>
    ${!list.length ? html`<section class="panel"><div class="panel-body" style="padding-top:16px"><p class="empty">${cobros.length ? "No hay cobros en esta lista." : "Todavía no hay cobros. Se crean con el proyecto al marcar un lead como «Ganado», o con «Nuevo cobro»."}</p></div></section>` : keys.map((k) => html`<section class="panel" key=${k || "sin"}>
      <div class="panel-head"><h2>${k ? monthLabel(k) : "Sin fecha"}</h2><span class="eyebrow">${money(sum(groups[k], (x) => x.monto))} + IVA</span></div>
      <div class="panel-body"><div class="irows">${groups[k].sort(cobroOrden).map((x) => html`<${CobroRow} key=${x.id} x=${x} showCliente />`)}</div></div>
    </section>`)}
    <section class="panel"><div class="panel-head"><h2>Mantenciones</h2><span class="eyebrow">${ms.filter((m) => m.estado === "activa").length} activas</span></div>
      <div class="panel-body">${ms.length ? html`<div class="irows">${ms.map((m) => html`<div class="irow" key=${m.id}>
        <span class=${cx("irow-ico", m.estado === "activa" && "ok")}><${Icon} name="repeat" /></span>
        <button class="irow-main" onClick=${() => openModal({ type: "mantencion", id: m.id })}><b>${clienteName(clientesById[m.clienteId])} · ${m.plan || "Mantención"}</b><span>${m.estado === "activa" ? "Activa" : m.estado === "pausada" ? "En pausa" : "Terminada"}${m.inicio ? " · desde " + dayLabel(m.inicio).toLowerCase() : ""} · se cobra el día ${m.diaCobro || 1}</span></button>
        <div class="irow-side"><span class="amount">${money(m.monto)}<small>al mes + IVA</small></span></div>
      </div>`)}</div>` : html`<p class="empty">Sin mantenciones. Cuando un proyecto termina su garantía, la mantención técnica mantiene el sistema funcionando, seguro y respaldado.</p>`}</div></section>
  </div>`;
}

function CobroModal({ id, clienteId: cid0, proyectoId: pid0 }) {
  const { cobros, clientes, proyectos, api, closeModal, toast, canWrite, cfg } = useCtx();
  const stored = id ? cobros.find((x) => x.id === id) : null;
  const [f, setF] = useState(() => (stored ? { ...stored, monto: stored.monto ? String(stored.monto) : "" } : { clienteId: cid0 || "", proyectoId: pid0 || "", tipo: pid0 ? "hito" : "otro", concepto: "", monto: "", fecha: todayKey(), estado: "por_facturar", factura: "", fechaFactura: "", vence: "", fechaPago: "", notas: "" }));
  const [saving, setSaving] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  if (id && !stored) return html`<${Modal} title="Cobro" onClose=${closeModal}><div class="modal-body"><p class="empty">Este cobro ya no existe.</p></div></${Modal}>`;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const ps = proyectos.filter((p) => p.clienteId === f.clienteId);
  const monto = parseMonto(f.monto);
  const guardar = async () => {
    if (!f.clienteId) { toast("Elige el cliente.", "bad"); return; }
    if (!monto) { toast("Escribe el monto sin IVA.", "bad"); return; }
    setSaving(true);
    try {
      const data = { clienteId: f.clienteId, proyectoId: f.proyectoId || null, tipo: f.tipo, concepto: String(f.concepto || "").trim() || tipoCobroLabel(f.tipo), monto, fecha: isKey(f.fecha) ? f.fecha : "", estado: f.estado, factura: String(f.factura || "").trim(), fechaFactura: isKey(f.fechaFactura) ? f.fechaFactura : "", vence: isKey(f.vence) ? f.vence : "", fechaPago: isKey(f.fechaPago) ? f.fechaPago : "", notas: f.notas || "" };
      if ((data.estado === "facturado" || data.estado === "pagado") && !data.fechaFactura) data.fechaFactura = todayKey();
      if (data.estado === "pagado" && !data.fechaPago) data.fechaPago = todayKey();
      const antes = stored ? stored.estado : "";
      let cid = id;
      if (id) await api.updateCobro(id, data);
      else cid = await api.createCobro(data);
      if (antes !== data.estado && (data.estado === "facturado" || data.estado === "pagado")) await api.addAct({ clienteId: data.clienteId, proyectoId: data.proyectoId, cobroId: cid, tipo: "cobro", accion: data.estado, resumen: `${data.concepto}: ${money(data.monto)} + IVA${data.factura ? " · factura " + data.factura : ""}` });
      toast(id ? "Cobro guardado." : "Cobro agregado.");
      closeModal();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  /* Una mensualidad generada se anula en vez de borrarse: si se borra, la mantención la vuelve a generar. */
  const anular = !!(stored && stored.generado);
  const del = async () => {
    try {
      closeModal();
      if (anular) { await api.updateCobro(id, { estado: "anulado" }); toast("Mensualidad anulada. No se vuelve a generar este mes."); }
      else { await api.deleteCobro(id); toast("Cobro eliminado."); }
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const foot = html`
    ${id && canWrite ? (confirmDel ? html`<button class="btn danger" onClick=${del}>${anular ? "Sí, anular" : "Sí, eliminar"}</button><button class="btn ghost" onClick=${() => setConfirmDel(false)}>No</button>` : html`<button class="btn ghost danger" onClick=${() => setConfirmDel(true)} disabled=${anular && stored.estado === "anulado"}><${Icon} name="trash" />${anular ? "Anular" : "Eliminar"}</button>`) : null}
    <span style="flex:1"></span>
    <button class="btn ghost" onClick=${closeModal}>Cancelar</button>
    <button class="btn primary" onClick=${guardar} disabled=${saving || !canWrite}>${saving ? "Guardando…" : id ? "Guardar" : "Agregar cobro"}</button>`;
  return html`<${Modal} title=${id ? "Cobro" : "Nuevo cobro"} onClose=${closeModal} foot=${foot} labelId="cob-title">
    <div class="modal-body">
      <div class="grid-2">
        <label class="field" for="cb-cli"><span>Cliente</span><select id="cb-cli" class="select" value=${f.clienteId} onChange=${(e) => setF((x) => ({ ...x, clienteId: e.currentTarget.value, proyectoId: "" }))}><option value="">Elige un cliente</option>${clientes.map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select></label>
        <label class="field" for="cb-pro"><span>Proyecto</span><select id="cb-pro" class="select" value=${f.proyectoId || ""} onChange=${(e) => set("proyectoId", e.currentTarget.value)}><option value="">Sin proyecto</option>${ps.map((p) => html`<option value=${p.id}>${p.nombre || "Proyecto"}</option>`)}</select></label>
        <label class="field" for="cb-tipo"><span>Tipo</span><select id="cb-tipo" class="select" value=${f.tipo} onChange=${(e) => set("tipo", e.currentTarget.value)}>${TIPOS_COBRO.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label>
        <label class="field" for="cb-con"><span>Concepto</span><input id="cb-con" class="input" value=${f.concepto} onInput=${(e) => set("concepto", e.currentTarget.value)} placeholder=${tipoCobroLabel(f.tipo)} /></label>
        <label class="field" for="cb-monto"><span>Monto (CLP sin IVA)</span><input id="cb-monto" class="input mono" inputmode="numeric" value=${f.monto} onInput=${(e) => set("monto", e.currentTarget.value)} />${monto ? html`<small class="hint">${money(monto)} + IVA = ${money(conIva(monto))}</small>` : null}</label>
        <label class="field" for="cb-fecha"><span>Fecha de facturación</span><input id="cb-fecha" class="input" type="date" value=${f.fecha || ""} onInput=${(e) => set("fecha", e.currentTarget.value)} /><small class="hint">Cuándo corresponde facturarlo.</small></label>
        <label class="field" for="cb-est"><span>Estado</span><select id="cb-est" class="select" value=${f.estado} onChange=${(e) => set("estado", e.currentTarget.value)}>${ESTADOS_COBRO.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label>
        ${f.estado === "facturado" || f.estado === "pagado" ? html`<label class="field" for="cb-fac"><span>N° de factura</span><input id="cb-fac" class="input mono" value=${f.factura} onInput=${(e) => set("factura", e.currentTarget.value)} /></label>` : html`<span></span>`}
        ${f.estado === "facturado" || f.estado === "pagado" ? html`
          <label class="field" for="cb-ff"><span>Fecha de la factura</span><input id="cb-ff" class="input" type="date" value=${f.fechaFactura || ""} onInput=${(e) => set("fechaFactura", e.currentTarget.value)} /></label>
          <label class="field" for="cb-ven"><span>Vence</span><input id="cb-ven" class="input" type="date" value=${f.vence || ""} onInput=${(e) => set("vence", e.currentTarget.value)} /><small class="hint">Vacío: ${plazoPago(cfg)} días desde la factura.</small></label>` : null}
        ${f.estado === "pagado" ? html`<label class="field" for="cb-fp"><span>Fecha del pago</span><input id="cb-fp" class="input" type="date" value=${f.fechaPago || ""} onInput=${(e) => set("fechaPago", e.currentTarget.value)} /></label>` : null}
        <label class="field span-2" for="cb-notas"><span>Notas</span><input id="cb-notas" class="input" value=${f.notas || ""} onInput=${(e) => set("notas", e.currentTarget.value)} /></label>
      </div>
      ${stored && stored.generado ? html`<p class="small muted">Mensualidad generada desde la mantención. Si este mes no corresponde cobrarla, usa «Anular».</p>` : null}
    </div>
  </${Modal}>`;
}

function MantencionModal({ id, clienteId: cid0 }) {
  const { mantenciones, clientes, proyectos, api, closeModal, toast, canWrite } = useCtx();
  const stored = id ? mantenciones.find((m) => m.id === id) : null;
  const [f, setF] = useState(() => (stored ? { ...stored, monto: stored.monto ? String(stored.monto) : "" } : { clienteId: cid0 || "", proyectoId: "", plan: "Mantención técnica", monto: "", incluye: MANT_INCLUYE, inicio: todayKey(), diaCobro: 1, estado: "activa", fin: "", notas: "" }));
  const [saving, setSaving] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  if (id && !stored) return html`<${Modal} title="Mantención" onClose=${closeModal}><div class="modal-body"><p class="empty">Esta mantención ya no existe.</p></div></${Modal}>`;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const ps = proyectos.filter((p) => p.clienteId === f.clienteId);
  const monto = parseMonto(f.monto);
  const guardar = async () => {
    if (!f.clienteId) { toast("Elige el cliente.", "bad"); return; }
    if (!monto) { toast("Escribe el monto mensual sin IVA.", "bad"); return; }
    if (!isKey(f.inicio)) { toast("Elige desde cuándo corre.", "bad"); return; }
    setSaving(true);
    try {
      const data = { clienteId: f.clienteId, proyectoId: f.proyectoId || null, plan: String(f.plan || "").trim() || "Mantención técnica", monto, incluye: f.incluye || "", inicio: f.inicio, diaCobro: Math.min(28, Math.max(1, Number(f.diaCobro) || 1)), estado: f.estado, fin: f.estado === "terminada" ? (isKey(f.fin) ? f.fin : todayKey()) : "", notas: f.notas || "" };
      if (id) await api.updateMantencion(id, data);
      else {
        await api.createMantencion(data);
        await api.addAct({ clienteId: data.clienteId, proyectoId: data.proyectoId, tipo: "nota", resumen: `Mantención: ${data.plan}, ${money(data.monto)} + IVA al mes desde el ${data.inicio}.` });
      }
      toast(id ? "Mantención guardada." : "Mantención agregada. La mensualidad aparece en Cobros.");
      closeModal();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  const del = async () => { try { closeModal(); await api.deleteMantencion(id); toast("Mantención eliminada. Los cobros ya generados se conservan."); } catch (e) { toast(dbErrorText(e), "bad"); } };
  const foot = html`
    ${id && canWrite ? (confirmDel ? html`<button class="btn danger" onClick=${del}>Sí, eliminar</button><button class="btn ghost" onClick=${() => setConfirmDel(false)}>No</button>` : html`<button class="btn ghost danger" onClick=${() => setConfirmDel(true)}><${Icon} name="trash" />Eliminar</button>`) : null}
    <span style="flex:1"></span>
    <button class="btn ghost" onClick=${closeModal}>Cancelar</button>
    <button class="btn primary" onClick=${guardar} disabled=${saving || !canWrite}>${saving ? "Guardando…" : id ? "Guardar" : "Agregar mantención"}</button>`;
  return html`<${Modal} title=${id ? "Mantención" : "Nueva mantención"} onClose=${closeModal} foot=${foot} labelId="man-title">
    <div class="modal-body">
      <div class="grid-2">
        <label class="field" for="mt-cli"><span>Cliente</span><select id="mt-cli" class="select" value=${f.clienteId} onChange=${(e) => setF((x) => ({ ...x, clienteId: e.currentTarget.value, proyectoId: "" }))}><option value="">Elige un cliente</option>${clientes.map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select></label>
        <label class="field" for="mt-pro"><span>Proyecto</span><select id="mt-pro" class="select" value=${f.proyectoId || ""} onChange=${(e) => set("proyectoId", e.currentTarget.value)}><option value="">General</option>${ps.map((p) => html`<option value=${p.id}>${p.nombre || "Proyecto"}</option>`)}</select></label>
        <label class="field" for="mt-plan"><span>Plan</span><input id="mt-plan" class="input" value=${f.plan} onInput=${(e) => set("plan", e.currentTarget.value)} /></label>
        <label class="field" for="mt-monto"><span>Monto mensual (CLP sin IVA)</span><input id="mt-monto" class="input mono" inputmode="numeric" value=${f.monto} onInput=${(e) => set("monto", e.currentTarget.value)} />${monto ? html`<small class="hint">${money(monto)} + IVA = ${money(conIva(monto))} al mes</small>` : null}</label>
        <label class="field" for="mt-ini"><span>Desde</span><input id="mt-ini" class="input" type="date" value=${f.inicio || ""} onInput=${(e) => set("inicio", e.currentTarget.value)} /></label>
        <label class="field" for="mt-dia"><span>Día de cobro (1 a 28)</span><input id="mt-dia" class="input mono" inputmode="numeric" value=${String(f.diaCobro || "")} onInput=${(e) => set("diaCobro", e.currentTarget.value.replace(/\D/g, "").slice(0, 2))} /></label>

function WonModal({ lead }) {
  const { api, clientes, proyectos, closeModal, toast, cfg, me, yo, openCliente, canWrite, cerrarTareasDe } = useCtx();
  const t = todayKey();
  const [modo, setModo] = useState(lead.clienteId ? "existente" : "nuevo");
  const [existente, setExistente] = useState(lead.clienteId || (clientes[0] || {}).id || "");
  const [nombre, setNombre] = useState(lead.empresa || lead.nombre || "");
  const [razon, setRazon] = useState("");
  const [rut, setRut] = useState("");
  const [sumarContacto, setSumarContacto] = useState(true);
  const [conProyecto, setConProyecto] = useState(true);
  const [pNombre, setPNombre] = useState(lead.necesidad ? clip(lead.necesidad, 70) : `Proyecto ${lead.empresa || lead.nombre || ""}`.trim());
  const [tipo, setTipo] = useState("software");
  const [valor, setValor] = useState(lead.valor ? String(lead.valor) : "");
  const [inicio, setInicio] = useState(t);
  const [entrega, setEntrega] = useState("");
  const [plan, setPlan] = useState("30-40-30");
  const [conMant, setConMant] = useState(false);
  const [mMonto, setMMonto] = useState("");
  const [saving, setSaving] = useState(false);
  const v = parseMonto(valor) || 0;
  const fechas = { anticipo: inicio || t, cierre: entrega || "" };
  const contacto = lead.nombre || lead.telefono || lead.correo ? { id: newId("ct"), nombre: lead.nombre || "", cargo: lead.cargo || "", correo: lead.correo || "", telefono: lead.telefono || "", rol: "decisor", principal: true } : null;

  const guardar = async (convertir) => {
    setSaving(true);
    try {
      let cid = null;
      if (convertir) {
        if (modo === "existente") {
          cid = existente;
          const c = clientes.find((x) => x.id === cid);
          if (!c) { toast("Elige el cliente.", "bad"); setSaving(false); return; }
          const patch = { leadIds: [...new Set([...(c.leadIds || []), lead.id])] };
          if (sumarContacto && contacto && !(c.contactos || []).some((x) => (contacto.correo && x.correo === contacto.correo) || (contacto.telefono && x.telefono === contacto.telefono))) patch.contactos = [...(c.contactos || []), { ...contacto, principal: !(c.contactos || []).length }];
          await api.updateCliente(cid, patch);
        } else {
          if (!nombre.trim()) { toast("Escribe el nombre del cliente.", "bad"); setSaving(false); return; }
          cid = await api.createCliente({ nombre: nombre.trim(), razonSocial: razon.trim(), rut: rut.trim(), rubro: lead.rubro || "", ciudad: lead.ciudad || "", sitio: lead.sitio || "", contactos: contacto ? [contacto] : [], responsable: lead.responsable || yo || null, trato: lead.trato || "tu", leadIds: [lead.id], estado: "activo", notas: "" });
        }
        if (conProyecto) {
          const pid = await api.createProyecto({ clienteId: cid, leadId: lead.id, nombre: pNombre.trim() || "Proyecto", tipo, valor: v || null, estado: "por_iniciar", inicio: inicio || "", entregaEstimada: entrega || "", produccion: "", garantiaDias: Number(cfg.garantiaDias) || 60, hitos: [], enlaces: [], caso: lead.caso || "", alcance: lead.necesidad || "", responsable: lead.responsable || yo || null });
          if (v) await crearPlanPago(api, { clienteId: cid, proyectoId: pid }, plan, v, fechas);
          await api.addAct({ clienteId: cid, proyectoId: pid, tipo: "proyecto", a: "por_iniciar", resumen: `${pNombre.trim() || "Proyecto"}${v ? ": " + money(v) + " + IVA" : ""}` });
          if (modo === "existente") await etapaAutomatica(api, clientes.find((x) => x.id === cid), proyectos);
        }
        const mm = parseMonto(mMonto);
        if (conMant && mm) await api.createMantencion({ clienteId: cid, proyectoId: null, plan: "Mantención técnica", monto: mm, incluye: MANT_INCLUYE, inicio: entrega || inicio || t, diaCobro: 1, estado: "activa", fin: "", notas: "" });
        await api.addAct({ clienteId: cid, tipo: "cliente", resumen: `Cliente desde el lead ${leadName(lead)}.` });
      }
      await cerrarTareasDe(lead.id);
      await api.updateLead(lead.id, { etapa: "ganado", proxima: null, ...(cid ? { clienteId: cid } : {}) });
      await api.addAct({ leadId: lead.id, tipo: "etapa", de: etapaDe(lead), a: "ganado" });
      toast(cid ? "¡Ganado! Quedó como cliente con su proyecto." : `${leadName(lead)}: Ganado.`);
      closeModal();
      if (cid) openCliente(cid);
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };

  const foot = html`<button class="btn ghost" onClick=${closeModal}>Cancelar</button><span style="flex:1"></span>
    <button class="btn" onClick=${() => guardar(false)} disabled=${saving || !canWrite}>Solo marcar como ganado</button>
    <button class="btn primary" onClick=${() => guardar(true)} disabled=${saving || !canWrite}>${saving ? "Guardando…" : "Crear cliente y proyecto"}</button>`;

  return html`<${Modal} title=${"Ganado: " + leadName(lead)} onClose=${closeModal} wide foot=${foot} labelId="won-title">
    <div class="modal-body">
      <p class="small muted">El lead pasa a ser cliente, con su proyecto y el calendario de cobros. Después se completa todo desde la ficha del cliente.</p>
      <section class="box"><h4>Cliente</h4>
        ${clientes.length ? html`<${Seg} label="Cliente" value=${modo} onChange=${setModo} options=${[["nuevo", "Cliente nuevo"], ["existente", "Cliente existente"]]} />` : null}
        ${modo === "nuevo" ? html`<div class="grid-3">
          <label class="field" for="w-nom"><span>Nombre comercial</span><input id="w-nom" class="input" value=${nombre} onInput=${(e) => setNombre(e.currentTarget.value)} /></label>
          <label class="field" for="w-rs"><span>Razón social (opcional)</span><input id="w-rs" class="input" value=${razon} onInput=${(e) => setRazon(e.currentTarget.value)} /></label>
          <label class="field" for="w-rut"><span>RUT (opcional)</span><input id="w-rut" class="input mono" value=${rut} onInput=${(e) => setRut(e.currentTarget.value)} placeholder="76.123.456-7" /></label>
        </div>${contacto ? html`<p class="small muted">Contacto principal: ${[contacto.nombre, contacto.cargo].filter(Boolean).join(", ") || "sin nombre"}.</p>` : null}` : html`
          <label class="field" for="w-cli"><span>Cliente</span><select id="w-cli" class="select" value=${existente} onChange=${(e) => setExistente(e.currentTarget.value)}>${clientes.map((c) => html`<option value=${c.id}>${clienteName(c)}</option>`)}</select></label>
          ${contacto ? html`<label class="check"><input type="checkbox" checked=${sumarContacto} onChange=${(e) => setSumarContacto(e.currentTarget.checked)} />Agregar a ${contacto.nombre || "esta persona"} como contacto del cliente</label>` : null}`}
      </section>
      <section class="box"><label class="check"><input type="checkbox" checked=${conProyecto} onChange=${(e) => setConProyecto(e.currentTarget.checked)} /><b>Crear el proyecto</b></label>
        ${conProyecto ? html`
          <div class="grid-2">
            <label class="field" for="w-pn"><span>Nombre del proyecto</span><input id="w-pn" class="input" value=${pNombre} onInput=${(e) => setPNombre(e.currentTarget.value)} /></label>
            <label class="field" for="w-pt"><span>Tipo</span><select id="w-pt" class="select" value=${tipo} onChange=${(e) => setTipo(e.currentTarget.value)}>${TIPOS_PROYECTO.map(([x, l]) => html`<option value=${x}>${l}</option>`)}</select></label>
            <label class="field" for="w-val"><span>Valor (CLP sin IVA)</span><input id="w-val" class="input mono" inputmode="numeric" value=${valor} onInput=${(e) => setValor(e.currentTarget.value)} />${v ? html`<small class="hint">${money(v)} + IVA</small>` : null}</label>
            <div class="grid-2">
              <label class="field" for="w-ini"><span>Inicio</span><input id="w-ini" class="input" type="date" value=${inicio} onInput=${(e) => setInicio(e.currentTarget.value)} /></label>
              <label class="field" for="w-ent"><span>Entrega estimada</span><input id="w-ent" class="input" type="date" value=${entrega} onInput=${(e) => setEntrega(e.currentTarget.value)} /></label>
            </div>
          </div>
          <div class="field"><span>Calendario de pagos</span><${Chips} label="Calendario de pagos" value=${plan} onChange=${setPlan} options=${PLANES_PAGO.map((x) => [x[0], x[1]])} /><small class="hint">Pagos por hitos. El anticipo se factura al inicio y el pago final en la entrega estimada; los porcentajes se ajustan después en cada cobro.</small></div>
          <${PlanPreview} planId=${plan} valor=${v} fechas=${fechas} />` : null}
      </section>
      <section class="box"><label class="check"><input type="checkbox" checked=${conMant} onChange=${(e) => setConMant(e.currentTarget.checked)} /><b>Tiene mantención mensual</b></label>
        ${conMant ? html`<div class="grid-2"><label class="field" for="w-mm"><span>Monto mensual (CLP sin IVA)</span><input id="w-mm" class="input mono" inputmode="numeric" value=${mMonto} onInput=${(e) => setMMonto(e.currentTarget.value)} /></label><p class="small muted" style="align-self:end">Corre desde la entrega estimada (o el inicio). Las mensualidades aparecen solas en Cobros.</p></div>` : html`<p class="small muted">La garantía no es mantención: se puede agregar la mantención más adelante.</p>`}
      </section>
    </div>
  </${Modal}>`;
}

function ComposeClienteModal({ clienteId, preset }) {
  const { clientesById, db, closeModal } = useCtx();
  const c = clientesById[clienteId];
  const [hist, setHist] = useState([]);
  useEffect(() => {
    if (!db || !clienteId) return undefined;
    let alive = true;
    db.collection("actividades").where("clienteId", "==", clienteId).get().then((s) => { if (alive) setHist(s.docs.map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))); }, () => {});
    return () => { alive = false; };
  }, [db, clienteId]);
  if (!c) return html`<${Modal} title="Redactar" onClose=${closeModal}><div class="modal-body"><p class="empty">Este cliente ya no existe.</p></div></${Modal}>`;
  return html`<${Modal} title=${"Redactar para " + clienteName(c)} onClose=${closeModal} labelId="cc-title">
    <div class="modal-body" style="padding:0"><${ClientComposer} cliente=${c} hist=${hist} preset=${preset} /></div>
  </${Modal}>`;
}

  const tel = normPhone(l.telefono || "");

/* CSV con comillas, separado por coma, punto y coma o tabulación (Excel en Chile usa «;»). */
function parseCsv(text) {
  const src = String(text || "").replace(/^\uFEFF/, "");
  const first = src.split(/\r?\n/)[0] || "";
  const delim = [";", ",", "\t"].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && src[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim()));
}
const HEADERS = {
  nombre: ["nombre", "name", "contacto", "nombre contacto", "persona", "full name"],
  empresa: ["empresa", "company", "compania", "organizacion", "razon social", "cliente"],
  cargo: ["cargo", "puesto", "title", "rol", "job title"],
  telefono: ["telefono", "celular", "fono", "phone", "movil", "whatsapp", "tel", "numero"],
  correo: ["correo", "email", "e-mail", "mail", "correo electronico"],
  rubro: ["rubro", "industria", "sector", "industry"],
  ciudad: ["ciudad", "comuna", "region", "city"],
  origen: ["origen", "fuente", "source", "canal"],
  necesidad: ["necesidad", "interes", "requerimiento", "mensaje", "problema"],
  notas: ["notas", "nota", "comentarios", "observaciones", "comentario"],
};
function mapCsv(rows) {
  if (!rows.length) return [];
  const head = rows[0].map((x) => fold(x).trim());
  const idx = {};
  for (const [k, names] of Object.entries(HEADERS)) { const i = head.findIndex((hh) => names.includes(hh)); if (i >= 0) idx[k] = i; }
  if (!Object.keys(idx).length) return [];
  return rows.slice(1).map((r) => Object.fromEntries(Object.entries(idx).map(([k, i]) => [k, String(r[i] || "").trim()]))).filter((l) => l.nombre || l.empresa || l.telefono || l.correo);
}

      }
      if (modo === "noshow") {
        await marcarTarea(tarea, "descartada", { resultado: "no_se_presento" });
