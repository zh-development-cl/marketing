/* Arrastrar tarjetas entre columnas con mouse, dedo o lápiz (Pointer Events). Con el mouse parte
   al mover unos píxeles; en pantallas táctiles, al mantener apretada la tarjeta un momento, para no
   pelear con el scroll. Las columnas llevan data-col; cerca de los bordes el tablero avanza solo. */
let finArrastre = 0;
const recienArrastrado = () => Date.now() - finArrastre < 60;
function useBoardDrag({ enabled, onDrop }) {
  const [drag, setDrag] = useState(null);
  const st = useRef(null);
  const boardRef = useRef(null);
  const soltar = useRef(onDrop);
  soltar.current = onDrop;
  const fin = (commit) => {
    const s = st.current;
    st.current = null;
    if (!s) return;
    clearTimeout(s.timer);
    cancelAnimationFrame(s.raf);
    window.removeEventListener("pointermove", s.move);
    window.removeEventListener("pointerup", s.up);
    window.removeEventListener("pointercancel", s.cancel);
    window.removeEventListener("keydown", s.key);
    document.removeEventListener("touchmove", s.block);
    document.removeEventListener("contextmenu", s.noMenu);
    if (s.ghost) s.ghost.remove();
    if (s.card) s.card.classList.remove("dragging");
    document.body.classList.remove("arrastrando");
    if (!s.active) return;
    finArrastre = Date.now();
    /* El clic que el navegador manda justo después de soltar no debe abrir la tarjeta. */
    const tragar = (e) => { e.stopPropagation(); e.preventDefault(); };
    window.addEventListener("click", tragar, true);
    setTimeout(() => window.removeEventListener("click", tragar, true), 0);
    setDrag(null);
    if (commit && s.over && s.over !== s.from) soltar.current(s.id, s.over);
  };
  useEffect(() => () => fin(false), []);
  const start = (ev, id, from) => {
    if (!enabled || st.current || ev.button > 0 || ev.isPrimary === false) return;
    if (ev.target.closest("a, input, select, textarea, .kact, .tagbtn, .tick")) return;
    const card = ev.currentTarget;
    const touch = ev.pointerType !== "mouse";
    const s = { id, from, over: from, card, touch, pid: ev.pointerId, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY, active: false };
    st.current = s;
    const mover = () => {
      s.ghost.style.transform = `translate(${s.x - s.dx}px, ${s.y - s.dy}px) rotate(2deg)`;
      const el = document.elementFromPoint(s.x, s.y);
      const col = el && el.closest("[data-col]");
      const over = col ? col.getAttribute("data-col") : null;
      if (over !== s.over) { s.over = over; setDrag((d) => (d ? { ...d, over } : d)); }
    };
    const tick = () => {
      if (st.current !== s) return;
      const b = boardRef.current;
      if (b) {
        const r = b.getBoundingClientRect();
        if (s.x < r.left + 56) b.scrollLeft -= 16;
        else if (s.x > r.right - 56) b.scrollLeft += 16;
      }
      if (s.y < 48) window.scrollBy(0, -14);
      else if (s.y > window.innerHeight - 48) window.scrollBy(0, 14);
      s.raf = requestAnimationFrame(tick);
    };
    const activar = () => {
      if (st.current !== s || s.active) return;
      s.active = true;
      const r = card.getBoundingClientRect();
      s.dx = s.x0 - r.left;
      s.dy = s.y0 - r.top;
      const g = card.cloneNode(true);
      g.classList.add("kghost");
      g.removeAttribute("data-col");
      g.style.width = r.width + "px";
      document.body.appendChild(g);
      s.ghost = g;
      card.classList.add("dragging");
      document.body.classList.add("arrastrando");
      if (touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* sin vibración */ } }
      setDrag({ id, from, over: from });
      mover();
      tick();
    };
    s.move = (e) => {
      if (st.current !== s || e.pointerId !== s.pid) return;
      s.x = e.clientX;
      s.y = e.clientY;
      if (!s.active) {
        const d = Math.hypot(s.x - s.x0, s.y - s.y0);
        if (touch) { if (d > 10) fin(false); return; }
        if (d < 6) return;
        activar();
        return;
      }
      if (e.cancelable) e.preventDefault();
      mover();
    };
    s.up = (e) => { if (e.pointerId === s.pid) fin(true); };
    s.cancel = (e) => { if (e.pointerId === s.pid) fin(false); };
    s.key = (e) => { if (e.key === "Escape") fin(false); };
    s.block = (e) => { if (s.active && e.cancelable) e.preventDefault(); };
    s.noMenu = (e) => { if (s.active || s.touch) e.preventDefault(); };
    window.addEventListener("pointermove", s.move, { passive: false });
    window.addEventListener("pointerup", s.up);
    window.addEventListener("pointercancel", s.cancel);
    window.addEventListener("keydown", s.key);
    document.addEventListener("touchmove", s.block, { passive: false });
    document.addEventListener("contextmenu", s.noMenu);
    if (touch) s.timer = setTimeout(activar, 320);
  };
  return { drag, start, boardRef };
}

/* Tarjetas de una columna: se ven las que caben en la pantalla y el resto se desliza dentro de la
   columna. Abajo, «N más ↓» dice cuántas quedan y baja la lista. */
function ColLista({ n, children }) {
  const ref = useRef(null);
  const [ocultas, setOcultas] = useState(0);
  const medir = () => {
    const el = ref.current;
    if (!el) return;
    const fondo = el.scrollTop + el.clientHeight;
    let k = 0;
    for (const c of el.children) if (c.offsetTop + c.offsetHeight / 2 > fondo + 1) k += 1;
    setOcultas(k);
  };
  useEffect(() => {
    medir();
    const el = ref.current;
    if (!el || typeof ResizeObserver === "undefined") return undefined;
    const ro = new ResizeObserver(medir);
    ro.observe(el);
    return () => ro.disconnect();
  }, [n]);
  const bajar = () => { const el = ref.current; if (el) el.scrollBy({ top: Math.round(el.clientHeight * 0.8), behavior: "smooth" }); };
  return html`<div class=${cx("col-lista", ocultas && "mas")} ref=${ref} onScroll=${medir}>${children}</div>
    ${ocultas ? html`<button type="button" class="col-mas" onClick=${bajar}>${ocultas} más ↓</button>` : null}`;
}

const iniciales = (n) => String(n || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

/* Responsable en una tarjeta: su inicial. Al tocarla se elige otro (un select invisible encima). */
function RespAvatar({ valor, quien, guardar }) {
  const { canWrite, nameOf, toast } = useCtx();
  const v = valor || "";
  const nombre = v ? nameOf(v) : "";
  const cambiar = async (nv) => {
    if (nv === v) return;
    try {
      await guardar(nv || null);
      toast(nv ? `${quien}: lo lleva ${nameOf(nv)}.` : `${quien}: sin responsable.`);
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const stop = (e) => e.stopPropagation();
  return html`<span class=${cx("avatar", !v && "vacio", respTono(v), canWrite && "pick")} title=${nombre ? "Lo lleva " + nombre : "Sin responsable"} onPointerDown=${stop} onClick=${stop}>
    ${v ? iniciales(nombre) || "·" : "·"}
    ${canWrite ? html`<select aria-label=${"Responsable de " + quien} value=${v} onChange=${(e) => cambiar(e.currentTarget.value)}>
      <option value="">Sin responsable</option>${RESPONSABLES.map(([id, n]) => html`<option value=${id}>${n}</option>`)}${v && !respNombre(v) ? html`<option value=${v}>${nombre}</option>` : null}
    </select>` : null}
  </span>`;
}

/* En «Ganado»: a qué cliente pasó y en qué etapa va, o el botón para convertirlo. */
function GanadoTag({ l }) {
  const { clientesById, proyectos, cobros, mantenciones, solicitudes, cfg, openCliente, openModal, canWrite } = useCtx();
  const c = l.clienteId ? clientesById[l.clienteId] : null;
  if (!c) return canWrite ? html`<button type="button" class="tag warn tagbtn" onClick=${(e) => { e.stopPropagation(); openModal({ type: "won", lead: l }); }}>Convertir en cliente</button>` : null;
  const r = resumenCliente(c.id, { proyectos, cobros, mantenciones, solicitudes, clientesById }, cfg);
  return html`<button type="button" class="tag ok tagbtn" title=${"Abrir el cliente " + clienteName(c)} onClick=${(e) => { e.stopPropagation(); openCliente(c.id); }}>Cliente · ${etapaClienteLabel(etapaDeCliente(c, r))}</button>`;
}

function LeadCard({ l, ultima, onPointerDown }) {
  const { api, openLead, openModal, canWrite, cfg, siguienteDe } = useCtx();
  const etapa = etapaDe(l);
  const abierto = ETAPA[etapa].open;
  const sig = siguienteDe(l);
  const wa = l.telefono && !l.noContactar ? waLink(l.telefono, "", cfg) : null;
  const abrir = () => { if (!recienArrastrado()) openLead(l.id); };
  const accion = (tab) => (e) => { e.stopPropagation(); openLead(l.id, tab); };
  const ventana = (m) => (e) => { e.stopPropagation(); openModal(m); };
  const persona = leadPersona(l);
  return html`<div class="kcard lead" role="button" tabindex="0" aria-label=${"Abrir " + leadTitulo(l)} onPointerDown=${onPointerDown} onClick=${abrir} onKeyDown=${(e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openLead(l.id); } }}>
    <div class="kcard-top"><b class="kcard-titulo">${leadTitulo(l)}</b>${l.prioridad === "alta" ? html`<i class="prio" title="Prioridad alta"></i>` : null}</div>
    ${persona ? html`<span class="kcard-sub">${persona}</span>` : null}
    ${Number(l.valor) > 0 ? html`<span class="kcard-valor">${money(l.valor)} + IVA</span>` : null}
    ${l.noContactar ? html`<div class="kcard-tags"><span class="tag late">No contactar</span></div>`
      : sig && (abierto || etapa === "pausa") ? html`<${SigLinea} t=${sig} />`
      : abierto ? html`<div class="knext vacio">Sin tarea${canWrite ? html` · <button type="button" class="linkbtn tagbtn" onClick=${accion("tareas")}>agregar</button>` : null}</div>`
      : etapa === "perdido" ? html`<div class="kcard-tags">${l.motivoPerdida ? html`<span class="tag late">${l.motivoPerdida}</span>` : canWrite ? html`<button type="button" class="tag warn tagbtn" onClick=${ventana({ type: "lost", lead: l })}>Falta el motivo</button>` : html`<span class="tag warn">Sin motivo</span>`}</div>`
      : etapa === "ganado" ? html`<div class="kcard-tags"><${GanadoTag} l=${l} /></div>` : null}
    ${(l.intentos || l.inasistencias) && abierto && !l.noContactar ? html`<div class="kcard-tags">${l.intentos ? html`<span class="tag warn" title="Llamadas seguidas sin respuesta">${l.intentos} sin respuesta</span>` : null}${l.inasistencias ? html`<span class="tag warn" title="Veces que no se presentó a una reunión">No se presentó${l.inasistencias > 1 ? " ×" + l.inasistencias : ""}</span>` : null}</div>` : null}
    ${ultima ? html`<span class="kcard-act"><${Icon} name=${ACT_ICON[ultima.tipo] || "note"} size=${12} /><span>${actTitulo(ultima)} · ${ago(ultima.fecha)}</span></span>` : null}
    <div class="kcard-foot">
      <${RespAvatar} valor=${l.responsable} quien=${leadTitulo(l)} guardar=${(nv) => api.updateLead(l.id, { responsable: nv })} />
      ${l.noContactar ? null : html`<span class="kacts">
        ${l.telefono && abierto && canWrite ? html`<button type="button" class="kact" title="No contestó" aria-label=${"No contestó " + leadName(l)} onClick=${ventana({ type: "noContesto", lead: l })}><${Icon} name="phonex" size=${15} /></button>` : null}
        ${l.telefono ? html`<button type="button" class="kact" title="Registrar llamada" aria-label=${"Registrar llamada con " + leadName(l)} onClick=${accion("llamada")}><${Icon} name="phone" size=${15} /></button>` : null}
        ${wa ? html`<a class="kact" href=${wa} target="_blank" rel="noopener" title="Abrir WhatsApp" aria-label=${"WhatsApp a " + leadName(l)} onClick=${(e) => e.stopPropagation()}><${Icon} name="chat" size=${15} /></a>` : null}
        <button type="button" class="kact opt" title="Redactar con Claude" aria-label=${"Redactar para " + leadName(l)} onClick=${accion("redactar")}><${Icon} name="spark" size=${15} /></button>
      </span>`}
    </div>
  </div>`;
}

/* Cuántos perdidos hay por cada motivo, para la columna «Perdido». */
const motivosResumen = (items) => {
  const c = {};
  items.forEach((l) => { const m = l.motivoPerdida || "Sin motivo"; c[m] = (c[m] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([m, n]) => `${n} ${m.toLowerCase()}`).join(" · ");
};

function EmbudoView() {
  const { leads, acts, openModal, changeStage, canWrite, nameOf, team, nav, siguienteDe } = useCtx();
  const [verCerrados, setVerCerrados] = useState(() => ls.get("verCerrados", false));
  const [q, setQ] = useState(() => ls.get("qEmb", ""));
  const [resp, setResp] = useState(() => { const v = ls.get("respEmb", ""); return v === "mios" ? "" : v; });
  const [orden, setOrden] = useState(() => ls.get("ordenEmb", "proxima"));
  useEffect(() => { ls.set("verCerrados", verCerrados); ls.set("qEmb", q); ls.set("respEmb", resp); ls.set("ordenEmb", orden); }, [verCerrados, q, resp, orden]);
  const { drag, start, boardRef } = useBoardDrag({
    enabled: canWrite,
    onDrop: (id, etapa) => { const l = leads.find((x) => x.id === id); if (l && etapaDe(l) !== etapa) changeStage(l, etapa); },
  });
  const ultima = useMemo(() => {
    const m = {};
    for (const a of acts) { if (a.leadId && a.tipo !== "etapa" && (!m[a.leadId] || String(a.fecha) > String(m[a.leadId].fecha))) m[a.leadId] = a; }
    return m;
  }, [acts]);
  const qq = fold(q).trim();
  const visibles = leads.filter((l) => {
    if (resp === "sin" && l.responsable) return false;
    if (resp && resp !== "sin" && l.responsable !== resp) return false;
    return !qq || fold([l.nombre, l.empresa, l.cargo, l.correo, l.telefono, l.necesidad, l.dolor].join(" ")).includes(qq);
  });
  const fechaAct = (l) => String((ultima[l.id] || {}).fecha || l.ultimoContacto || l.actualizado || "");
  const cmp = {
    proxima: (a, b) => { const x = siguienteDe(a); const y = siguienteDe(b); return (x ? tareaClave(x) : "9999").localeCompare(y ? tareaClave(y) : "9999") || fechaAct(b).localeCompare(fechaAct(a)); },
    actividad: (a, b) => fechaAct(b).localeCompare(fechaAct(a)),
    valor: (a, b) => (Number(b.valor) || 0) - (Number(a.valor) || 0) || fechaAct(b).localeCompare(fechaAct(a)),
    creado: (a, b) => String(b.creado || "").localeCompare(String(a.creado || "")),
  }[orden] || (() => 0);
  const abiertos = visibles.filter(isOpen);
  const enJuego = sum(abiertos, (l) => l.valor);
  const ponderado = Math.round(sum(abiertos, (l) => (Number(l.valor) || 0) * PROB_ETAPA[etapaDe(l)]));
  /* «Ganado» va siempre al final; Perdido y En pausa, solo si se piden (o como zonas al arrastrar). */
  const cols = ETAPAS.filter((e) => e.open || e.id === "ganado" || verCerrados);
  return html`<div class="main-inner ancho">
    <header class="page-head">
      <div><p class="eyebrow">${abiertos.length} ${abiertos.length === 1 ? "abierto" : "abiertos"}${enJuego ? ` · ${money(enJuego)} en juego · ${money(ponderado)} ponderado` : ""}</p><h1>Embudo de leads</h1>
        <p class="lede">${canWrite ? (pantallaTactil() ? "Mantén apretada una tarjeta y arrástrala a otra etapa." : "Arrastra las tarjetas de una etapa a otra.") + " En «Reunión agendada» se elige el día; en «Ganado» se crea el cliente. El círculo de cada tarjeta completa su próxima tarea." : "Solo lectura."}</p></div>
      <div class="actions">
        <${VistaLeads} actual="embudo" />
        <button class="btn primary" onClick=${() => openModal({ type: "newLead" })} disabled=${!canWrite}><${Icon} name="plus" />Nuevo lead</button>
      </div>
    </header>
    <div class="toolbar">
      <label class="search"><span class="sr">Buscar en el embudo</span><${Icon} name="search" /><input id="buscar-emb" class="input" type="search" placeholder="Buscar por nombre, empresa, correo o teléfono" value=${q} onInput=${(e) => setQ(e.currentTarget.value)} /></label>
      <select id="emb-resp" class="select" aria-label="Responsable" value=${resp} onChange=${(e) => setResp(e.currentTarget.value)}>
        <option value="">Todos los responsables</option>${team.map((u) => html`<option value=${u}>${nameOf(u)}</option>`)}<option value="sin">Sin responsable</option>
      </select>
      <select id="emb-orden" class="select" aria-label="Ordenar" value=${orden} onChange=${(e) => setOrden(e.currentTarget.value)}>${ORDEN_EMBUDO.map(([v, t]) => html`<option value=${v}>${t}</option>`)}</select>
      <label class="check"><input type="checkbox" id="ver-cerrados" checked=${verCerrados} onChange=${(e) => setVerCerrados(e.currentTarget.checked)} />Perdidos y en pausa</label>
    </div>
    <div class="board embudo" ref=${boardRef}>
      ${cols.map((e) => {
        const items = visibles.filter((l) => etapaDe(l) === e.id).sort(cmp);
        const total = sum(items, (l) => l.valor);
        return html`<div key=${e.id} data-col=${e.id} class=${cx("col", drag && drag.over === e.id && drag.from !== e.id && "drop")}>
          <div class="col-head"><span class="col-title" style=${"--dot: var(--st-" + e.id + ")"}><i></i>${e.label}</span><span class="count">${items.length}</span></div>
          ${total ? html`<p class="col-sum" title=${e.open ? `Ponderado con ${Math.round(PROB_ETAPA[e.id] * 100)} % de probabilidad de cierre` : ""}><b>${money(total)}</b>${e.open ? ` · ${money(Math.round(total * PROB_ETAPA[e.id]))} ponderado` : ""}</p>` : null}
          ${e.id === "perdido" && items.length ? html`<p class="col-sum motivos">${motivosResumen(items)}</p>` : null}
          ${e.id === "ganado" ? html`<p class="col-sum"><button type="button" class="linkbtn" onClick=${() => nav("embudoClientes")}>Ver el embudo de clientes →</button></p>` : null}
          <${ColLista} n=${items.length}>
            ${items.map((l) => html`<${LeadCard} key=${l.id} l=${l} ultima=${ultima[l.id]} onPointerDown=${(ev) => start(ev, l.id, e.id)} />`)}
            ${!items.length ? html`<p class="col-empty">${drag ? "Suelta aquí" : "Sin leads"}</p>` : null}
          </${ColLista}>
        </div>`;
      })}
    </div>
    ${drag && !verCerrados ? html`<div class="dropbar">${CERRADAS.filter((id) => id !== "ganado").map((id) => html`<div key=${id} data-col=${id} class=${cx("dropzone", id, drag.over === id && "on")}><${StagePill} etapa=${id} /><span>${SOLTAR_EN[id]}</span></div>`)}</div>` : null}
  </div>`;
}

/* ===================================================================== borradores */

/* A quién va un borrador: un lead o el contacto de un cliente. */
function draftDestino(d, leadsById, clientesById) {
  const lead = d && d.leadId ? leadsById[d.leadId] : null;
  const cliente = d && !lead && d.clienteId ? clientesById[d.clienteId] : null;
  const contacto = cliente ? ((cliente.contactos || []).find((x) => x.id === d.contactoId) || contactoPrincipal(cliente)) : null;
  const nombre = lead ? leadName(lead) : cliente ? clienteName(cliente) + (contacto && contacto.nombre ? " · " + contacto.nombre : "") : d && d.clienteId ? "Cliente eliminado" : "Lead eliminado";
  return { lead, cliente, contacto, nombre, correo: lead ? lead.correo : contacto && contacto.correo, telefono: lead ? lead.telefono : contacto && contacto.telefono };
}

function DraftList({ items }) {
  const { leadsById, clientesById, openDraft, nameOf } = useCtx();
  return html`<div class="dlist">${items.map((d) => {
    const dest = draftDestino(d, leadsById, clientesById);
    const t = d.canal === "whatsapp" ? clip(d.texto || "(vacío)", 90) : d.asunto || "(sin asunto)";
    const st = d.estado === "enviado" ? html`<span class="tag ok">Enviado ${ago(d.enviado)}</span>` : d.estado === "descartado" ? html`<span class="tag">Descartado</span>` : d.estado === "listo" ? html`<span class="tag today">Listo</span>` : html`<span class="tag warn">Por revisar</span>`;
    return html`<button key=${d.id} class="ditem" onClick=${() => openDraft(d.id)}>
      <span class="ditem-ico"><${Icon} name=${d.canal === "whatsapp" ? "chat" : "mail"} /></span>
      <span class="ditem-main"><b>${dest.nombre} · ${d.canal === "whatsapp" ? "WhatsApp" : "Correo"}</b><span>${t}</span><span>${d.generadoPor === "claude" || d.autor === "claude" ? "Redactado con Claude" : "Escrito a mano"} · ${nameOf(d.autor)} · ${ago(d.creado)}</span></span>
      ${st}
    </button>`;
  })}</div>`;
}

function BorradoresView() {
  const { drafts } = useCtx();
  const [f, setF] = useState(() => ls.get("fBorr", "pendientes"));
  useEffect(() => ls.set("fBorr", f), [f]);
  const items = drafts.filter((d) => (f === "pendientes" ? d.estado === "por_revisar" || d.estado === "listo" : f === "enviados" ? d.estado === "enviado" : true));
  const n = drafts.filter((d) => d.estado === "por_revisar" || d.estado === "listo").length;
  return html`<div class="main-inner">
    <header class="page-head">
      <div><p class="eyebrow">Correos y WhatsApp antes de enviarlos</p><h1>Borradores</h1>
        <p class="lede">Claude redacta, tú revisas. Desde aquí copias el correo con el diseño de ZH o abres el chat de WhatsApp con el texto listo.</p></div>
      <${Seg} label="Filtro" value=${f} onChange=${setF} options=${[["pendientes", `Pendientes (${n})`], ["enviados", "Enviados"], ["todos", "Todos"]]} />
    </header>
    <section class="panel"><div class="panel-body" style="padding-top:8px">
      ${items.length ? html`<${DraftList} items=${items} />` : html`<p class="empty">${f === "pendientes" ? "No hay borradores pendientes. Abre un lead y usa «Redactar con Claude»." : "No hay borradores en esta lista."}</p>`}
    </div></section>
  </div>`;
}

function EmailPreview({ draft, firma, cfg }) {
  const inner = useMemo(() => renderEmail(draft, { firma, cfg, preview: true }), [draft, firma, cfg]);
  return html`<div class="email-frame">
    <div class="subject"><b>${draft.asunto || "(sin asunto)"}</b><span>${draft.preheader || "Sin texto de vista previa"}</span></div>
    <div class="email-canvas" dangerouslySetInnerHTML=${{ __html: inner }}></div>
  </div>`;
}

function DraftEditor({ id }) {
  const { drafts, leadsById, clientesById, proyectosById, cobros, solicitudes, mantenciones, api, equipo, me, yo, cfg, toast, sampleState, setSampleState, closeModal, db, openLead, openCliente, canWrite, tareasPorLead } = useCtx();
  const stored = drafts.find((d) => d.id === id);
  const [d, setD] = useState(() => (stored ? { ...stored } : null));
  const dirty = useRef(false);
  const [busy, setBusy] = useState(false);
  const [pedido, setPedido] = useState("");
  const [sending, setSending] = useState(false);
  const [followUp, setFollowUp] = useState(true);
  const [moveStage, setMoveStage] = useState(true);
  const ctl = useRef(null);
  const [hist, setHist] = useState([]);
  const dest = draftDestino(d || stored, leadsById, clientesById);
  const lead = dest.lead;
  const cli = dest.cliente;
  const histField = stored && stored.leadId ? "leadId" : "clienteId";
  const histValue = stored ? stored[histField] : null;

  useEffect(() => { if (stored && !dirty.current) setD({ ...stored }); }, [stored]);
  useEffect(() => {
    if (!db || !histValue) return undefined;
    return db.collection("actividades").where(histField, "==", histValue).onSnapshot((s) => setHist(s.docs.map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))), () => {});
  }, [db, histField, histValue]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);

  if (!stored || !d) return html`<${Modal} title="Borrador" onClose=${closeModal}><div class="modal-body"><p class="empty">Este borrador ya no existe.</p></div></${Modal}>`;

  const firmaUid = d.firma || stored.autor;
  const firma = equipo[firmaUid] || equipo[me.id] || {};
  const team = Object.entries(equipo).filter(([, v]) => v && v.nombre);
  const set = (patch) => { dirty.current = true; setD((x) => ({ ...x, ...patch })); };
  const save = async (patch) => {
    const next = { ...d, ...(patch || {}) };
    const fields = d.canal === "whatsapp" ? ["texto", "firma", "contactoId"] : ["asunto", "preheader", "etiqueta", "titular", "saludo", "parrafos", "puntos", "cta", "cierre", "posdata", "plantilla", "firma", "contactoId"];
    const diff = {};
    for (const k of fields) if (JSON.stringify(next[k] === undefined ? null : next[k]) !== JSON.stringify(stored[k] === undefined ? null : stored[k])) diff[k] = next[k] === undefined ? null : next[k];
    dirty.current = false;
    if (!Object.keys(diff).length) return;
    try { await api.updateDraft(id, diff); } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const ctx = { firma, cfg };
  const isMail = d.canal !== "whatsapp";
  const correo = dest.correo;
  const tel = dest.telefono;
  const contexto = cli ? clienteContexto(cli, { contacto: dest.contacto, proyecto: stored.proyectoId ? proyectosById[stored.proyectoId] : null, cobro: stored.cobroId ? cobros.find((x) => x.id === stored.cobroId) : null, solicitud: stored.solicitudId ? solicitudes.find((x) => x.id === stored.solicitudId) : null, mantenciones: mantenciones.filter((m) => m.clienteId === cli.id), hist, cfg }) : null;

  const revise = async () => {
    if (!pedido.trim() || !sampleState.fn) return;
    ctl.current = new AbortController();
    setBusy(true);
    try {
      const r = await sampleState.fn.json(promptRevision({ canal: d.canal, draft: d, pedido: pedido.trim(), lead: lead || {}, hist, contexto }), { modelTier: "default", cache: false, signal: ctl.current.signal });
      const patch = d.canal === "whatsapp" ? { texto: String((r && r.texto) || d.texto || "").trim() } : (() => { const s = sanitizeEmail(r); return { asunto: s.asunto || d.asunto, preheader: s.preheader, etiqueta: s.etiqueta, titular: s.titular, saludo: s.saludo, parrafos: s.parrafos, puntos: s.puntos, cta: s.cta, cierre: s.cierre, posdata: s.posdata }; })();
      setD((x) => ({ ...x, ...patch }));
      await api.updateDraft(id, { ...patch, generadoPor: "claude" });
      setPedido("");
      toast("Borrador actualizado por Claude.");
    } catch (e) {
      if (e && e.code !== "cancelled") { if (CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true }); toast(sampleErrorText(e) || dbErrorText(e), "bad"); }
    } finally { setBusy(false); }
  };

  const doCopyMail = async () => {
    const ok = await copyRich(renderEmail(d, { ...ctx, preview: false }), emailText(d, ctx));
    toast(ok ? "Correo copiado con el diseño. En Gmail, pégalo en el cuerpo del mensaje." : "No se pudo copiar. Usa «Copiar HTML» o selecciona la vista previa.", ok ? "" : "bad");
  };
  const doCopyHtml = async () => { const ok = await copyText(emailDocument(d, ctx)); toast(ok ? "HTML del correo copiado." : "No se pudo copiar el HTML.", ok ? "" : "bad"); };
  const doCopyWa = async () => { const ok = await copyText(d.texto || ""); toast(ok ? "Texto copiado." : "No se pudo copiar.", ok ? "" : "bad"); };

  const markSent = async () => {
    if (!lead && !cli) return;
    setSending(false);
    try {
      await save();
      const now = nowISO();
      await api.updateDraft(id, { estado: "enviado", enviado: now });
      const resumen = isMail ? `Asunto: ${d.asunto || ""}\n${clip(emailText(d, ctx), 600)}` : d.texto || "";
      if (cli) {
        await api.addAct({ clienteId: cli.id, proyectoId: stored.proyectoId || null, cobroId: stored.cobroId || null, solicitudId: stored.solicitudId || null, tipo: d.canal === "whatsapp" ? "whatsapp" : "correo", resumen, borradorId: id });
        if (stored.cobroId && cobros.some((x) => x.id === stored.cobroId)) await api.updateCobro(stored.cobroId, { ultimoRecordatorio: now });
        const sol = stored.solicitudId ? solicitudes.find((x) => x.id === stored.solicitudId) : null;
        if (sol && sol.estado === "nueva") await api.updateSolicitud(sol.id, { estado: "en_curso" });
        toast("Marcado como enviado y registrado en el historial del cliente.");
        closeModal();
        return;
      }
      await api.addAct({ leadId: lead.id, tipo: d.canal === "whatsapp" ? "whatsapp" : "correo", resumen, borradorId: id });
      const patch = { ultimoContacto: now };
      if (moveStage && etapaDe(lead) === "nuevo") { patch.etapa = "contactado"; await api.addAct({ leadId: lead.id, tipo: "etapa", de: "nuevo", a: "contactado" }); }
      await api.updateLead(lead.id, patch);
      const tarea = stored.tareaId ? (tareasPorLead[lead.id] || []).find((x) => x.id === stored.tareaId) : null;
      if (tarea) await api.updateTarea(tarea.id, { estado: "hecha", hecha: now, hechaPor: me.id || null });
      if (followUp) await api.createTarea({ leadId: lead.id, tipo: "llamar", titulo: `Seguimiento del ${isMail ? "correo" : "WhatsApp"}`, nota: clip(isMail ? d.asunto || "" : d.texto || "", 140), fecha: addBusinessDays(todayKey(), 3), hora: "", responsable: lead.responsable || yo || null, estado: "pendiente", origen: "borrador" });
      toast(tarea ? "Enviado: quedó en el historial y su tarea quedó hecha." : "Marcado como enviado y registrado en el historial.");
      closeModal();
    } catch (e) { toast(dbErrorText(e), "bad"); }
  };
  const discard = async () => { try { await api.updateDraft(id, { estado: "descartado" }); toast("Borrador descartado."); closeModal(); } catch (e) { toast(dbErrorText(e), "bad"); } };
  const restore = async () => { try { await api.updateDraft(id, { estado: "por_revisar" }); } catch (e) { toast(dbErrorText(e), "bad"); } };

  const title = `${isMail ? "Correo" : "WhatsApp"} para ${dest.nombre}`;
  const contactos = cli ? cli.contactos || [] : [];
  const blocked = !!(lead && lead.noContactar);
  const sent = stored.estado === "enviado";
  const len = (d.texto || "").length;

  const foot = html`
    ${lead ? html`<button class="btn ghost" onClick=${() => { closeModal(); openLead(lead.id); }}>Ver ficha</button>` : cli ? html`<button class="btn ghost" onClick=${() => { closeModal(); openCliente(cli.id); }}>Ver cliente</button>` : null}
    <span style="flex:1"></span>
    ${stored.estado === "descartado" ? html`<button class="btn" onClick=${restore}>Recuperar</button>` : !sent ? html`<button class="btn ghost danger" onClick=${discard} disabled=${!canWrite}>Descartar</button>` : null}
    ${isMail ? html`
      <button class="btn" onClick=${doCopyHtml}><${Icon} name="copy" />Copiar HTML</button>
      <button class="btn" onClick=${doCopyMail}><${Icon} name="copy" />Copiar correo</button>
      ${blocked ? html`<button class="btn primary" disabled>No contactar</button>` : html`<a class="btn primary" href=${gmailLink(correo, d.asunto, cfg)} target="_blank" rel="noopener" onClick=${() => { save(); doCopyMail(); }}><${Icon} name="ext" />Copiar y abrir Gmail</a>`}` : html`
      <button class="btn" onClick=${doCopyWa}><${Icon} name="copy" />Copiar texto</button>
      ${blocked ? html`<button class="btn primary" disabled>No contactar</button>` : waLink(tel, d.texto, cfg) ? html`<a class="btn primary" href=${waLink(tel, d.texto, cfg)} target="_blank" rel="noopener" onClick=${() => save()}><${Icon} name="ext" />Abrir en WhatsApp</a>` : html`<button class="btn primary" disabled>Falta el teléfono</button>`}`}
    ${!sent && (lead || cli) ? html`<button class="btn" onClick=${() => { setFollowUp(!(lead && (tareasPorLead[lead.id] || []).some((x) => x.id !== stored.tareaId))); setSending(true); }} disabled=${!canWrite}><${Icon} name="check" />Marcar como enviado</button>` : null}`;

  return html`<${Modal} title=${title} onClose=${() => { save(); closeModal(); }} wide foot=${foot} labelId="draft-title">
    <div class="editor">
      <div class="editor-fields">
        ${blocked ? html`<div class="note bad"><${Icon} name="info" /><div>Esta persona pidió no ser contactada. No envíes este mensaje.</div></div>` : null}
        ${sent ? html`<div class="note"><${Icon} name="check" /><div>Enviado ${ago(stored.enviado)}. Si lo editas, el historial conserva lo que se registró al enviarlo.</div></div>` : null}
        ${sending ? html`<div class="note" style="display:grid;gap:10px">
          <p><b>¿Ya lo enviaste?</b> Se registra en el historial ${cli ? "del cliente" : "del lead"}.</p>
          ${lead && stored.tareaId && (tareasPorLead[lead.id] || []).some((x) => x.id === stored.tareaId) ? html`<p class="small">Su tarea queda hecha.</p>` : null}
          ${lead ? html`<label class="check"><input type="checkbox" checked=${followUp} onChange=${(e) => setFollowUp(e.currentTarget.checked)} />Agregar una tarea: llamar de seguimiento en 3 días hábiles (${dayLabel(addBusinessDays(todayKey(), 3))})</label>` : null}
          ${lead && etapaDe(lead) === "nuevo" ? html`<label class="check"><input type="checkbox" checked=${moveStage} onChange=${(e) => setMoveStage(e.currentTarget.checked)} />Mover el lead a «Contactado»</label>` : null}
          <div class="actions"><button class="btn primary small" onClick=${markSent}>Sí, registrar envío</button><button class="btn small ghost" onClick=${() => setSending(false)}>Cancelar</button></div>
        </div>` : null}
        ${isMail ? html`
          ${cli && contactos.length > 1 ? html`<label class="field" for="d-para"><span>Para</span><select id="d-para" class="select" value=${(dest.contacto || {}).id || ""} onChange=${(e) => { set({ contactoId: e.currentTarget.value }); save({ contactoId: e.currentTarget.value }); }}>${contactos.map((x) => html`<option value=${x.id}>${x.nombre || "Sin nombre"}${x.correo ? " · " + x.correo : ""}</option>`)}</select></label>` : null}
          ${!correo ? html`<div class="note warn"><${Icon} name="info" /><div>${cli ? "Este contacto no tiene correo. Agrégalo en los datos del cliente" : "Este lead no tiene correo. Agrégalo en su ficha"} para abrir Gmail con el destinatario.</div></div>` : html`<p class="small muted">Para: <span class="mono">${correo}</span></p>`}
          <div class="field"><span>Diseño</span><${Seg} label="Plantilla" value=${d.plantilla || "carta"} onChange=${(v) => { set({ plantilla: v }); save({ plantilla: v }); }} options=${[["carta", "Carta"], ["destacado", "Con cabecera"]]} /></div>
          <${TextLocal} id="d-asunto" label="Asunto" value=${d.asunto} onInput=${(v) => set({ asunto: v })} onBlur=${() => save()} counter=${60} />
          <${TextLocal} id="d-pre" label="Texto de vista previa" value=${d.preheader} onInput=${(v) => set({ preheader: v })} onBlur=${() => save()} hint="Lo que se lee junto al asunto en la bandeja de entrada." counter=${90} />
          <div class="grid-2">
            <${TextLocal} id="d-etq" label="Etiqueta" value=${d.etiqueta} onInput=${(v) => set({ etiqueta: v })} onBlur=${() => save()} />
            ${d.plantilla === "destacado" ? html`<${TextLocal} id="d-tit" label="Titular" value=${d.titular} onInput=${(v) => set({ titular: v })} onBlur=${() => save()} />` : html`<span></span>`}
          </div>
          <${TextLocal} id="d-sal" label="Saludo" value=${d.saludo} onInput=${(v) => set({ saludo: v })} onBlur=${() => save()} />
          <${TextLocal} id="d-par" label="Cuerpo" multiline rows=${9} value=${(d.parrafos || []).join("\n\n")} onInput=${(v) => set({ parrafos: v.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean) })} onBlur=${() => save()} hint="Deja una línea en blanco entre párrafos. **así** queda en negrita." />
          <${TextLocal} id="d-pts" label="Viñetas (opcional, una por línea)" multiline rows=${3} value=${(d.puntos || []).join("\n")} onInput=${(v) => set({ puntos: v.split("\n").map((x) => x.trim()).filter(Boolean) })} onBlur=${() => save()} />
          <div class="grid-2">
            <${TextLocal} id="d-ctat" label="Botón: texto" value=${d.cta ? d.cta.texto : ""} onInput=${(v) => set({ cta: { texto: v, url: d.cta ? d.cta.url : (cfg.agendaUrl || AGENDA_DEFAULT) } })} onBlur=${() => save()} />
            <${TextLocal} id="d-ctau" label="Botón: enlace" value=${d.cta ? d.cta.url : ""} onInput=${(v) => set({ cta: { texto: d.cta ? d.cta.texto : "", url: v } })} onBlur=${() => save()} />
          </div>
          <div class="grid-2">
            <${TextLocal} id="d-cie" label="Despedida" value=${d.cierre} onInput=${(v) => set({ cierre: v })} onBlur=${() => save()} />

              ${!team.length ? html`<option value="">Sin firmas guardadas</option>` : null}
              ${team.map(([uid, v]) => html`<option value=${uid}>${v.nombre}</option>`)}
            </select></label>
          </div>
          <${TextLocal} id="d-ps" label="Posdata (opcional)" value=${d.posdata} onInput=${(v) => set({ posdata: v })} onBlur=${() => save()} />
        ` : html`
          ${cli && contactos.length > 1 ? html`<label class="field" for="d-para-wa"><span>Para</span><select id="d-para-wa" class="select" value=${(dest.contacto || {}).id || ""} onChange=${(e) => { set({ contactoId: e.currentTarget.value }); save({ contactoId: e.currentTarget.value }); }}>${contactos.map((x) => html`<option value=${x.id}>${x.nombre || "Sin nombre"}${x.telefono ? " · " + fmtPhone(x.telefono) : ""}</option>`)}</select></label>` : null}
          ${!tel ? html`<div class="note warn"><${Icon} name="info" /><div>${cli ? "Este contacto no tiene teléfono. Agrégalo en los datos del cliente" : "Este lead no tiene teléfono. Agrégalo en su ficha"} para abrir el chat.</div></div>` : html`<p class="small muted">Para: <span class="mono">${fmtPhone(tel)}</span> · se abre la cuenta de WhatsApp que tengas iniciada (usa la de negocios)</p>`}
          <label class="field" for="d-texto"><span>Mensaje <span class=${cx("counter", len > 700 && "over")}>${len} caracteres</span></span>
            <textarea id="d-texto" class="textarea" rows="10" value=${d.texto || ""} onInput=${(e) => set({ texto: e.currentTarget.value })} onBlur=${() => save()}></textarea>
            <small class="hint">WhatsApp: *negrita*, _cursiva_. El enlace abre el chat con este texto: revísalo y envíalo desde WhatsApp.</small></label>
        `}
        ${sampleState.fn ? html`<div class="field"><span>Pedir cambios a Claude</span>
          <textarea id="d-pedido" class="textarea" rows="2" placeholder=${isMail ? "Ej.: más corto, menciona la integración con su ERP y cambia el botón a «Ver propuesta»" : "Ej.: más cercano y propone el jueves a las 11"} value=${pedido} onInput=${(e) => setPedido(e.currentTarget.value)}></textarea>
          <div class="actions">${busy ? html`<${Thinking} text="Claude está corrigiendo…" /><button class="btn small ghost" onClick=${() => ctl.current && ctl.current.abort()}>Detener</button>` : html`<button class="btn claude small" onClick=${revise} disabled=${!pedido.trim() || !canWrite}><${Icon} name="spark" />Aplicar cambios</button>`}</div>
        </div>` : null}
      </div>
      <div class="editor-preview">
        <p class="eyebrow">Vista previa</p>
        ${isMail ? html`<${EmailPreview} draft=${d} firma=${firma} cfg=${cfg} />` : html`<div class="wa-frame"><div class="wa-bubble">${d.texto || "Escribe el mensaje a la izquierda."}<small>${fmtTime.format(new Date())}</small></div></div>`}
        ${isMail ? html`<p class="small muted">«Copiar y abrir Gmail» copia el correo con el diseño y abre un correo nuevo con destinatario y asunto: pega el cuerpo (⌘V o Ctrl+V) y envía.</p>` : null}
      </div>
    </div>
  </${Modal}>`;
}

function TextLocal({ id, label, value, onInput, onBlur, multiline, rows, hint, counter }) {
  const n = String(value || "").length;
  return html`<label class="field" for=${id}><span>${label}${counter ? html` <span class=${cx("counter", n > counter && "over")}>${n}/${counter}</span>` : null}</span>
    ${multiline ? html`<textarea id=${id} class="textarea" rows=${rows || 3} value=${value || ""} onInput=${(e) => onInput(e.currentTarget.value)} onBlur=${onBlur}></textarea>` : html`<input id=${id} class="input" value=${value || ""} onInput=${(e) => onInput(e.currentTarget.value)} onBlur=${onBlur} />`}
    ${hint ? html`<small class="hint">${hint}</small>` : null}
  </label>`;
}

        </details>

function cleanTranscript(raw) {
  return String(raw || "")
    .replace(/\r/g, "")
    .split("\n")
    .filter((l) => !/^WEBVTT/.test(l) && !/^\d+$/.test(l.trim()) && !/-->/.test(l) && !/^NOTE\b/.test(l))
    .join("\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* ===================================================================== transcripción en vivo */

/* «Transcribir en vivo»: con el celular en altavoz junto al computador, el CRM escucha con el
   micrófono del computador y el reconocimiento de voz del navegador lo pasa a texto (Chrome y Edge
   usan el servicio de voz de Google o de Microsoft). El audio no se guarda: solo el texto. Si
   claude.ai o el navegador no dejan usar el micrófono, muestra el plan B con Google Docs. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const MIC_FALLAS = {
  politica: "claude.ai no deja que el CRM use el micrófono.",
  denegado: "El navegador no dio permiso para usar el micrófono. Permítelo desde el ícono junto a la dirección de la página y vuelve a intentar.",
  sin_micro: "No se encontró un micrófono en este equipo.",
  ocupado: "Otra aplicación está usando el micrófono. Ciérrala y vuelve a intentar.",
  sin_soporte: "Este navegador no transcribe en vivo. Abre el CRM en Google Chrome o Microsoft Edge.",
  servicio: "Este navegador no pudo usar el servicio de voz. Abre el CRM en Google Chrome o Microsoft Edge, con internet.",
  red: "Se cortó la conexión con el servicio de voz. Lo transcrito hasta ahora quedó en el texto.",
};
const MIC_PLAN_B = new Set(["politica", "sin_soporte", "servicio"]);
const MIC_PASOS_B = ["Abre un documento nuevo de Google Docs en otra pestaña (docs.new).", "Herramientas → Escritura por voz; elige «Español (Chile)» y toca el micrófono.", "Al cortar, copia el texto y pégalo aquí."];
const politicaMic = () => { try { const p = document.permissionsPolicy || document.featurePolicy; return p && p.allowsFeature ? p.allowsFeature("microphone") : null; } catch (e) { return null; } };
const mmss = (s) => `${Math.floor(s / 60)}:${pad2(s % 60)}`;
const pantallaTactil = () => { try { return matchMedia("(pointer: coarse)").matches; } catch (e) { return false; } };

function LiveTranscriber({ onText, onStart, onStop, children }) {
  const { api } = useCtx();
  const [fase, setFase] = useState("listo");
  const [interim, setInterim] = useState("");
  const [falla, setFalla] = useState("");
  const [seg, setSeg] = useState(0);
  const st = useRef(null);
  const barra = useRef(null);
  const avisado = useRef({});
  const cb = useRef(null);
  cb.current = { onText, onStart, onStop };

  /* Deja anotado en la base si el micrófono funcionó, para revisarlo sin pedir capturas. */
  const diag = (d) => {
    if (!api || !api.diagMicrofono) return;
    let enMarco = true;
    try { enMarco = window.top !== window; } catch (e) { /* marco de otro origen */ }
    api.diagMicrofono({ ...d, politica: politicaMic(), enMarco, navegador: clip(navigator.userAgent || "", 220) }).catch(() => {});
  };
  const soltar = (s) => {
    clearInterval(s.reloj); clearInterval(s.medidor); clearTimeout(s.reinicio); clearTimeout(s.corte);
    if (s.stream) s.stream.getTracks().forEach((t) => t.stop());
    if (s.audio) s.audio.close().catch(() => {});
    if (s.lock) s.lock.release().catch(() => {});
  };
  useEffect(() => () => {
    const s = st.current;
    st.current = null;
    if (!s) return;
    s.quiere = false;
    try { if (s.rec) s.rec.abort(); } catch (e) { /* ya terminó */ }
    soltar(s);
  }, []);

  const cerrar = (s, motivo) => {
    if (st.current !== s) return;
    st.current = null;
    if (s.pendiente && cb.current.onText) cb.current.onText(cap(s.pendiente));
    soltar(s);
    setInterim("");
    setFase("listo");
    setFalla(motivo || "");
    if (s.t0 && cb.current.onStop) cb.current.onStop(Math.round((Date.now() - s.t0) / 1000));
  };
  const sesion = (s) => {
    const r = new SpeechRec();
    r.lang = s.lang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onstart = () => {
      if (st.current !== s) return;
      setFase((f) => (f === "iniciando" ? "escuchando" : f));
      if (!avisado.current.escuchando) { avisado.current.escuchando = true; diag({ ok: true, paso: "escuchando" }); }
    };
    r.onresult = (e) => {
      if (st.current !== s) return;
      let parcial = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const t = String((res[0] && res[0].transcript) || "").trim();
        if (!t) continue;
        if (res.isFinal) {
          s.fallasRed = 0;
          s.conTexto = true;
          if (cb.current.onText) cb.current.onText(cap(t));
          if (!avisado.current.texto) { avisado.current.texto = true; diag({ ok: true, paso: "texto" }); }
        } else parcial += (parcial ? " " : "") + t;
      }
      s.pendiente = parcial;
      setInterim(parcial);
    };
    r.onerror = (e) => {
      if (st.current !== s) return;
      const c = (e && e.error) || "";
      if (c === "no-speech" || c === "aborted") return;
      if (c === "network") { s.fallasRed += 1; return; }
      if (c === "language-not-supported" && s.lang !== "es-ES") { s.lang = "es-ES"; return; }
      const tipo = c === "not-allowed" ? (politicaMic() === false ? "politica" : "denegado") : c === "audio-capture" ? "sin_micro" : "servicio";
      s.quiere = false;
      s.falla = tipo;
      diag({ ok: false, paso: "reconocimiento", error: c, tipo });
    };
    r.onend = () => {
      if (st.current !== s) return;
      if (!s.quiere) { cerrar(s, s.falla); return; }
      /* Chrome corta la sesión tras un silencio largo o un problema de red: se retoma sola. */
      if (s.fallasRed >= 4) {
        const tipo = s.conTexto ? "red" : "servicio";
        diag({ ok: false, paso: "red", error: "network", tipo });
        cerrar(s, tipo);
        return;
      }
      const espera = s.fallasRed ? Math.min(4000, 500 * 2 ** s.fallasRed) : 250;
      s.reinicio = setTimeout(() => { if (st.current === s && s.quiere) arrancar(s); }, espera);
    };
    return r;
  };
  const arrancar = (s) => {
    try { s.rec = sesion(s); s.rec.start(); } catch (e) {
      s.quiere = false;
      diag({ ok: false, paso: "inicio", error: String((e && (e.name || e.message)) || e), tipo: "servicio" });
      cerrar(s, "servicio");
    }
  };
  const empezar = async () => {
    if (st.current) return;
    setFalla("");
    if (!SpeechRec) { setFalla("sin_soporte"); diag({ ok: false, paso: "soporte", tipo: "sin_soporte" }); return; }
    if (politicaMic() === false || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setFalla("politica"); diag({ ok: false, paso: "politica", tipo: "politica" }); return; }
    const s = { quiere: true, lang: "es-CL", fallasRed: 0, conTexto: false, pendiente: "", falla: "" };
    st.current = s;
    setFase("iniciando");
    setSeg(0);
    /* El medidor se crea con el clic: después de esperar el permiso el navegador podría no dejarlo andar. */
    const AC = window.AudioContext || window.webkitAudioContext;
    try { if (AC) s.audio = new AC(); } catch (e) { s.audio = null; }
    try {
      s.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      const n = (e && e.name) || "";
      const tipo = n === "NotFoundError" || n === "OverconstrainedError" ? "sin_micro"
        : n === "NotReadableError" || n === "AbortError" ? "ocupado"
        : n === "SecurityError" || politicaMic() === false || /polic/i.test((e && e.message) || "") ? "politica" : "denegado";
      diag({ ok: false, paso: "microfono", error: n, mensaje: clip((e && e.message) || "", 160), tipo });
      s.quiere = false;
      cerrar(s, tipo);
      return;
    }
    if (st.current !== s) { soltar(s); return; }
    if (s.audio) {
      try {
        const an = s.audio.createAnalyser();
        an.fftSize = 512;
        s.audio.createMediaStreamSource(s.stream).connect(an);
        const buf = new Uint8Array(an.fftSize);
        s.medidor = setInterval(() => {
          an.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; sum += x * x; }
          if (barra.current) barra.current.style.transform = `scaleX(${Math.min(1, Math.sqrt(sum / buf.length) * 5).toFixed(2)})`;
        }, 120);
        if (s.audio.state === "suspended") s.audio.resume().catch(() => {});
      } catch (e) { /* sin medidor */ }
    }
    try { if (navigator.wakeLock) s.lock = await navigator.wakeLock.request("screen"); } catch (e) { s.lock = null; }
    if (st.current !== s) { soltar(s); return; }
    s.t0 = Date.now();
    s.reloj = setInterval(() => setSeg(Math.round((Date.now() - s.t0) / 1000)), 1000);
    if (cb.current.onStart) cb.current.onStart();
    arrancar(s);
  };
  const detener = () => {
    const s = st.current;
    if (!s) return;
    s.quiere = false;
    if (!s.rec) { cerrar(s, ""); return; }
    setFase("cerrando");
    try { s.rec.stop(); } catch (e) { cerrar(s, ""); return; }
    /* Si el navegador no avisa que terminó, se cierra igual con lo que haya. */
    s.corte = setTimeout(() => { try { s.rec.abort(); } catch (e) { /* ya terminó */ } cerrar(s, ""); }, 2500);
  };

  if (fase === "listo") {
    return html`<div class="live">
      ${falla ? html`<div class=${cx("note", MIC_PLAN_B.has(falla) ? "warn" : "bad")} role="alert"><${Icon} name="info" /><div><b>${MIC_FALLAS[falla]}</b>${MIC_PLAN_B.has(falla) ? html`<span style="display:block;margin-top:4px">Mientras tanto, con la escritura por voz de Google Docs:</span><ol class="live-pasos">${MIC_PASOS_B.map((x) => html`<li>${x}</li>`)}</ol>` : null}</div></div>` : null}
      <div class="live-row">
        <button type="button" class="btn small" onClick=${empezar}><${Icon} name="mic" />Transcribir en vivo</button>
        <span class="small muted">${pantallaTactil() ? "Ábrelo en el computador o en otro equipo: si llamas desde este mismo celular, la llamada ocupa el micrófono." : "Con el celular en altavoz junto al computador, el CRM escucha la llamada y la pasa a texto. Funciona en Chrome o Edge."}</span>
      </div>
    </div>`;
  }
  return html`<div class="live on">
    <div class="live-head">
      <i class="rec" aria-hidden="true"></i>
      <b role="status">${fase === "iniciando" ? "Pidiendo el micrófono…" : fase === "cerrando" ? "Terminando…" : "Escuchando"}</b>
      <span class="live-time">${mmss(seg)}</span>
      <span class="live-meter" aria-hidden="true"><span ref=${barra}></span></span>
      <button type="button" class="btn small" onClick=${detener} disabled=${fase === "cerrando"}><${Icon} name="stop" />Detener</button>
    </div>
    ${interim ? html`<p class="live-text">${interim}</p>` : html`<p class="small muted" style="margin:0">${fase === "iniciando" ? "Si el navegador pregunta, permite usar el micrófono." : "Pon el celular en altavoz cerca del computador. No cierres esta pestaña: el audio no se guarda, solo el texto."}</p>`}
    ${fase === "escuchando" ? children : null}
  </div>`;
}

/* «¿Qué le respondo?»: una consulta a Claude Haiku por cada toque, nunca en bucle. */
function AyudaEnVivo({ lead, texto, notas, pista, onUsada }) {
  const { sampleState, setSampleState } = useCtx();
  const [r, setR] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const ctl = useRef(null);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  if (!sampleState.fn) return null;
  const pedir = async () => {
    if (busy) return;
    ctl.current = new AbortController();
    setBusy(true);
    setError("");
    try {
      const v = sanitizeAyuda(await sampleState.fn.json(promptAyudaVivo({ lead, texto, notas }), { model: HAIKU, modelTier: "quick", cache: false, signal: ctl.current.signal }));
      if (!v.respuesta) throw { code: "empty_completion" };
      setR(v);
      if (onUsada) onUsada();
    } catch (e) {
      if (e && e.code === "cancelled") return;
      if (e && CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true });
      setError(e && e.code === "rate_limited" ? "Claude está ocupado. Prueba de nuevo en unos segundos." : sampleErrorText(e));
    } finally { setBusy(false); }
  };
  return html`<div class="coach">
    <div class="coach-row">
      <button type="button" class=${cx("btn small claude", pista && !busy && "pulse")} onClick=${pedir} disabled=${busy || !String(texto || "").trim()}><${Icon} name="spark" />${busy ? "Pensando…" : "¿Qué le respondo?"}</button>
      <span class=${cx("small", pista ? "coach-pista" : "muted")}>${pista || "Tócalo cuando el lead ponga una objeción o haga una pregunta."}</span>
    </div>
    ${error ? html`<p class="small" style="margin:0;color:var(--bad)">${error}</p>` : null}
    ${r ? html`<div class="coach-card">
      ${r.detecte ? html`<p class="small muted" style="margin:0">${r.detecte}</p>` : null}
      <p class="coach-say">«${r.respuesta}»</p>
      ${r.pregunta ? html`<p class="small" style="margin:0"><b>Después pregunta:</b> «${r.pregunta}»</p>` : null}
      ${r.evitar ? html`<p class="small muted" style="margin:0">Evita: ${r.evitar}</p>` : null}
    </div>` : null}
  </div>`;
}

/* Registrar una llamada o una reunión. Con «Automático» (lo normal), al detener la grabación
   Claude la analiza y se guarda sola: la actividad, las tareas acordadas (con la reunión si quedó
   día), la etapa que corresponde y los borradores de los mensajes. Sin «Automático», muestra el
   análisis para revisar antes de guardar. */
function RegistroContacto({ lead, hist, onDone, modo }) {
  const { api, toast, sampleState, setSampleState, cfg, canWrite, redactarTareas, tareasPorLead, yo, me, changeStage } = useCtx();
  const esReunion = modo === "reunion";
  const nombreReg = esReunion ? "reunión" : "llamada";
  const llave = (esReunion ? "reunion:" : "llamada:") + lead.id;
  const [previo] = useState(() => borradorLocal(llave));
  const [resultado, setResultado] = useState(esReunion ? "realizada" : "");
  const [linea, setLinea] = useState(() => ls.get("linea", "negocios"));
  const [duracion, setDuracion] = useState(() => (previo && previo.duracion) || "");
  const [notas, setNotasE] = useState(() => (previo && previo.notas) || "");
  const [trans, setTransE] = useState(() => (previo && previo.trans) || "");
  /* Lo escrito y lo transcrito también van en refs: al detener la grabación, el análisis tiene que
     leer hasta la última frase, aunque todavía no se haya vuelto a dibujar la pantalla. */
  const notasRef = useRef(notas);
  const transRef = useRef(trans);
  const ponerNotas = (v) => { notasRef.current = v; setNotasE(v); };
  const ponerTrans = (v) => { transRef.current = v; setTransE(v); };
  const [showTrans, setShowTrans] = useState(() => !!(previo && previo.trans));
  const [an, setAn] = useState(null);
  const [fase, setFase] = useState("");
  const [auto, setAuto] = useState(() => ls.get("autoGuardar", true));
  const [useStage, setUseStage] = useState(true);
  const [useReunion, setUseReunion] = useState(true);
  const [useData, setUseData] = useState(true);
  const [selT, setSelT] = useState({});
  const [conBorr, setConBorr] = useState(true);
  const [retry, setRetry] = useState(true);
  const [toContactado, setToContactado] = useState(true);
  const [guardarTrans, setGuardarTrans] = useState(() => ls.get("guardarTrans", false));
  const [enVivo, setEnVivo] = useState(() => !!(previo && previo.enVivo));
  const enVivoRef = useRef(enVivo);
  const [pista, setPista] = useState("");
  const ctl = useRef(null);
  const pistaT = useRef(null);
  useEffect(() => () => clearTimeout(pistaT.current), []);
  useEffect(() => ls.set("linea", linea), [linea]);
  useEffect(() => { if (notas.trim() || trans.trim()) ls.set(llave, { notas, trans, duracion, enVivo, t: Date.now() }); else ls.del(llave); }, [notas, trans, duracion, enVivo]);
  useEffect(() => ls.set("guardarTrans", guardarTrans), [guardarTrans]);
  const cancelar = () => { if (ctl.current) ctl.current.abort(); ls.del(llave); onDone(null); };

  const contesto = !esReunion && (resultado === "contesto" || resultado === "volver");
  const sinResp = SIN_RESPUESTA.has(resultado);
  const hoy = todayKey();

  const readFile = (file) => {
    if (!file) return;
    if (file.size > 2e6) { toast("El archivo es muy grande. Pega solo el texto de la transcripción.", "bad"); return; }
    const r = new FileReader();
    r.onload = () => { ponerTrans(cleanTranscript(r.result)); setShowTrans(true); };
    r.onerror = () => toast("No se pudo leer el archivo.", "bad");
    r.readAsText(file);
  };

  const nuevosDatosDe = (a) => (a ? Object.entries(a.datos).filter(([k, v]) => v && !lead[k]) : []);
  const pedirAnalisis = async (res) => {
    ctl.current = new AbortController();
    return sanitizeAnalisis(await sampleState.fn.json(promptLlamada({ lead, hist, modo, resultado: res, notas: notasRef.current, transcripcion: transRef.current, enVivo: enVivoRef.current }), { modelTier: "default", cache: false, signal: ctl.current.signal }));
  };
  const prepararRevision = (s) => {
    setAn(s);
    setSelT(Object.fromEntries(s.tareas.map((x, i) => [i, x.quien === "zh"])));
    setUseStage(!!s.etapaSugerida && s.etapaSugerida !== etapaDe(lead) && (avanza(lead, s.etapaSugerida) || CERRADAS.includes(s.etapaSugerida)));
    setUseReunion(!!s.reunion);
    setUseData(nuevosDatosDe(s).length > 0);
  };
  const fallaClaude = (e) => {
    setFase("");
    if (e && e.code === "cancelled") return;
    if (e && CLAUDE_OFF.has(e.code)) setSampleState({ fn: null, off: true });
    toast(`${sampleErrorText(e)} Lo escrito sigue aquí: guárdalo sin análisis o vuelve a intentar.`, "bad");
  };
  const analizar = async () => {
    if (!sampleState.fn || fase) return;
    setFase("analizando");
    try { prepararRevision(await pedirAnalisis(esReunion ? "realizada" : resultado)); setFase(""); } catch (e) { fallaClaude(e); }
  };

  const guardar = async ({ res, a, dur, auto: esAuto }) => {
    if (!res) { toast("Elige el resultado de la llamada.", "bad"); return; }
    setFase("guardando");
    try {
      const now = nowISO();
      const nt = notasRef.current.trim();
      const tx = transRef.current;
      const transcripcion = tx.length > 180000 ? tx.slice(0, 180000) + "\n[transcripción recortada]" : tx;
      const sinR = SIN_RESPUESTA.has(res);
      const actId = await api.addAct({ leadId: lead.id, tipo: esReunion ? "reunion" : "llamada", ...(esReunion ? {} : { resultado: res, linea }), duracion: Number(dur) > 0 ? Number(dur) : null, resumen: nt || (a ? a.resumen : ""), transcripcion: guardarTrans && transcripcion.trim() ? transcripcion : null, analisis: a || null });
      const de = etapaDe(lead);
      const patch = {};
      if (!esReunion) { patch.ultimoIntento = now; patch.intentos = sinR ? (lead.intentos || 0) + 1 : 0; }
      if (!sinR && res !== "equivocado") patch.ultimoContacto = now;
      /* La etapa queda en lo más avanzado de lo que pasó; lo automático nunca retrocede. */
      const sug = a ? a.etapaSugerida : "";
      const cand = [];
      if (!esReunion && !sinR && res !== "equivocado" && de === "nuevo" && (esAuto || toContactado)) cand.push("contactado");
      if (esReunion) cand.push("reunion_concretada");
      if (a && a.reunion && (esAuto || useReunion)) cand.push("reunion_agendada");
      if (sug && RUTA.includes(sug) && (esAuto || useStage)) cand.push(sug);
      let etapa = de;
      for (const c of cand) if (avanza({ etapa }, c)) etapa = c;
      if (etapa !== de) { patch.etapa = etapa; await api.addAct({ leadId: lead.id, tipo: "etapa", de, a: etapa }); }
      if (a && (esAuto || useData)) for (const [k, v] of nuevosDatosDe(a)) patch[k] = k === "correo" ? v.toLowerCase() : v;
      /* Lo que tocaba queda hecho: la llamada cumple las tareas de llamar que vencían y la reunión,
         la reunión que estaba agendada. */
      const pend = tareasPorLead[lead.id] || [];
      const hechas = esReunion ? pend.filter((x) => tipoTarea(x.tipo) === "reunion").slice(0, 1) : pend.filter((x) => tipoTarea(x.tipo) === "llamar" && x.fecha <= hoy);
      const vieja = pend.length ? null : tareaDeProxima(lead);
      if (vieja && vieja.fecha <= hoy && (esReunion ? vieja.tipo === "reunion" : vieja.tipo === "llamar")) { patch.proxima = null; hechas.push(vieja); }
      await api.updateLead(lead.id, patch);
      for (const x of hechas) if (!x.virtual) await api.updateTarea(x.id, { estado: "hecha", hecha: now, hechaPor: me.id || null, actividadId: actId });
      /* Tareas nuevas: la reunión si quedó con día, lo que quedó en hacer ZH y, si no contestó, volver a llamar. */
      const base = { leadId: lead.id, estado: "pendiente", responsable: lead.responsable || yo || null, origen: esReunion ? "reunion" : "llamada", actividadId: actId };
      const nuevas = [];
      if (a && a.reunion && (esAuto || useReunion) && !pend.some((x) => tipoTarea(x.tipo) === "reunion" && x.fecha === a.reunion.fecha && !hechas.includes(x))) nuevas.push({ ...base, tipo: "reunion", titulo: a.reunion.titulo || "Reunión", fecha: a.reunion.fecha, hora: a.reunion.hora, duracion: a.reunion.duracion });
      if (a) a.tareas.forEach((x, i) => { if (x.quien === "zh" && (esAuto || selT[i])) nuevas.push({ ...base, tipo: x.tipo, titulo: x.que, fecha: x.fecha || fechaPorDefecto(x.tipo), hora: x.hora || "" }); });
      const n = (lead.intentos || 0) + 1;
      if (!esReunion && sinR && retry && !nuevas.some((x) => x.tipo === "llamar" || x.tipo === "whatsapp")) nuevas.push({ ...base, tipo: "llamar", titulo: `Volver a llamar (${n} ${n === 1 ? "intento" : "intentos"} sin respuesta)`, fecha: addBusinessDays(hoy, 1), hora: "" });
      const ids = [];
      for (const x of nuevas) ids.push(await api.createTarea(x));
      ls.del(llave);
      /* Los correos y WhatsApp acordados quedan redactados, cada uno unido a su tarea. */
      const jobs = (esAuto || conBorr) && sampleState.fn && !lead.noContactar ? nuevas.map((x, i) => ({ tipo: x.tipo, que: x.titulo, fecha: x.fecha, tareaId: ids[i] })).filter((x) => TAREA_MENSAJE.has(x.tipo)) : [];
      if (jobs.length && redactarTareas) redactarTareas({ ...lead, ...patch }, jobs, a ? a.tareas.filter((x) => x.quien === "lead") : [], [{ tipo: esReunion ? "reunion" : "llamada", fecha: now, resultado: res, resumen: nt || (a ? a.resumen : ""), analisis: a }, ...hist]);
      const cierre = sug && CERRADAS.includes(sug) && sug !== etapa ? sug : "";
      toast(`${esReunion ? "Reunión" : "Llamada"} guardada${nuevas.length ? ` · ${nuevas.length} ${nuevas.length === 1 ? "tarea nueva" : "tareas nuevas"}` : ""}${etapa !== de ? ` · ${etapaLabel(etapa)}` : ""}.`);
      onDone({ tipo: esReunion ? "reunion" : "llamada", conAnalisis: !!a, de, a: etapa !== de ? etapa : "", nuevas: nuevas.map((x) => ({ titulo: x.titulo, tipo: x.tipo, fecha: x.fecha, hora: x.hora || "" })), hechas: hechas.length, borradores: jobs.length, sugerencia: esAuto ? cierre : "" });
      if (!esAuto && cierre && useStage) changeStage({ ...lead, ...patch }, cierre);
    } catch (e) { toast(dbErrorText(e), "bad"); setFase(""); }
  };

  /* «Analizar y guardar»: lo que pasa solo al detener la grabación, o con un clic. */
  const analizarYGuardar = async (res, dur) => {
    if (!sampleState.fn || fase) return;
    setFase("analizando");
    let s;
    try { s = await pedirAnalisis(res); } catch (e) { fallaClaude(e); return; }
    prepararRevision(s);
    await guardar({ res, a: s, dur, auto: true });
  };
  const alDetener = (segundos) => {
    const dur = duracion || (segundos >= 30 ? String(Math.max(1, Math.round(segundos / 60))) : "");
    if (dur !== duracion) setDuracion(dur);
    if (!auto || !sampleState.fn || !canWrite || fase || transRef.current.trim().length < 80) return;
    const res = esReunion ? "realizada" : resultado || "contesto";
    if (res !== resultado) setResultado(res);
    analizarYGuardar(res, dur);
  };

  const hayTexto = !!(notas.trim() || trans.trim());
  const ocupado = !!fase;
  const puedeClaude = !!sampleState.fn && hayTexto;
  const nuevosDatos = nuevosDatosDe(an);
  const guardarManual = () => guardar({ res: esReunion ? "realizada" : resultado, a: an, dur: duracion, auto: false });
  const analizarYGuardarClick = () => { const res = esReunion ? "realizada" : resultado; if (!res) { toast("Elige el resultado de la llamada.", "bad"); return; } analizarYGuardar(res, duracion); };

  return html`<div class="work-body">
    ${!esReunion && lead.telefono ? html`<div class="cline" style="background:var(--surface-2)">
      <span class="value" style="font-size:18px">${fmtPhone(lead.telefono)}</span>
      <a class="btn small" href=${"tel:" + lead.telefono}><${Icon} name="phone" />Llamar</a>
      <span class="small muted" style="flex-basis:100%">${cfg.whatsappNegocios ? `Llama desde la línea de negocios (${fmtPhone(normPhone(cfg.whatsappNegocios))}).` : "Llama desde la línea de negocios."} Si el botón no abre el teléfono, marca el número a mano.</span>
    </div>` : null}
    ${esReunion ? html`<p class="small muted">Si la reunión es por Meet en este computador, toca «Transcribir en vivo» y deja esta pestaña abierta. También puedes pegar tus notas o la transcripción de Meet.</p>` : null}

function Composer({ lead, hist, onDone }) {
  const { api, toast, sampleState, setSampleState, cfg, me, equipo, openDraft, canWrite } = useCtx();
  const def = { nuevo: "primer_contacto", contactado: "seguimiento", reunion_agendada: "confirmar", reunion_concretada: "gracias", propuesta: "seguimiento", negociacion: "seguimiento", pausa: "reactivar", perdido: "reactivar", ganado: "gracias" };
  const [canal, setCanal] = useState(lead.telefono ? "whatsapp" : "correo");

  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const firmaUid = me.id || "";
  const firma = equipo[firmaUid] || {};

  const crear = async (conClaude) => {
    setBusy(conClaude);
    try {
      let data = { leadId: lead.id, canal, objetivo, instrucciones: instr.trim(), firma: firmaUid || null };
      if (conClaude) {
        ctl.current = new AbortController();
        const r = await sampleState.fn.json(promptBorrador({ canal, objetivo, instrucciones: instr.trim(), trato, firma, cfg, lead, hist }), { modelTier: "default", cache: false, signal: ctl.current.signal });
        if (canal === "whatsapp") data.texto = String((r && r.texto) || "").trim();

function OtherLogger({ lead, onDone }) {
  const { api, toast, canWrite, tareasPorLead, me } = useCtx();
  const [tipo, setTipo] = useState("nota");
  const [texto, setTexto] = useState("");
  const [saving, setSaving] = useState(false);
  const guardar = async () => {
    if (!texto.trim()) { toast("Escribe qué pasó.", "bad"); return; }
    setSaving(true);
    try {
      const actId = await api.addAct({ leadId: lead.id, tipo, resumen: texto.trim() });
      let hechas = 0;
      if (CONTACTOS.has(tipo)) {
        const patch = { ultimoContacto: nowISO() };
        if (etapaDe(lead) === "nuevo") { patch.etapa = "contactado"; await api.addAct({ leadId: lead.id, tipo: "etapa", de: "nuevo", a: "contactado" }); }
        await api.updateLead(lead.id, patch);
        /* Un mensaje que se mandó por fuera cumple la tarea de ese mensaje. */
        for (const x of tareasPorLead[lead.id] || []) {
          if (tipoTarea(x.tipo) === tipo && x.fecha <= todayKey()) { await api.updateTarea(x.id, { estado: "hecha", hecha: nowISO(), hechaPor: me.id || null, actividadId: actId }); hechas += 1; }
        }
      }
      toast(hechas ? `Registrado. ${hechas === 1 ? "La tarea quedó hecha" : `Quedaron hechas ${hechas} tareas`}.` : "Registrado en el historial.");
      onDone();
    } catch (e) { toast(dbErrorText(e), "bad"); setSaving(false); }
  };
  return html`<div class="work-body">
    <div class="field"><span>Qué registras</span><${Chips} label="Tipo" value=${tipo} onChange=${setTipo} options=${REGISTROS} /></div>
    <label class="field" for="o-texto"><span>${tipo === "nota" ? "Nota" : "Qué mandaste o qué respondió"}</span><textarea id="o-texto" class="textarea" rows="4" value=${texto} onInput=${(e) => setTexto(e.currentTarget.value)} placeholder=${tipo === "nota" ? "" : "Pega el mensaje que mandaste o lo que respondió"}></textarea></label>
    <div class="actions"><button class="btn primary" onClick=${guardar} disabled=${saving || !canWrite}>Guardar</button><button class="btn ghost" onClick=${onDone}>Cancelar</button></div>
  </div>`;
}

function DueTag({ fecha, label }) {

  const d = diffDays(todayKey(), fecha);
  const cls = d < 0 ? "tag late" : d === 0 ? "tag today" : d <= 3 ? "tag warn" : "tag";

function CobroTag({ x }) {

  if (x.estado === "pagado") return html`<span class="tag ok">Pagado${x.fechaPago ? " · " + dayLabel(x.fechaPago).toLowerCase() : ""}</span>`;
  if (x.estado === "anulado") return html`<span class="tag">Anulado</span>`;
  if (x.estado === "facturado") {
    const v = venceCobro(x, cfg);
    if (v && v < todayKey()) return html`<span class="tag late">Vencido hace ${diffDays(v, todayKey())} d</span>`;
    return html`<span class="tag today">Facturado${v ? " · vence " + dayLabel(v).toLowerCase() : ""}</span>`;

function InlineInput({ value, onCommit, ...rest }) {
  const [v, setV] = useState(value || "");

function resumenCliente(cid, d, cfg) {
  const ps = d.proyectos.filter((p) => p.clienteId === cid);
  const ms = d.mantenciones.filter((m) => m.clienteId === cid && m.estado === "activa");
  const cs = d.cobros.filter((x) => x.clienteId === cid && x.estado !== "anulado");
  const vencidos = cs.filter((x) => pagoVencido(x, cfg));
  return {
    ps,
    activos: ps.filter((p) => PROYECTO_VIVO.has(p.estado) && p.estado !== "mejorar"),
    garantia: ps.filter((p) => enGarantia(p, cfg)),
    ms, mrr: sum(ms, (m) => m.monto),
    sols: d.solicitudes.filter((s) => s.clienteId === cid && SOL_ABIERTA.has(s.estado)),
    porCobrar: sum(cs.filter(pendienteCobro), (x) => x.monto),
    vencido: sum(vencidos, (x) => x.monto), nVencidos: vencidos.length,
    cobrado: sum(cs.filter((x) => x.estado === "pagado"), (x) => x.monto),
  };
}
const tieneServicio = (r) => !!(r.activos.length || r.garantia.length || r.ms.length || r.sols.length || r.porCobrar);
/* La etapa del cliente: la que se fijó al mover la tarjeta o, si no, la que dicen sus servicios. */
function etapaDeCliente(c, r) {
  if (c && ETAPA_CLIENTE[c.etapa]) return c.etapa;
  if (r.activos.some((p) => EN_DESARROLLO.has(p.estado))) return "desarrollo";
  if (r.activos.length) return "inicio";
  if (r.garantia.length) return "garantia";
  if (r.ms.length) return "mantencion";
  return "sin_servicio";
}
/* Un proyecto nuevo devuelve al cliente a su etapa automática (si estaba en «Nueva propuesta», la ganó). */
async function etapaAutomatica(api, c, proyectos) {
  if (!c || !c.etapa) return;
  const dev = proyectos.some((p) => p.clienteId === c.id && EN_DESARROLLO.has(p.estado));
  await api.updateCliente(c.id, { etapa: null, propuesta: null });

}
function ServiciosTags({ r }) {

/* Lo que viene con los clientes: hitos, entregas, garantías por terminar, facturas por emitir y pagos por vencer. */
function agendaClientes(d, cfg, dias) {
  const t = todayKey();
  const lim = addDays(t, dias == null ? 7 : dias);
  const cn = (id) => clienteName(d.clientesById[id]);
  const out = [];
  for (const p of d.proyectos) {
    if (!PROYECTO_VIVO.has(p.estado)) continue;
    const sub = `${p.nombre || "Proyecto"} · ${cn(p.clienteId)}`;
    for (const h of hitosDe(p)) if (!h.hecho && isKey(h.fecha) && h.fecha <= lim) out.push({ key: "h-" + p.id + "-" + h.id, kind: "hito", fecha: h.fecha, titulo: h.nombre || "Hito", sub, open: { proyecto: p.id } });
    if ((EN_DESARROLLO.has(p.estado) || p.estado === "por_iniciar") && isKey(p.entregaEstimada) && p.entregaEstimada <= lim) out.push({ key: "e-" + p.id, kind: "entrega", fecha: p.entregaEstimada, titulo: "Entrega estimada", sub, open: { proyecto: p.id } });
    const g = garantiaHasta(p, cfg);
    if (p.estado === "mejorar" && g && g <= addDays(t, 14)) out.push({ key: "g-" + p.id, kind: "garantia", fecha: g, titulo: g < t ? "Terminó la garantía: cerrar el proyecto o pasar a mantención" : "Termina la garantía", sub, open: { proyecto: p.id } });
  }
  for (const x of d.cobros) {
    if (x.estado === "por_facturar" && isKey(x.fecha) && x.fecha <= lim) out.push({ key: "f-" + x.id, kind: "facturar", fecha: x.fecha, titulo: `Facturar: ${x.concepto || tipoCobroLabel(x.tipo)}`, sub: `${money(x.monto)} + IVA · ${cn(x.clienteId)}`, open: { cobro: x.id } });
    const v = venceCobro(x, cfg);
    if (x.estado === "facturado" && v && v <= addDays(t, 3)) out.push({ key: "p-" + x.id, kind: "pago", fecha: v, titulo: v < t ? `Pago atrasado${x.factura ? ": factura " + x.factura : ""}` : `Vence el pago${x.factura ? " de la factura " + x.factura : ""}`, sub: `${money(conIva(x.monto))} con IVA · ${cn(x.clienteId)}`, open: { cobro: x.id } });
  }
  return out.sort((a, b) => a.fecha.localeCompare(b.fecha));
}

    <span class=${cx("irow-ico", it.fecha < todayKey() && "bad")}><${Icon} name=${AG_ICON[it.kind] || "cal"} /></span>

}

      ${canWrite && x.estado === "facturado" ? html`<button class="btn small" onClick=${() => setModo(modo === "pagar" ? "" : "pagar")}>Registrar pago</button>` : null}

/* Calendario de cobros por hitos (P-013). El último cobro absorbe el redondeo. */
async function crearPlanPago(api, base, planId, valor, fechas) {
  const plan = PLANES_PAGO.find((x) => x[0] === planId);
  if (!plan || !(valor > 0)) return 0;
  const items = plan[2];
  let acumulado = 0;
  for (let i = 0; i < items.length; i++) {
    const [tipo, label, pct] = items[i];
    const monto = i === items.length - 1 ? valor - acumulado : Math.round((valor * pct) / 100);
    acumulado += monto;
    await api.createCobro({ ...base, tipo, concepto: `${label} (${pct}%)`, monto, fecha: (fechas && fechas[tipo]) || "", estado: "por_facturar" });
  }
  return items.length;
}
function PlanPreview({ planId, valor, fechas }) {
  const plan = PLANES_PAGO.find((x) => x[0] === planId);
  if (!plan || !plan[2].length) return html`<p class="small muted">Sin calendario por ahora: los cobros se agregan después desde el proyecto.</p>`;
  if (!(valor > 0)) return html`<p class="small muted">Escribe el valor del proyecto para calcular los montos.</p>`;
  let acc = 0;
  return html`<div class="irows">${plan[2].map(([tipo, label, pct], i) => {
    const m = i === plan[2].length - 1 ? valor - acc : Math.round((valor * pct) / 100);
    acc += m;
    return html`<div class="irow" key=${tipo + i}><span class="irow-ico"><${Icon} name="coin" /></span><span class="irow-main" style="cursor:default"><b>${label} (${pct}%)</b><span>${fechas && fechas[tipo] ? "Facturar " + dayLabel(fechas[tipo]).toLowerCase() : "Fecha por definir"}</span></span><div class="irow-side"><${Amount} n=${m} /></div></div>`;
  })}</div>`;
}

/* Mensualidades: un cobro por mantención activa y por mes, con id fijo para no duplicar. */
async function generarMensualidades(api, mantenciones, ids, mk) {
  let n = 0;
  const ini = mk + "-01";
  const fin = lastDayOf(mk);
  for (const m of mantenciones) {
    if (m.estado !== "activa" || !(Number(m.monto) > 0) || !isKey(m.inicio) || m.inicio > fin || (isKey(m.fin) && m.fin < ini)) continue;
    const id = `cob-m-${m.id}-${mk}`;
    if (ids.has(id)) continue;
    const dia = Math.min(28, Math.max(1, Number(m.diaCobro) || 1));
    let fecha = `${mk}-${pad2(dia)}`;
    if (fecha < m.inicio) fecha = m.inicio;
    if (await api.ensureCobro(id, { clienteId: m.clienteId, proyectoId: m.proyectoId || null, mantencionId: m.id, tipo: "mensualidad", concepto: `${m.plan || "Mantención"} · ${monthLabel(mk).toLowerCase()}`, monto: Number(m.monto), fecha, estado: "por_facturar", generado: true })) n += 1;
  }
  return n;
}

          <td><div class="actions"><${ServiciosTags} r=${r} /></div></td>
